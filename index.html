ct extracted fields in the review UI before records are saved to the contract repository, but only the final values are stored. Field accuracy has slowly declined as new supplier templates appear, and the team learns about problems only from reviewer complaints. Which change best closes the gap?","options":{"A":"Store each reviewer correction with the original output, add it to the eval set, and re-run evals before shipping prompt changes.","B":"Schedule a quarterly prompt rewrite in which the original developers update instructions based on the error types they remember from complaints.","C":"Ask the model to return a confidence score for each field and save fields above a fixed threshold to the repository without reviewer involvement.","D":"Switch extraction to the most capable model tier whenever a document arrives from a supplier template that has not been seen before."},"domain":1,"correct":["A"],"qk":"only the final values are stored","ak":{"A":"Store each reviewer correction with the original output"}},{"id":75,"question":"A telecom company receives 40,000 support emails a day. About 70% are routine billing or plan questions; the rest are technical faults or contract disputes that need deeper reasoning and different knowledge sources. Today one large prompt on the most capable model handles every email, and both cost and answer quality on routine emails are poor. Which pattern fits best?","options":{"A":"An autonomous agent with every knowledge source and tool, which decides for each email how many steps to take and which sources to use.","B":"Parallel voting, in which three model calls answer each email independently and the most common answer is sent to the customer.","C":"Routing, in which a first step classifies each email and sends it to a specialized prompt and model tier for its category.","D":"Prompt chaining, in which every email passes through the billing, technical and dispute prompts in sequence before a reply is drafted."},"domain":1,"correct":["C"],"qk":"About 70% are routine","ak":{"C":"Routing"}},{"id":76,"question":"Before an architecture review board meeting, a platform team proposes patterns for five Claude workloads. You must flag which proposals are sound so the board can approve them without rework. Which two pairings of workload and pattern are sound? (Select two.)","options":{"A":"A nightly report that always runs the same four dependent steps, assigned to an autonomous agent so it can adapt each night.","B":"An extract, then validate, then summarize pipeline, run as parallel calls because the three stages are separate concerns.","C":"A review of one vendor contract for legal, financial and security issues, run as parallel sectioned calls whose findings are merged.","D":"Marketing copy with no agreed quality criteria, run as an evaluator-optimizer loop until the evaluator is satisfied with it.","E":"A library upgrade whose affected files are only known after analysis, run as orchestrator-workers that plan subtasks at runtime."},"domain":1,"correct":["C","E"],"qk":"pairings of workload and pattern","ak":{"C":"parallel sectioned calls","E":"orchestrator-workers"}},{"id":77,"question":"A lender's loan-file assistant uses one long prompt that parses bank statements, computes debt-to-income ratios, checks policy thresholds, flags missing documents and drafts an underwriter memo. About 8% of runs produce a wrong memo, and engineers cannot tell which part of the prompt failed or retry just that part. What decomposition should you recommend?","options":{"A":"Keep the single prompt but add few-shot examples covering each failure type seen so far, and re-run the whole prompt when a memo looks wrong.","B":"Move parsing, ratios and threshold checks into code, and split gap detection and memo drafting into separate, individually tested calls.","C":"Convert the prompt into an autonomous agent that decides the order of parsing, calculation and drafting for each loan file it receives.","D":"Run the single prompt three times per loan file and send the underwriter whichever memo appears most often across the three runs."},"domain":1,"correct":["B"],"qk":"cannot tell which part of the prompt failed","ak":{"B":"Move parsing, ratios and threshold checks into code"}},{"id":78,"question":"A company is designing an employee-services assistant that will cover payroll questions, leave requests and IT access requests, with about 25 planned tools. Leave balances and access approvals follow fixed policy rules. The first draft puts every tool behind one agent with a single long system prompt. Which two decomposition choices should you make before building? (Select two.)","options":{"A":"Keep one agent with all 25 tools and write longer tool descriptions so the model can tell similar payroll, leave and access tools apart.","B":"Put a router agent in front of the single agent to filter its 25 tools per request, leaving the agent's prompt and scope unchanged.","C":"Give each domain agent the complete set of 25 tools so that any agent can still finish a request that happens to cross domains.","D":"Compute leave balances and evaluate access-approval rules in code, with Claude extracting the request details and explaining the outcome.","E":"Group the tools by business domain into payroll, leave and IT-access agents, each holding only the tools its own workflow needs."},"domain":1,"correct":["D","E"],"qk":"every tool behind one agent","ak":{"D":"Compute leave balances and evaluate access-approval rules in code","E":"Group the tools by business domain"}},{"id":79,"question":"A team built a five-agent system to answer employee questions about a single 20-page travel policy: a lead agent delegates to subagents for flights, hotels, meals, per-diem rules and approvals, then merges their answers. Each question is short, the policy fits easily in one context, and token cost is about five times that of the original single-call prototype with no measured quality gain. What should you recommend?","options":{"A":"Keep the design but move all five subagents to the lightest model tier, so the multi-agent structure stays while per-question cost falls.","B":"Add a sixth reviewer subagent that checks the merged answer, so the additional cost buys a measurable improvement in answer quality.","C":"Let every subagent read the lead agent's full conversation history, so that fewer clarification rounds are needed between the agents.","D":"Return to a single augmented call with the policy in a cacheable prefix, since the task has no real parallelism or context-isolation need."},"domain":1,"correct":["D"],"qk":"Five-agent system","ak":{"D":"Return to a single augmented call"}},{"id":80,"question":"Six months after rolling out Claude assistants to a tax advisory firm's associates and its internal engineering group, the CFO asks you to report productivity gains specifically, kept separate from efficiency, transformation, cost and SLA results. Which two stakeholder statements are primarily productivity evidence? (Select two.)","options":{"A":"Tax associates now spend their afternoons on client advisory work that they previously had no time to take on.","B":"Each tax associate now completes about 35% more standard returns per week than before the rollout began.","C":"Engineers now spend review time on architecture risks instead of hunting for formatting and naming issues.","D":"The firm closed its manual return-preparation desk and moved those staff into a new advisory service line.","E":"Peak-season response times stayed within the committed 4-second target throughout the filing deadline."},"domain":1,"correct":["A","C"],"qk":"productivity gains specifically","ak":{"A":"client advisory work","C":"architecture risks instead of hunting for formatting"}},{"id":81,"question":"A claims-intake assistant writes a free-text reply, and a downstream service parses that text with regular expressions to decide whether to open a case in the claims system. After a prompt update, the integration began failing whenever the model phrased its decision differently, and two malformed decisions were acted on before anyone noticed. Which change most directly fixes the root cause?","options":{"A":"Lower the sampling temperature so that the model phrases its decision the same way on every request.","B":"Add more regular-expression patterns to the parser to cover each new phrasing as it appears in the logs.","C":"Add an instruction telling the model to always use the exact wording 'OPEN CASE' or 'NO CASE' in its reply.","D":"Request output in a defined JSON schema and validate it in code before the claims service acts on a decision."},"domain":2,"correct":["D"],"qk":"parses that text with regular expressions","ak":{"D":"defined JSON schema"}},{"id":82,"question":"A retail bank's card-support assistant has a system prompt that says only \"be careful with sensitive topics.\" Evaluation shows it sometimes gives investment suggestions and sometimes discusses other customers' accounts, and in a red-team test it followed instructions hidden inside a pasted customer email. Retrieved policy text and the customer message are concatenated with the instructions as plain text. Which two changes should you make to the prompt design? (Select two.)","options":{"A":"List explicit out-of-scope categories, such as investment advice and other customers' accounts, with a fixed handoff response.","B":"Lower the sampling temperature so that responses on sensitive topics become more conservative and repeatable.","C":"Log every response that mentions a sensitive topic so that the compliance team can review them each week.","D":"Add an instruction telling the model to use its best judgment about which topics are too sensitive to answer.","E":"Wrap the policy text and the customer message in separate XML tags and instruct the model to treat them as data."},"domain":2,"correct":["A","E"],"qk":"be careful with sensitive topics","ak":{"A":"explicit out-of-scope categories","E":"separate XML tags"}},{"id":83,"question":"A procurement team uses a zero-shot prompt to extract clause types from supplier contracts into a fixed JSON format. Evaluation on 400 labelled contracts shows high accuracy overall, but outputs for multi-party indemnities and clauses amended by later addenda frequently use the wrong field structure. The task description and category definitions are already complete. What is the most appropriate next change?","options":{"A":"Add step-by-step reasoning instructions to every request so the model works through each clause before answering.","B":"Add a few diverse, tagged examples that show the correct output for multi-party indemnities and amended clauses.","C":"Move the workload to the most capable model tier so it handles the edge cases without further prompt changes.","D":"Add forty examples of the most common clause type so the model sees the target JSON format reinforced many times."},"domain":2,"correct":["B"],"qk":"multi-party indemnities","ak":{"B":"few diverse, tagged examples"}},{"id":84,"question":"An internal operations agent is connected to 70 tools across HR, finance, facilities and IT. Every tool is used by at least one request type, but a typical request needs only two or three. Tool definitions now account for most of the input tokens on every call, time to first token has grown, and the agent increasingly confuses tools with similar names. Which change best reduces token usage while keeping every capability available?","options":{"A":"Keep a small core set of tools loaded and let the agent discover the remaining definitions on demand via tool search.","B":"Move to a model configuration with a larger context window so all 70 tool definitions fit with room to spare.","C":"Shorten every tool description to a single line so that each definition consumes as few tokens as possible.","D":"Copy the tool definitions into the system prompt as plain text so they are cached together with the policies."},"domain":2,"correct":["A"],"qk":"70 tools","ak":{"A":"discover the remaining definitions on demand via tool search"}},{"id":85,"question":"An IT helpdesk assistant runs sessions that often exceed 60 turns. Each request resends the full transcript plus the top ten retrieved knowledge-base articles in full. Per-turn cost and latency rise steadily through a session, and late-session answers increasingly reference fixes from earlier, unrelated issues. You must cut tokens without lowering quality on the evaluation set. Which two changes should you make? (Select two.)","options":{"A":"Increase retrieval to the top twenty articles so that the answer is more likely to be present somewhere in context.","B":"Summarize older turns while keeping recent turns verbatim and key identifiers, decisions and constraints explicit.","C":"Remove the out-of-scope and output-format sections from the system prompt to free room for conversation history.","D":"Trim retrieved articles to the passages relevant to the current question and drop duplicate or overlapping chunks.","E":"Move the assistant to a configuration with a larger context window so that the full transcript always fits."},"domain":2,"correct":["B","D"],"qk":"exceed 60 turns","ak":{"B":"Summarize older turns","D":"Trim retrieved articles to the passages relevant"}},{"id":86,"question":"A support assistant sends a 6,000-token system prompt containing the tone guide and return policy, followed by the conversation. Prompt caching was enabled a month ago, but monitoring shows almost no cache hits and no change in time to first token. A review of the request builder finds that the current timestamp and the customer's first name are inserted on the first line of the system prompt. What should you do?","options":{"A":"Shorten the system prompt below the size at which caching applies, since caching is not producing any savings.","B":"Send the policy as a retrieved document after the user message so that the system prompt itself stays small.","C":"Move the timestamp and customer name to the end of the request so the static prompt forms an identical prefix.","D":"Send a warm-up request every few minutes so that the cached prefix does not expire between customer requests."},"domain":2,"correct":["C"],"qk":"almost no cache hits","ak":{"C":"Move the timestamp and customer name to the end"}},{"id":87,"question":"A research assistant built from an orchestrator and five subagents has doubled its monthly model spend over two months. The service dashboard shows total input and output tokens rising, but the team cannot say which subagent or step is responsible. Before changing any configuration, which instrumentation change most directly enables the team to find the root cause?","options":{"A":"Switch every subagent to the fastest, cheapest model tier and compare next month's total bill with this month's.","B":"Add a budget alert that fires when total monthly token spend crosses a fixed threshold set by the finance team.","C":"Emit a tracing span for every agent step with its token usage and latency, joined by a propagated correlation ID.","D":"Log the full raw prompt and response of every request so engineers can manually review the longest conversations."},"domain":3,"correct":["C"],"qk":"cannot say which subagent or step is responsible","ak":{"C":"tracing span for every agent step"}},{"id":88,"question":"A post-incident review of a patient-scheduling agent finds two problems: engineers could not reconstruct what a failed rescheduling tool call sent and received, nor which user request triggered it, and several existing log lines contain patient phone numbers copied from tool arguments. Which two changes best address these findings? (Select two.)","options":{"A":"Log tool-call inputs, outputs and status with known sensitive fields redacted before they reach the log store.","B":"Stop logging tool-call payloads entirely and keep only the success or error status code for each call.","C":"Copy full unredacted prompts and tool payloads to a separate restricted bucket with longer retention.","D":"Run a nightly batch job that scans the log store and deletes any line matching a phone-number pattern.","E":"Propagate a request-scoped correlation ID through the agent, every tool call and downstream services."},"domain":3,"correct":["A","E"],"qk":"patient phone numbers","ak":{"A":"sensitive fields redacted","E":"Propagate a request-scoped correlation ID"}},{"id":89,"question":"A knowledge assistant over 40,000 engineering documents was performing well until last week, when the platform team switched the embedding model used to encode incoming user queries. Since then, answer relevance has dropped sharply across all document types, while the generation model, prompts and latency are unchanged. What is the most appropriate fix?","options":{"A":"Raise retrieval top-k from 5 to 20 so that relevant passages are more likely to appear somewhere in the returned set.","B":"Move generation to the most capable model tier so it can better reason over loosely related passages.","C":"Add a system-prompt instruction telling Claude to answer that it does not know when passages look unrelated.","D":"Re-embed the whole corpus with the new embedding model, then run a retrieval regression set before releasing."},"domain":3,"correct":["D"],"qk":"switched the embedding model","ak":{"D":"Re-embed the whole corpus"}},{"id":90,"question":"A law firm is designing a RAG pipeline over client contracts and matter files. Partners require that every answer can be traced to the exact clause it relies on, and that lawyers only ever see content from matters they are staffed on. Which two design choices best meet these requirements? (Select two.)","options":{"A":"Embed each contract as one whole-document vector so every citation points to a complete, self-contained file.","B":"Assemble context with stable chunk source IDs, require clause citations, and verify cited IDs were retrieved.","C":"Let retrieval search all matters, then hide passages from unstaffed matters in the interface after generation.","D":"Capture matter access lists at ingestion as chunk metadata and filter on them at retrieval, before context assembly.","E":"Increase top-k so that answers draw on more contracts and are less likely to miss a relevant clause."},"domain":3,"correct":["B","D"],"qk":"traced to the exact clause","ak":{"B":"Stable chunk source IDs","D":"matter access lists at ingestion"}},{"id":91,"question":"Finance analysts ask an internal assistant questions such as total refunds over a given amount by region for last quarter. Refund records live in a relational warehouse with a well-indexed schema. The current design embeds each refund row into a vector index and asks Claude to add up the retrieved rows, and the totals are frequently wrong. Which redesign best fixes this?","options":{"A":"Give Claude a constrained query tool that runs read-only SQL against the warehouse and explains the returned result.","B":"Raise top-k substantially so that more matching refund rows are retrieved before Claude computes each total.","C":"Switch the vector index to hybrid dense and keyword retrieval so that exact region names are matched reliably.","D":"Route these questions to the most capable model tier so that it performs the multi-row arithmetic more accurately."},"domain":3,"correct":["A"],"qk":"relational warehouse","ak":{"A":"read-only SQL"}},{"id":92,"question":"A SaaS vendor runs one support assistant for many customer tenants over a shared document index. User queries mix paraphrased symptoms such as 'my device will not wake up' with exact error codes such as 'E-4471', and dense-only retrieval often misses the error-code articles. An audit also found one tenant's private runbooks quoted in another tenant's answers. Which two changes best address these issues? (Select two.)","options":{"A":"Combine dense and sparse keyword retrieval, fuse the ranked results, and rerank the candidates before assembly.","B":"Keep dense-only retrieval but replace the current embedding model with a larger general-purpose embedding model.","C":"Apply a tenant metadata filter inside retrieval so other tenants' content never competes for the top-k slots.","D":"Scan each generated answer and delete sentences that mention another tenant's name before it is shown to users.","E":"Raise top-k for any query containing an error code so the exact-match article is more likely to be returned."},"domain":3,"correct":["A","C"],"qk":"exact error codes","ak":{"A":"Combine dense and sparse keyword retrieval","C":"tenant metadata filter inside retrieval"}},{"id":93,"question":"An operations assistant has 45 tools across billing, shipping and returns. A recent audit confirmed that every tool maps to a defined task, but definitions consume a large share of each request, time to first token is high, and Claude sometimes picks the wrong one of several similarly named tools. The team lead proposes deleting the 20 least-used tools. What is the best recommendation?","options":{"A":"Accept the proposal, since removing the 20 least-used tools reduces both the token load and the selection errors.","B":"Keep the core frequently used tools loaded and defer the rest behind tool search with clear, domain-prefixed descriptions.","C":"Merge similar tools into a few broad multipurpose tools that take a mode parameter selecting the underlying action.","D":"Move to a model with a larger context window so all 45 definitions fit comfortably with room for the conversation."},"domain":3,"correct":["B"],"qk":"deleting the 20 least-used","ak":{"B":"defer the rest behind tool search"}},{"id":94,"question":"An internal assistant's system prompt has grown to include a 30-page compliance procedure, a 20-page brand style guide and several product reference manuals, yet each is relevant to only a minority of requests. Cost and latency have risen, and Claude occasionally applies compliance steps to unrelated requests. Which two changes best address both the cost and the misapplication? (Select two.)","options":{"A":"Summarize all three bodies of content into a two-page digest that stays in the system prompt on every request.","B":"Package the compliance procedure and the style guide as Skills that load their full content only when a task matches.","C":"Keep everything in the system prompt but enable prompt caching so the long static prefix is cheaper to reprocess.","D":"Move to a model with a larger context window so the full content no longer crowds out the user's conversation.","E":"Replace the pasted product manuals with a retrieval tool that fetches only the relevant passages when needed."},"domain":3,"correct":["B","E"],"qk":"30-page compliance procedure","ak":{"B":"Skills that load their full content only when a task matches","E":"retrieval tool that fetches only the relevant passages"}},{"id":95,"question":"A sales team uses a Claude-based assistant to draft proposal sections from a fixed 6,000-token instruction and template block plus deal notes retrieved per request. Leadership's stated priorities are that draft quality on the evaluation rubric must not drop, and that users should wait less before seeing output. Which change should the architect make first?","options":{"A":"Serve every draft from a lighter model tier, since lighter models respond faster and most drafts are routine.","B":"Halve the maximum output length so that each proposal section finishes generating in roughly half the time.","C":"Cache the fixed instruction and template prefix ahead of the deal notes, and stream the draft as it is generated.","D":"Reduce retrieved deal notes from eight passages to two so that each request sends fewer tokens to the model."},"domain":3,"correct":["C"],"qk":"wait less before seeing output","ak":{"C":"stream the draft"}},{"id":96,"question":"A procurement team is deploying Claude to screen incoming supplier contracts for uncapped indemnity clauses before signature. A missed clause has previously exposed the company to seven-figure liability, while each false flag costs a lawyer about two minutes of review. The team asks which metric should be the primary go-live gate. Which metric should you recommend?","options":{"A":"Overall accuracy across all clauses in the reviewed contracts, because it summarizes both kinds of error in one number.","B":"Recall on uncapped indemnity clauses, with precision tracked as a secondary metric so lawyer review load stays manageable.","C":"Precision on flagged indemnity clauses, because every false flag consumes lawyer time that the business wants to reduce.","D":"Mean time to complete each contract screen, because the team will only adopt the assistant if signature cycles stay short."},"domain":4,"correct":["B"],"qk":"uncapped indemnity clauses","ak":{"B":"Recall"}},{"id":97,"question":"An IT service desk agent resolves tickets by calling Claude several times per ticket, with tool lookups and occasional retries. The contract SLA states that 95 percent of chat replies must arrive within six seconds, and finance wants to compare the current setup with a cheaper model tier that may need more retries. Which two metrics should the evaluation report to support both decisions? (Select two.)","options":{"A":"p95 response latency per chat reply, measured against the six-second SLA target.","B":"Average response latency across all chat replies, reported as a weekly trend line.","C":"Cost per API call at list price for each of the model tiers under consideration.","D":"Total monthly token volume across all tickets, compared between the two tiers.","E":"Cost per resolved ticket, including retries and tool round-trips for each tier."},"domain":4,"correct":["A","E"],"qk":"95 percent of chat replies must arrive within six seconds","ak":{"A":"p95 response latency per chat reply","E":"Cost per resolved ticket, including retries"}},{"id":98,"question":"Every night a support platform re-classifies about 200,000 closed tickets for a weekly trends report that executives read on Monday. The classification prompt and model tier were validated last quarter, and accuracy must not change. The nightly job now costs more than the live chat assistant, and nobody needs its results before morning. Which change should you make first?","options":{"A":"Concatenate twenty tickets into each request so the long classification prompt is sent once per group of tickets.","B":"Move the nightly job to the smallest model tier, since closed-ticket classification is low risk for the business.","C":"Truncate each ticket to its first few hundred tokens so that every classification request is shorter and cheaper.","D":"Submit the unchanged requests through the Message Batches API for asynchronous processing at the lower batch price."},"domain":4,"correct":["D"],"qk":"nobody needs its results before morning","ak":{"D":"Message Batches API"}},{"id":99,"question":"A team is A/B testing a revised prompt for a claims-intake assistant, with random assignment by user and a planned sample size that will be reached on day 14. On day 3, the variant leads on the primary metric by six points with a p-value under 0.05, and all guardrail metrics are within limits. The product manager wants to stop the test and promote the variant today. What should you advise?","options":{"A":"Continue to the planned sample size and decide then, stopping early only if a guardrail metric is breached.","B":"Stop the test and promote the variant now, because the result is already statistically significant.","C":"Stop the test and start a new one with three more variants to find an even stronger prompt.","D":"Promote the variant now for the user segments where its lead is largest, and keep testing the rest."},"domain":4,"correct":["A"],"qk":"wants to stop the test","ak":{"A":"Continue to the planned sample size"}},{"id":100,"question":"In an A/B test for a multilingual support assistant, variant B combined a rewritten system prompt with a higher retrieval top-k. At the planned sample size, B improved the overall resolution rate beyond the minimum detectable effect, but resolution for Spanish-language users fell by five points. The team must decide what to do next. Which two actions are most appropriate? (Select two.)","options":{"A":"Promote variant B to all users, because the overall primary metric beat the minimum detectable effect.","B":"Run a follow-up test whose variants differ by a single change, so that the effect can be attributed.","C":"Drop the Spanish-language slice from the analysis, because it is only a small share of the traffic.","D":"Record an iterate decision with the slice regression, and add failing Spanish cases to the reference set.","E":"Pool these results with last quarter's experiment data to raise statistical power before deciding."},"domain":4,"correct":["B","D"],"qk":"Spanish-language users fell by five points","ak":{"B":"differ by a single change","D":"add failing Spanish cases to the reference set"}},{"id":101,"question":"Six weeks after launch, a policy Q&A assistant shows no rise in error rates, and p95 latency is within its SLO. However, department heads report that answers have gradually become less accurate since the HR handbook was reorganized. Current monitoring covers only HTTP status codes, latency and token cost. Which monitoring change would most directly detect this kind of problem going forward?","options":{"A":"Lower the alert threshold on HTTP 5xx error rates so that smaller increases page the on-call engineer sooner.","B":"Log the complete prompt and response for every request indefinitely so engineers can investigate any complaint.","C":"Score sampled production outputs on a schedule with the offline eval checks and rubrics, sliced by index version.","D":"Add a thumbs-down button and alert the team whenever negative feedback exceeds a fixed count on a given day."},"domain":4,"correct":["C"],"qk":"HR handbook was reorganized","ak":{"C":"Score sampled production outputs on a schedule"}},{"id":102,"question":"Overnight, cost per task for a document-analysis assistant rose 40 percent and time-to-first-token roughly doubled. The engineering team says no code was deployed, but the on-call engineer cannot tell what changed, because traces record only request IDs, total tokens and total latency. Which two additions to the per-request trace would most directly let the team diagnose this kind of change? (Select two.)","options":{"A":"The full raw prompt text, including customer content, retained without any fixed retention limit.","B":"A daily cost total imported from the provider invoice and attached to each of the request records.","C":"The model identifier, prompt version and retrieval index version that served each request.","D":"A static alert on every metric emitted by the service, using thresholds that were set before launch.","E":"Input tokens split into cached and uncached counts, recorded alongside time-to-first-token."},"domain":4,"correct":["C","E"],"qk":"no code was deployed","ak":{"C":"model identifier, prompt version and retrieval index version","E":"cached and uncached counts"}},{"id":103,"question":"An email-triage agent reads inbound customer emails and has tools to update CRM records, draft replies and forward messages to any external address. During red-teaming, an email containing hidden text that told the agent to forward the latest account export to an outside address caused the agent to attempt the forward. Which response best addresses this risk?","options":{"A":"Add a system-prompt rule telling the agent to ignore any instructions that appear inside customer emails.","B":"Log every forwarding action to the SIEM and have the security team review flagged events each week.","C":"Let the agent follow embedded instructions only when the sender's domain is on an approved list.","D":"Remove external forwarding from the tools and screen email content as untrusted data before the agent acts."},"domain":5,"correct":["D"],"qk":"hidden text","ak":{"D":"Remove external forwarding"}},{"id":104,"question":"An insurance claims assistant drafts settlement summaries that adjusters approve before payment. After four months, adjusters accept 97 percent of drafts unchanged, and the operations director proposes removing the second-level audit of approved claims to save cost. No one has compared the accepted drafts against verified claim outcomes. Which concern should you raise first?","options":{"A":"The acceptance rate is too high to be credible, so the assistant should be replaced with a more capable model.","B":"Acceptance shows what adjusters kept, not what was correct, and a usually-right system breeds over-reliance.","C":"The audit can be removed safely, because adjusters remain accountable for every claim that they approve.","D":"The assistant should run at a lower temperature first, so that its drafts become more consistent overall."},"domain":5,"correct":["B"],"qk":"removing the second-level audit","ak":{"B":"Acceptance shows what adjusters kept, not what was correct"}},{"id":105,"question":"A finance team uses Claude to extract line items from supplier invoices and compute VAT totals for posting to the ledger. Auditors found that totals for the same invoice occasionally differ by a few cents between runs, even with identical input. The controller requires totals to be exact and reproducible. What is the most appropriate design change?","options":{"A":"Set the temperature to zero for all invoice calls so that each run returns the same totals every time.","B":"Run each invoice three times and post the total that appears most often across the separate runs.","C":"Have the model extract line items into a validated schema and compute the totals in deterministic code.","D":"Move the workload to the most capable model tier, since stronger reasoning will remove arithmetic errors."},"domain":5,"correct":["C"],"qk":"differ by a few cents between runs","ak":{"C":"compute the totals in deterministic code"}},{"id":106,"question":"A procurement agent turns approved purchase requests into JSON that is posted directly to the ERP to create purchase orders. Recent incidents include an order with a negative quantity and an order to a vendor that is not on the approved list. Policy also says that orders above a set amount need a manager's sign-off. Which two controls most directly enforce these rules? (Select two.)","options":{"A":"Add a system-prompt instruction asking the model to double-check quantities and vendors before it responds.","B":"Validate each JSON payload in code against a strict schema with types, ranges and allowed vendor values.","C":"Retry with a higher temperature whenever the ERP rejects an order, so the model produces a different output.","D":"Log every created purchase order and have the finance team audit a sample of them at the end of each month.","E":"Apply the amount limit as a code rule that routes orders above the threshold to a manager for approval."},"domain":5,"correct":["B","E"],"qk":"negative quantity","ak":{"B":"Validate each JSON payload in code against a strict schema","E":"amount limit as a code rule"}},{"id":107,"question":"A US federal agency wants a Claude-based assistant to summarize case files for its staff. The team's prototype calls a commercial API endpoint chosen for price, stores embeddings in a SaaS vector database, and sends logs to a third-party monitoring tool. The agency's authorizing official says the workload requires FedRAMP Moderate. What should determine the production architecture?","options":{"A":"Every component in the data path, including model access, vector store and logging, must run in environments authorized at the required level.","B":"The model must be reached through an authorized environment, while the vector store and logging tools can stay on their current services.","C":"The team should select the most capable model tier, because the agency's decision rests mainly on the quality of the case summaries.","D":"A signed Business Associate Agreement with the model provider, together with a system-prompt rule forbidding retention of case data."},"domain":5,"correct":["A"],"qk":"FedRAMP Moderate","ak":{"A":"Every component in the data path"}},{"id":108,"question":"An internal IT helpdesk agent answers employee questions and resets an employee's own password on request. To move fast, it was given a shared administrator service account that can also delete accounts and change group memberships across the directory. A security review asks how to reduce the impact of a hallucinated or injected instruction. Which two changes should you make? (Select two.)","options":{"A":"Remove the account-deletion and group-membership tools that the helpdesk task does not require.","B":"Require the agent to ask the employee for confirmation in chat before deleting any account.","C":"Replace the shared admin account with credentials scoped to the requesting employee's own account.","D":"Send every administrative action the agent performs to the SIEM for review by the security team.","E":"Move the agent to the most capable model tier so that it misinterprets fewer employee requests."},"domain":5,"correct":["A","C"],"qk":"shared administrator service account","ak":{"A":"Remove the account-deletion and group-membership tools","C":"credentials scoped to the requesting employee's own account"}},{"id":109,"question":"A legal operations team wants an agent to manage vendor contract renewals end to end, including sending termination notices when a contract should not renew. Once sent, a termination notice cannot be withdrawn. To save time, the team proposes that the agent send notices automatically whenever its confidence score exceeds 0.9. Which design should you recommend?","options":{"A":"Allow automatic sending above the confidence threshold and route only lower-confidence notices to a lawyer.","B":"Require a lawyer to approve every agent step, including contract retrieval, date checks and renewal reminders.","C":"Allow automatic sending for contracts below a set annual value and require lawyer approval for larger ones.","D":"Have the agent draft notices into a review queue without a send tool, and have a named lawyer approve each one."},"domain":5,"correct":["D"],"qk":"cannot be withdrawn","ak":{"D":"draft notices into a review queue without a send tool"}},{"id":110,"question":"A SaaS company is adding a Claude-powered document assistant to a product used by several EU enterprise customers. Customer contracts require that their data stay in the EU and that one customer's documents never appear in another customer's answers. The current prototype uses one shared vector index and a US-hosted deployment. Which two changes address these requirements? (Select two.)","options":{"A":"Keep the shared index, and instruct the model in the system prompt to use only the current customer's documents.","B":"Pseudonymize customer names in the documents, since pseudonymized data then falls outside the scope of the GDPR.","C":"Keep full prompts and retrieved documents in long-term logs so that any cross-customer leak can be investigated.","D":"Separate the indexes per customer, or apply tenant filters at retrieval before any document enters the context.","E":"Choose a deployment region and access path that keep prompts, indexes and logs within the EU, as contracted."},"domain":5,"correct":["D","E"],"qk":"stay in the EU","ak":{"D":"Separate the indexes per customer, or apply tenant filters at retrieval","E":"deployment region"}},{"id":111,"question":"Three months after a document-review assistant was handed to the operations team, two incidents occurred. During a quality-drop alert, the on-call engineer could not tell whether the latest prompt change could be rolled back, or how. Separately, the release evaluation suite had silently stopped running after launch because no one knew it was their job. Which two additions to the handoff documentation most directly address these gaps? (Select two.)","options":{"A":"A lessons-learned retrospective describing the decisions the project team made during the design phase.","B":"A customer FAQ explaining what the assistant does and which document types it currently supports.","C":"A runbook and on-call playbook covering alert triage and prompt rollout and rollback through a version pin.","D":"The design meeting notes and review comments, so the operations team understands the original reasoning.","E":"A named owning team for the evaluation suite, with how to run it and the thresholds that gate each release."},"domain":6,"correct":["C","E"],"qk":"silently stopped running","ak":{"C":"runbook and on-call playbook","E":"named owning team for the evaluation suite"}},{"id":112,"question":"Pre-handoff evaluation of a benefits-claims assistant showed accuracy well below the release threshold on handwritten scanned forms and on claims written in Portuguese, both a small share of traffic. The product manager asks you to leave these results out of the handoff documents so that the support team and auditors do not lose confidence in the launch. How should you handle these results?","options":{"A":"Leave them out of the handoff set and plan to address both weak slices quietly in the next release cycle.","B":"Record them only in the project retrospective, where the team can revisit them during the next phase.","C":"Document them as known limitations, with the affected inputs, residual risk and how they are routed to humans.","D":"Mention them in the customer FAQ with positive wording that encourages users to submit typed English forms."},"domain":6,"correct":["C"],"qk":"leave these results out","ak":{"C":"Document them as known limitations"}},{"id":113,"question":"A contract-summarization service has run on one model version for eight months, and the team has kept its versioned reference set and release thresholds. A newer model version has just been released, and the business sponsor asks you to switch production to it this week because the announcement says it reasons better. What should you do?","options":{"A":"Rerun the existing reference set and thresholds on the new version per slice, check SLAs and cost, then roll out behind a version pin.","B":"Switch production to the new version this week, since a newer release should perform at least as well as the current one.","C":"Stay on the current version until the provider retires it, because it already meets every one of the release thresholds.","D":"Build a new evaluation set around the new version's announced strengths, then decide whether to switch based on it."},"domain":6,"correct":["A"],"qk":"newer model version","ak":{"A":"Rerun the existing reference set and thresholds on the new version per slice"}},{"id":114,"question":"ADR-007, accepted at launch a year ago, put all traffic of a claims-triage assistant on the most capable model tier. Rerunning the carried-forward reference set now shows a lighter tier meeting the quality bar in aggregate at much lower cost. A team lead argues that accepted decisions should stay fixed for consistency. Which two actions should you take? (Select two.)","options":{"A":"Write a new ADR that records the new evidence and supersedes ADR-007, leaving the original record visible.","B":"Edit ADR-007 in place to describe the lighter tier, so that only one current decision record exists.","C":"Check the lighter tier per slice against the release thresholds before routing production traffic to it.","D":"Keep ADR-007 unchanged, since revisiting accepted decisions undermines stakeholder trust in the design.","E":"Move all traffic to the lighter tier now, since the aggregate result on the reference set already passes."},"domain":6,"correct":["A","C"],"qk":"ADR-007","ak":{"A":"Write a new ADR that records the new evidence and supersedes ADR-007","C":"Check the lighter tier per slice"}},{"id":115,"question":"Production monitoring of an invoice-processing assistant shows that extraction quality drops on invoices from a recently acquired subsidiary, which uses a different layout. The finding is written up in the monitoring-phase retrospective, and planning for the next iteration starts next week. Which action best ensures this lesson actually changes the next iteration?","options":{"A":"Archive the retrospective in the long-term project repository so the finding is preserved for future reference.","B":"Send the retrospective to every party on the stakeholder register as part of the phase-transition notification.","C":"Schedule a review of the finding at the end of the next iteration, once more production data has been collected.","D":"Turn it into inputs: add subsidiary invoices to the reference set, a discovery question and a design option to test."},"domain":6,"correct":["D"],"qk":"retrospective","ak":{"D":"Turn it into inputs"}},{"id":116,"question":"Six weeks after launch of a proposal-drafting assistant, sales leads in one region say it \"feels too slow to use during client calls.\" The SLA agreed in discovery commits to a p95 draft latency, and the organization-wide dashboard shows p95 comfortably within it. The regional director asks you to act on the complaint. What should you do first?","options":{"A":"Move all drafting traffic to a lighter model tier right away so that every region experiences faster drafts.","B":"Map the complaint to the latency SLA and measure p95 for that region before choosing a fix or renegotiation.","C":"Close the complaint, because the organization-wide p95 latency is within the SLA committed in discovery.","D":"Add a progress indicator to the drafting screen so users perceive the wait as shorter during client calls."},"domain":6,"correct":["B"],"qk":"feels too slow","ak":{"B":"measure p95 for that region"}},{"id":117,"question":"You are finalizing service commitments for a Claude-based underwriting assistant with the business sponsor and the platform operations team. The sponsor wants a clear quality and latency commitment to report against, and operations wants warning of trouble before that commitment is broken. Which two arrangements should you put in place? (Select two.)","options":{"A":"Set the internal targets equal to the stakeholder commitment so that there is a single number everyone tracks.","B":"Report to stakeholders against the SLA agreed in discovery, expressed as measurable latency and quality thresholds.","C":"Report the stricter internal targets to stakeholders as the commitment so that the sponsor sees ambitious numbers.","D":"Configure alerts to fire only once the SLA has been breached so that the operations team avoids alert fatigue.","E":"Operate against stricter internal SLOs with an error budget so that alerts fire before the SLA is put at risk."},"domain":6,"correct":["B","E"],"qk":"warning of trouble before that commitment is broken","ak":{"B":"Report to stakeholders against the SLA","E":"stricter internal SLOs with an error budget"}},{"id":118,"question":"An SRE team wants to give a Claude-based on-call assistant cluster-admin credentials on production Kubernetes so it can diagnose and fix incidents faster. The assistant reads logs and support tickets, some of which contain customer-supplied text. Which access design should you recommend?","options":{"A":"Grant cluster-admin credentials but log every command the assistant runs, so any harmful action can be traced and reversed afterwards.","B":"Grant cluster-admin only during declared incidents and add a CLAUDE.md instruction telling the assistant to avoid destructive commands.","C":"Provide read-only log, trace and metrics tools by default, plus narrowly scoped remediation tools that run only after on-call approval.","D":"Deny the assistant all production access, so engineers copy relevant log excerpts into the session by hand during each incident."},"domain":7,"correct":["C"],"qk":"cluster-admin credentials on production","ak":{"C":"Read-only log, trace and metrics tools by default"}},{"id":119,"question":"Twenty minutes after a deploy, checkout-api starts returning intermittent 502 errors. An engineer opens Claude Code and asks it to 'find the bug and push a fix' to the main branch. Error logs, distributed traces with correlation IDs and the deploy history are available through read-only tools. Which two steps should happen before any fix is merged? (Select two.)","options":{"A":"Have Claude apply its most plausible fix directly to production, then confirm the diagnosis afterwards from the error rate.","B":"Follow failing requests across services by correlation ID and line up the first errors with the deploy and config history.","C":"Switch the session to the most capable model tier, since a stronger model is more likely to guess the root cause first time.","D":"Restart every checkout-api pod immediately and close the incident if the error rate drops below the alert threshold.","E":"Reproduce the failure outside production, ideally as a failing test that the proposed fix must then make pass."},"domain":7,"correct":["B","E"],"qk":"find the bug and push a fix","ak":{"B":"Follow failing requests across services by correlation ID","E":"Reproduce the failure outside production"}},{"id":120,"question":"A platform team's CLAUDE.md tells Claude Code to run the formatter and linter after every file edit and never to modify files under db/migrations. Reviewers still find unformatted code in AI-generated pull requests, and last week a session edited an already-applied migration. The team wants both behaviors enforced every time across all repositories. What should you recommend?","options":{"A":"Add hooks that format after edits and block protected paths, distributed centrally through the managed plugin marketplace.","B":"Rewrite both instructions in capital letters near the top of CLAUDE.md and repeat them in each developer's personal CLAUDE.local.md file.","C":"Ask reviewers to reject any AI-generated pull request with formatting problems or migration changes until developers adjust their prompts.","D":"Move the instructions into each repository's README so that Claude reads them together with the build and test documentation."},"domain":7,"correct":["A"],"qk":"enforced every time across all repositories","ak":{"A":"hooks"}}];
const DOM={1:'D1 Design & Architecture',2:'D2 Models & Prompting',3:'D3 Integration',4:'D4 Evaluation & Testing',5:'D5 Governance & Safety',6:'D6 Communication',7:'D7 Developer Productivity'};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mark=(t,k,tag,cls)=>{const i=t.toLowerCase().indexOf(k.toLowerCase());if(i<0)return esc(t);return esc(t.slice(0,i))+`<${tag}${cls?` class="${cls}"`:''}>`+esc(t.slice(i,i+k.length))+`</${tag}>`+esc(t.slice(i+k.length))};
const st={mode:'study',view:'one',pos:0,sel:{},checked:{}};
try{const s=JSON.parse(localStorage.getItem('ccarp-kw')||'{}');Object.assign(st,{mode:s.mode||'study',view:s.view||'one',pos:s.pos||0})}catch(e){}
const save=()=>{try{localStorage.setItem('ccarp-kw',JSON.stringify({mode:st.mode,view:st.view,pos:st.pos}))}catch(e){}};
$('d').insertAdjacentHTML('beforeend',Object.entries(DOM).map(([k,v])=>`<option value="${k}">${v}</option>`).join(''));
const idx=D.map(q=>(q.id+' '+q.question+' '+Object.values(q.options).join(' ')).toLowerCase());
let list=D;
const filter=()=>{const t=$('s').value.toLowerCase().trim().split(/\s+/).filter(Boolean),dm=+$('d').value;list=D.filter((q,i)=>(!dm||q.domain===dm)&&t.every(w=>idx[i].includes(w)));if(st.pos>=list.length)st.pos=0};
const revealed=q=>st.mode==='study'||st.checked[q.id];
const card=(q,n,total)=>{
 const show=revealed(q),sel=st.sel[q.id]||[];
 const multi=q.correct.length>1;
 const rule=show?`<div class="rule"><span class="see">${esc(q.qk)}</span><span class="arw">→</span>${q.correct.map(L=>`<span class="pick">${L}: ${esc(q.ak[L])}</span>`).join(' ')}${q.tip?`<span class="tip">${esc(q.tip)}</span>`:''}</div>`:`<div class="rule"><span class="see">${esc(q.qk)}</span><span class="arw">→ ?</span></div>`;
 const opts=Object.entries(q.options).map(([L,t])=>{
  const ok=q.correct.includes(L);let cls='opt';
  if(show&&ok)cls+=' ok';else if(show&&sel.includes(L))cls+=' no';else if(sel.includes(L))cls+=' sel';
  const body=show&&ok?mark(t,q.ak[L],'u','k'):esc(t);
  return `<button class="${cls}" data-q="${q.id}" data-l="${L}"><span class="L">${L}</span><span>${body}</span></button>`}).join('');
 let foot='';
 if(st.mode==='prac'){
  if(st.checked[q.id]){const right=sel.slice().sort().join('')===q.correct.join('');foot=`<div class="res ${right?'g':'b'}">${right?'Đúng':'Sai'}: đáp án ${q.correct.join(', ')}</div>`}
  else foot=`<p class="hint">${multi?'Chọn '+q.correct.length+' đáp án rồi bấm Kiểm tra.':'Chọn một đáp án rồi bấm Kiểm tra.'}</p><div class="nav" style="margin-top:8px"><button data-check="${q.id}" ${sel.length?'':'disabled'}>Kiểm tra</button></div>`;
 }
 return `<section class="card">${n?`<div class="top"><span>Câu ${n} / ${total}</span><span>${Math.round(n/total*100)}%</span></div><div class="prog"><i style="width:${n/total*100}%"></i></div>`:''}
 <div class="chips"><span class="chip q">QUESTION ${q.id}</span><span class="chip">${DOM[q.domain]}</span>${multi?`<span class="chip">Chọn ${q.correct.length}</span>`:''}</div>
 ${rule}<p class="qt">${mark(q.question,q.qk,'mark')}</p><div class="opts">${opts}</div>${foot}</section>`;
};
const render=()=>{
 const M=$('M');
 if(!list.length){M.innerHTML='<p class="empty">Không có câu nào khớp. Thử từ khác hoặc bỏ lọc domain.</p>';return}
 if(st.view==='all'){M.innerHTML='<div class="list">'+list.map(q=>card(q)).join('')+'</div>';return}
 const q=list[st.pos];
 M.innerHTML=card(q,st.pos+1,list.length)+`<div class="nav"><button id="prev" ${st.pos?'':'disabled'}>← Câu trước</button><button id="next" ${st.pos<list.length-1?'':'disabled'}>Câu sau →</button></div>
 <div class="grid">${list.map((x,i)=>`<button data-go="${i}" class="${i===st.pos?'cur':''}" aria-label="Câu ${x.id}">${x.id}</button>`).join('')}</div>`;
};
const go=i=>{st.pos=Math.max(0,Math.min(list.length-1,i));save();render();window.scrollTo({top:0})};
$('M').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.id==='prev')return go(st.pos-1);
 if(b.id==='next')return go(st.pos+1);
 if(b.dataset.go)return go(+b.dataset.go);
 if(b.dataset.check){st.checked[+b.dataset.check]=true;return render()}
 if(b.dataset.l&&st.mode==='prac'){const id=+b.dataset.q,q=D.find(x=>x.id===id);if(st.checked[id])return;let s=st.sel[id]||[];const L=b.dataset.l;
  if(q.correct.length>1)s=s.includes(L)?s.filter(x=>x!==L):[...s,L];else s=[L];st.sel[id]=s;render()}
});
const setMode=m=>{st.mode=m;$('mStudy').setAttribute('aria-pressed',m==='study');$('mPrac').setAttribute('aria-pressed',m==='prac');save();render()};
const setView=v=>{st.view=v;$('vOne').setAttribute('aria-pressed',v==='one');$('vAll').setAttribute('aria-pressed',v==='all');save();render()};
$('mStudy').onclick=()=>setMode('study');$('mPrac').onclick=()=>{st.sel={};st.checked={};setMode('prac')};
$('vOne').onclick=()=>setView('one');$('vAll').onclick=()=>setView('all');
$('s').addEventListener('input',()=>{st.pos=0;filter();render()});
$('d').addEventListener('change',()=>{st.pos=0;filter();render()});
document.addEventListener('keydown',e=>{if(st.view!=='one'||e.target.matches('input,select'))return;if(e.key==='ArrowRight')go(st.pos+1);if(e.key==='ArrowLeft')go(st.pos-1)});
filter();setMode(st.mode);setView(st.view);
}
</script>
</body>
</html>
