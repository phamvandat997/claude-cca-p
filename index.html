. Thử nghiệm ban đầu cho thấy các subagent làm trùng việc và context của lead agent bị lấp đầy bởi kết quả tìm kiếm thô. Nên đề xuất hai thay đổi thiết kế nào? (Chọn hai.) Mỗi đáp án đúng là một phần giải pháp.","o":{"A":"Yêu cầu lead agent giao cho mỗi subagent mục tiêu, định dạng đầu ra và ranh giới ngoài phạm vi thật rõ ràng.","B":"Cho subagent gửi kết quả cô đọng về lead agent thay vì toàn bộ đầu ra thô của công cụ.","C":"Thay các subagent bằng một agent duy nhất giải quyết tuần tự tất cả câu hỏi trong một context chung.","D":"Cho phép mỗi subagent tạo thêm subagent không giới hạn để mở rộng độ bao phủ.","E":"Mặc định cấp cho mọi subagent toàn bộ công cụ và lịch sử hội thoại của lead agent."}},"22":{"q":"Một nhà bán lẻ châu Âu dự kiến dùng Claude phân tích bản ghi hỗ trợ khách hàng chứa tên, email và lịch sử đơn hàng của cư dân EU. Cán bộ bảo vệ dữ liệu hỏi cần chuẩn bị gì trước khi xử lý. Cách tiếp cận nào phù hợp nhất với GDPR?","o":{"A":"Tiến hành xử lý vì bản ghi được thu thập qua kênh hỗ trợ của chính nhà bán lẻ.","B":"Thiết lập cơ sở pháp lý và mục đích được ghi nhận; giảm thiểu và giả danh hóa dữ liệu cá nhân trước khi đưa vào model; xác nhận thỏa thuận xử lý dữ liệu và cấu hình lưu giữ với nhà cung cấp.","C":"Chỉ xóa địa chỉ email, rồi gửi phần nội dung còn lại nguyên vẹn vào model.","D":"Chỉ dẫn model trong system prompt không ghi nhớ dữ liệu cá nhân trong bản ghi."}},"23":{"q":"Một assistant phân tích hợp đồng gửi thỏa thuận 120.000 token và câu hỏi ngắn theo mỗi yêu cầu. Prompt hiện đặt câu hỏi trước rồi đến toàn văn hợp đồng dưới dạng văn bản không cấu trúc; câu trả lời về điều khoản nằm sâu thường thiếu. Nên điều chỉnh cấu trúc prompt bước đầu như thế nào?","o":{"A":"Đặt hợp đồng ở đầu prompt trong các thẻ XML có mô tả, đưa câu hỏi xuống cuối và yêu cầu model trích dẫn điều khoản liên quan trước khi trả lời.","B":"Lặp lại câu hỏi ba lần trong prompt để nó nằm gần mọi phần của hợp đồng.","C":"Chia hợp đồng thành từng trang gửi qua các yêu cầu riêng rồi nối các câu trả lời mà không tổng hợp.","D":"Chuyển hợp đồng sang system prompt dưới dạng văn bản thuần và tăng temperature để bao quát rộng hơn."}},"24":{"q":"Bạn đang lập checklist rà soát đạo đức cho các hệ thống triển khai có hỗ trợ AI. Hai kiểm tra nào nên có? (Chọn hai.) Mỗi đáp án đúng là một giải pháp hoàn chỉnh.","o":{"A":"Chỉ rà soát đạo đức với đầu ra có độ tin cậy cao hơn ngưỡng xác định.","B":"Xác nhận điều khoản cấp phép của nhà cung cấp cho phép dùng model trong production.","C":"Kiểm tra đầu ra không dựa vào những khái quát hóa về con người mà dữ liệu nền không chứng minh.","D":"Bảo đảm trách nhiệm đối với các quyết định có tác động lớn vẫn thuộc con người, không quy cho model.","E":"Xác nhận latency và throughput ổn định giữa các khu vực và nhóm người dùng."}},"25":{"q":"Bạn đang rà soát cấu hình agent hỗ trợ khách hàng. Công cụ ứng viên thuộc bốn nhóm: (1) dùng thường xuyên, giảm chuyển giao; (2) thỉnh thoảng dùng cho nhiệm vụ xác định; (3) có thể hữu ích trong tương lai; (4) chưa từng dùng cho bất kỳ nhiệm vụ xác định nào. Nên giữ nhóm nào?","o":{"A":"Chỉ nhóm 1, vì least privilege chỉ giữ tập công cụ tối thiểu phục vụ nhiệm vụ đã định.","B":"Cả bốn nhóm, vì càng nhiều công cụ agent càng hoạt động tốt dù công cụ không gắn với nhiệm vụ.","C":"Chỉ nhóm 1 và 2 vì chúng phục vụ nhiệm vụ xác định và các lượt chuyển giao thường lệ của agent.","D":"Nhóm 1, 2 và 3 để tránh phải cấu hình lại agent khi có yêu cầu mới."}},"26":{"q":"Assistant dự báo doanh thu vượt mục tiêu chi phí tháng 38%. Phân tích cho thấy: đoạn mở đầu chính sách 6.000 token lặp mỗi lượt chiếm 45%; retrieval các chunk doanh số lịch sử trung bình 3.000 token/lượt chiếm 30%; suy luận bằng model cao cấp chiếm 25%. Các bên yêu cầu giữ nguyên độ chính xác. Nên ưu tiên hai tối ưu nào? (Chọn hai.)","o":{"A":"Rút ngắn phần mở đầu chính sách bằng cách bỏ điều khoản không thiết yếu.","B":"Cache các chunk doanh số được truy xuất lặp lại qua nhiều câu hỏi hằng ngày.","C":"Giảm số chunk doanh số lịch sử truy xuất trong mỗi lượt.","D":"Bật prompt caching cho phần mở đầu chính sách cố định trong các lượt lặp.","E":"Chuyển toàn bộ lượt truy vấn sang Claude model nhỏ hơn, nhanh hơn."}},"27":{"q":"Bạn thiết kế prompt cho bộ phân loại ticket với 30 danh mục xác định rõ và có mô tả cụ thể ngay trong prompt. Kỹ thuật khởi đầu nào phù hợp nhất?","o":{"A":"Prompt zero-shot nêu các danh mục, mô tả và định dạng đầu ra bắt buộc.","B":"Prompt chain-of-thought cho quyết định định tuyến không đòi hỏi suy luận nhiều bước.","C":"Prompt không có mô tả danh mục, kỳ vọng model tự suy ra tập danh mục.","D":"Thiết lập prompt chaining: trước tiên phân nhóm sơ bộ từng ticket, sau đó chọn danh mục cuối cùng."}},"28":{"q":"Một kiến trúc sư Claude nhận thấy sau khi nâng cấp phiên bản model, câu trả lời đã grounding bắt đầu xuất hiện nhận định không được tài liệu truy xuất hỗ trợ. Biện pháp nào nhắm trực tiếp nhất vào lỗi này?","o":{"A":"Chấm điểm mỗi phiên bản model mới bằng bộ đánh giá đối kháng ổn định trước khi đưa lên production.","B":"Coi đoạn truy xuất là đầu vào không đáng tin và sàng lọc bằng bộ phân loại trước khi đưa vào context.","C":"Siết retrieval để mỗi câu hỏi chỉ trả về ít đoạn nhưng liên quan hơn.","D":"Giới hạn câu trả lời trong nội dung được nguồn hỗ trợ, bắt buộc citation và thêm bước xác minh."}},"29":{"q":"Một agent phân loại hồ sơ yêu cầu đã tăng từ 6 lên 34 công cụ trong 18 tháng. Độ chính xác phân loại giảm từ 91% xuống 78%, latency chọn công cụ tăng trung bình 2,3 giây. Kỹ sư đề nghị thêm agent định tuyến công cụ phía trước để lọc danh sách theo yêu cầu. Hai phát hiện nào là cơ sở nên phân tách năng lực trước khi thêm router? (Chọn hai.)","o":{"A":"Mô tả công cụ chồng lấn giữa nhiều nhóm hồ sơ yêu cầu trong bộ công cụ agent.","B":"34 công cụ phục vụ bốn miền workflow hồ sơ yêu cầu khác nhau trong phạm vi phân loại.","C":"Router đề xuất tạo thêm một lượt gọi model cho mỗi yêu cầu.","D":"Một số công cụ không được gọi trong 90 ngày gần nhất.","E":"Mẫu router được mô tả rộng rãi trong tài liệu công khai về agent."}},"30":{"q":"Bạn xây dựng pipeline đánh giá cho hệ thống Claude và cần hoàn thành bước đặc tả trước khi chạy với tập dữ liệu. Hai bước nào bắt buộc làm TRƯỚC? (Chọn hai.) Mỗi đáp án đúng là một phần giải pháp.","o":{"A":"Rà soát trường hợp lỗi với chuyên gia lĩnh vực để điều chỉnh rubric chấm điểm.","B":"Xác định metric và các lát dữ liệu (slice) sẽ báo cáo cho trường hợp đại diện, biên và đối kháng.","C":"Chấm đầu ra theo nhãn tham chiếu và tổng hợp metric.","D":"Tuyển chọn và gán nhãn tập đánh giá phù hợp với các slice đã xác định.","E":"Công bố metric lên dashboard và chặn phát hành dựa trên ngưỡng."}},"31":{"q":"Bạn thiết kế chiến lược kiểm thử cho pipeline Claude xử lý dữ liệu tài chính nhạy cảm. Cần ưu tiên hai loại kiểm thử nào để bao quát cả an toàn khi bị tấn công lẫn tính đúng đắn xuyên suốt thành phần? (Chọn hai.)","o":{"A":"Kiểm thử hồi quy trên tập tham chiếu ổn định gồm các đầu ra tốt đã biết.","B":"Kiểm thử đối kháng với các trường hợp prompt injection và đầu vào sai định dạng.","C":"Kiểm thử tích hợp xác minh hành vi end-to-end của pipeline xuyên suốt mọi thành phần.","D":"Chỉ unit test logic dựng từng prompt template.","E":"Smoke test kiểm tra luồng chính sau mỗi lần triển khai."}},"32":{"q":"Bạn tổng hợp các thực hành bảo đảm tính liên tục xuyên suốt vòng đời triển khai. Hai thực hành nào thuộc danh sách? (Chọn hai.) Mỗi đáp án đúng là một giải pháp hoàn chỉnh.","o":{"A":"Duy trì danh sách stakeholder và thông báo cho tất cả ở mỗi lần chuyển giai đoạn.","B":"Giữ và tái sử dụng framework đánh giá cùng tập tham chiếu qua các vòng lặp thay vì xây lại.","C":"Ghi lại bài học cuối mỗi giai đoạn và dùng làm đầu vào cho giai đoạn kế tiếp.","D":"Lưu trữ dài hạn mọi sản phẩm bàn giao của mỗi giai đoạn.","E":"Khóa quyết định ở giai đoạn đầu để tránh xem xét lại về sau."}},"33":{"q":"Bạn sắp xếp các thành phần của pipeline xử lý hóa đơn. Với từng thành phần, chọn lớp thực thi: Pre-Processing (tiền xử lý), Model Stage (giai đoạn model) hoặc Post-Processing (hậu xử lý). Phương án nào gán đúng mọi thành phần?","o":{"A":"Phân loại loại hóa đơn bằng Claude → Hậu xử lý; lưu bản ghi đã xác thực → Giai đoạn model; kiểm tra schema trường trích xuất → Hậu xử lý; trích xuất trường cấu trúc bằng Claude → Giai đoạn model; ẩn PII trước khi gọi model → Tiền xử lý; OCR ảnh hóa đơn quét → Tiền xử lý.","B":"Phân loại loại hóa đơn bằng Claude → Giai đoạn model; lưu bản ghi đã xác thực → Hậu xử lý; kiểm tra schema trường trích xuất → Hậu xử lý; trích xuất trường cấu trúc bằng Claude → Giai đoạn model; ẩn PII trước khi gọi model → Tiền xử lý; OCR ảnh hóa đơn quét → Tiền xử lý.","C":"Phân loại loại hóa đơn bằng Claude → Giai đoạn model; lưu bản ghi đã xác thực → Tiền xử lý; kiểm tra schema trường trích xuất → Hậu xử lý; trích xuất trường cấu trúc bằng Claude → Giai đoạn model; ẩn PII trước khi gọi model → Tiền xử lý; OCR ảnh hóa đơn quét → Hậu xử lý.","D":"Phân loại loại hóa đơn bằng Claude → Giai đoạn model; lưu bản ghi đã xác thực → Hậu xử lý; kiểm tra schema trường trích xuất → Hậu xử lý; trích xuất trường cấu trúc bằng Claude → Tiền xử lý; ẩn PII trước khi gọi model → Tiền xử lý; OCR ảnh hóa đơn quét → Giai đoạn model."}},"34":{"q":"Bạn rà soát thiết kế end-to-end của đồng nghiệp cho nền tảng Claude dự kiến mở rộng tới hàng nghìn người dùng đồng thời. Với mỗi phát biểu, chọn Có nếu là thực hành kiến trúc hợp lý; không thì chọn Không. Chọn mọi phát biểu có đáp án “Có”.","o":{"A":"Thực hiện xác thực và phân quyền trước retrieval để lọc kết quả theo danh tính.","B":"Hàng đợi bất đồng bộ hấp thụ lưu lượng đột biến giữa lớp tiếp nhận và lớp gọi model.","C":"Mã hóa phép tính thuế trực tiếp trong system prompt thay vì trong code.","D":"Log hội thoại chứa mã định danh chính phủ chưa che để tối đa hóa tín hiệu tinh chỉnh."}},"35":{"q":"Bạn thiết kế bộ phân loại kiểm duyệt nội dung, xử lý khối lượng bình luận người dùng rất lớn với yêu cầu latency mỗi tin nhắn thấp và nhãn phân loại rõ ràng. Chọn model nào phù hợp nhất?","o":{"A":"Fable","B":"Sonnet","C":"Haiku","D":"Opus"}},"36":{"q":"Assistant AI thử nghiệm cho chuyên viên mua sắm đạt tỷ lệ chấp nhận phản hồi đầu tiên 89%, nhưng khảo sát cho thấy chuyên viên thường bác đề xuất nhà cung cấp sau khi xét các tiêu chí khác mà assistant không xem xét. Chủ dự án muốn triển khai ngay. Hai nhận định thuộc năng lực Discernment nào cần nêu TRƯỚC khi duyệt phát hành? (Chọn hai.)","o":{"A":"Thời gian pilot có lẽ quá ngắn để chứng minh độ tin cậy cả năm.","B":"Các tiêu chí bị bỏ sót thể hiện lỗ hổng phạm vi đầu vào của assistant.","C":"Tỷ lệ phản hồi khảo sát có thể không đại diện thống kê cho tất cả chuyên viên.","D":"Tỷ lệ chấp nhận không đo được đề xuất có đúng sau khi chuyên viên rà soát hay không.","E":"Tỷ lệ chấp nhận kết hợp cỡ mẫu pilot đã đủ bằng chứng để phát hành mà không cần xem xét tiếp."}},"37":{"q":"Bạn so sánh hai cấu hình assistant hỏi đáp tuân thủ nội bộ. Cấu hình X giảm top-k retrieval, dùng model nhẹ hơn, cải thiện p95 latency 38% nhưng giảm 2% độ chính xác benchmark. Cấu hình Y giữ top-k và model mạnh hơn, latency p95 và độ chính xác không đổi. Ưu tiên hệ thống là độ chính xác trước, latency sau. Nên đề xuất cấu hình nào?","o":{"A":"X, vì latency thấp nhìn chung quan trọng hơn độ chính xác bất kể ưu tiên hệ thống.","B":"X, vì cải thiện latency 38% luôn hơn mức giảm độ chính xác 2% trong mọi hệ thống tuân thủ.","C":"Y, vì hệ thống ưu tiên độ chính xác và X làm giảm độ chính xác đo được.","D":"X, vì mức giảm chính xác 2% nằm trong dao động benchmark thông thường và không đáng kể."}},"38":{"q":"Bạn rà soát quy tắc quyền Claude Code để triển khai toàn doanh nghiệp. Quy tắc cấp quyền Bash không hạn chế cho mọi dự án và mọi lập trình viên. Cách xử lý nào phù hợp nhất?","o":{"A":"Chỉ allow-list lệnh Bash cần dùng, dựa vào default-deny ngầm định.","B":"Thay quyền Bash không hạn chế bằng mẫu công cụ giới hạn theo đúng lệnh cần dùng và thêm deny rule rõ ràng cho thao tác nhạy cảm.","C":"Giới hạn bằng mẫu công cụ nhưng áp dụng y hệt cho mọi dự án bất kể nhu cầu thực tế.","D":"Duyệt quy tắc hiện tại, để từng nhóm dự án thắt chặt quyền Bash về sau."}},"39":{"q":"Bạn rà soát đặc tả tích hợp để tìm lỗ hổng bảo mật. Hai phát hiện nào thực sự là lỗ hổng? (Chọn hai.) Mỗi đáp án đúng là một giải pháp hoàn chỉnh.","o":{"A":"Đầu vào và đầu ra công cụ được mã hóa khi truyền giữa dịch vụ bằng TLS.","B":"Thông tin xác thực dịch vụ nằm trong prompt context, có thể rò rỉ vào log và trace.","C":"Lệnh gọi công cụ chạy phía server bằng danh tính dịch vụ least privilege đúng phạm vi hành động.","D":"RBAC chỉ được áp dụng tại lớp hiển thị phản hồi, sau khi model đã truy cập dữ liệu hạn chế.","E":"Token OAuth theo người dùng được trao đổi với quyền hạn chế theo scope và làm mới trong phiên."}},"40":{"q":"Một kiến trúc sư Claude dẫn dắt giai đoạn discovery cho giải pháp dịch vụ khách hàng dùng AI mới. Hai hoạt động nào đặc trưng cho discovery có cấu trúc và thu thập yêu cầu? (Chọn hai.) Mỗi đáp án đúng là một giải pháp hoàn chỉnh.","o":{"A":"Tổ chức workshop với stakeholder để làm rõ ràng buộc latency, độ chính xác và tuân thủ trước khi xác định phạm vi.","B":"Hoãn ghi nhận ràng buộc đến giai đoạn thiết kế tích hợp để tránh phạm vi mở rộng.","C":"Tạo prototype ban đầu rồi lặp theo phản ứng người dùng.","D":"Ghi lại tiêu chí thành công và ngưỡng thất bại cụ thể để quyết định cho triển khai production.","E":"Chọn tầng model Claude theo kinh nghiệm dự án cũ của kiến trúc sư trước khi nhận ý kiến stakeholder."}},"41":{"q":"Bạn là kiến trúc sư giải pháp đang đánh giá các use case cho chương trình dựa trên Claude. Với mỗi tình huống, chọn Có nếu Claude phù hợp làm giải pháp chính ở cấp kiến trúc; nếu không, chọn Không. Chọn tất cả phát biểu có đáp án “Có”.","o":{"A":"Soạn bản nháp báo cáo điều tra từ log sự cố bán cấu trúc để chuyên viên rà soát.","B":"Tính điểm gian lận thời gian thực với latency dưới 50 mili giây trên pipeline streaming.","C":"Rà soát hợp đồng có context dài, trích xuất điều khoản có cấu trúc và đánh dấu sai lệch.","D":"Thay thế vector index để semantic retrieval trên kho hàng triệu tài liệu.","E":"Định tuyến ticket hỗ trợ đến 30 danh mục và nêu lý do lựa chọn."}},"42":{"q":"Bạn tổng hợp các biện pháp guardrail cho assistant tiếp xúc khách hàng. Hai biện pháp nào thuộc danh sách? (Chọn hai.)","o":{"A":"Cài các câu lệnh vượt rào được phê duyệt để người dùng đáng tin có thể nới guardrail khi cần.","B":"Kiểm tra đầu ra model theo schema cấu trúc trước khi thực hiện hành động tiếp theo.","C":"Giảm temperature toàn cục để giảm khả năng đầu ra trái chính sách.","D":"Kết hợp guardrail ở mức prompt với kiểm tra nội dung khi chạy thay vì chỉ dựa vào một lớp.","E":"Chỉ dựa vào một system prompt được siết chặt và liệt kê mọi hành vi cấm."}},"43":{"q":"Bạn đánh giá tập kiểm thử chấm điểm công cụ Claude hỗ trợ tuyển dụng. Tập hiện chỉ lấy một khu vực địa lý và một nhóm thâm niên, trong khi công cụ phục vụ nhiều khu vực và mức thâm niên. Cách xử lý nào phù hợp nhất?","o":{"A":"Tiếp tục dùng tập hẹp vì điểm benchmark hiện tại đã cao trên nhóm này.","B":"Mở rộng tập đánh giá tới các khu vực và nhóm thâm niên sẽ phục vụ, rồi chấm lại trước khi phát hành rộng hơn.","C":"Thay đánh giá định lượng bằng nhận xét định tính từ nhóm pilot nhỏ.","D":"Thu hẹp đánh giá vào một nhóm nhân khẩu học duy nhất để đơn giản hóa điểm số."}},"44":{"q":"Bạn tổng hợp các yếu tố quyết định chọn Model Context Protocol (MCP), tích hợp API trực tiếp hay chuyển giao agent-to-agent. Hai yếu tố nào cần xét? (Chọn hai.)","o":{"A":"Tích hợp có cần dùng được trên nhiều AI client trong hệ sinh thái hay không.","B":"Tương tác là stateless, nhạy với latency hay stateful, chạy dài.","C":"Kênh truyền có hỗ trợ mã hóa dữ liệu đang truyền giữa dịch vụ hay không.","D":"Tổ chức có quy ước đặt tên endpoint API nội bộ hay không.","E":"Nhóm từng triển khai giao thức ứng viên nào hay chưa."}},"45":{"q":"Một nhóm nền tảng vận hành hệ thống multi-agent tự host trên Kubernetes với bảy agent chuyên xử lý hóa đơn qua message bus nội bộ. Ban lãnh đạo xem xét chuyển sang managed agents; bảo mật yêu cầu dữ liệu hóa đơn không bao giờ rời ranh giới mạng tổ chức. Yếu tố nào quan trọng nhất?","o":{"A":"Managed agents có giảm chi phí token mỗi hóa đơn hay không.","B":"Managed agents có hỗ trợ topo message bus hiện tại hay không.","C":"Bảy agent hiện tại có dễ ánh xạ sang mẫu hỗ trợ của managed agents hay không.","D":"Cách managed agents xử lý dữ liệu có đáp ứng ranh giới mạng do bảo mật yêu cầu hay không."}},"46":{"q":"Bạn kiểm toán agent hỗ trợ mua sắm có nhiệm vụ soạn yêu cầu mua hàng để người khác duyệt. Với từng công cụ, chọn Có nếu nên giữ theo least privilege, Không nếu phải bỏ. Chọn mọi câu trả lời “Có”.","o":{"A":"Công cụ tra cứu danh mục chỉ đọc, cung cấp thông tin nhà cung cấp và SKU.","B":"Công cụ gửi email trực tiếp yêu cầu mua hàng cho nhà cung cấp.","C":"Công cụ tạo bản nháp yêu cầu mua hàng vào hàng đợi duyệt.","D":"Công cụ quản trị cơ sở dữ liệu production không liên quan đến mua sắm.","E":"Công cụ chỉ đọc tài liệu chính sách mua sắm liên quan."}},"47":{"q":"Bạn thiết kế assistant Claude truy cập 60 công cụ nội bộ thuộc nhiều miền nghiệp vụ. Nạp mọi định nghĩa công cụ vào mỗi yêu cầu làm tăng token và thời gian đến phản hồi đầu tiên. Mẫu thiết kế nào giải quyết tốt nhất mà không giảm phạm vi năng lực?","o":{"A":"Dùng thêm lượt gọi model để cô đọng định nghĩa 60 công cụ thành chỉ mục ngắn, thêm vào mỗi lượt.","B":"Tăng context window tối đa để chứa cả 60 định nghĩa trong một yêu cầu.","C":"Dùng progressive tool discovery: ban đầu đưa ra tập công cụ chọn lọc và nạp thêm theo nhu cầu tác vụ.","D":"Chia 60 công cụ thành năm nhóm cố định và nạp một nhóm theo ánh xạ loại tác vụ tĩnh."}},"48":{"q":"Bạn phân loại các cách quản lý token theo giai đoạn vòng đời yêu cầu: “Input Preparation”, “Prompt Construction” và “Output Handling”. Phương án nào gán đúng tất cả mục?","o":{"A":"Lưu đầu ra đã xác thực để hệ thống tiếp theo sử dụng và phục vụ kiểm toán. → Xử lý đầu ra; Sắp xếp các phần prompt để nội dung có thể cache nằm trước nội dung riêng của yêu cầu. → Xây dựng prompt; Tóm tắt hội thoại trước khi không còn cần toàn bộ lịch sử. → Chuẩn bị đầu vào; Xác thực đầu ra cấu trúc của model theo schema mong đợi. → Xử lý đầu ra; Đưa nội dung lặp ổn định vào prefix có thể cache ở đầu prompt. → Xây dựng prompt; Rút gọn các đoạn truy xuất còn những phần liên quan đến câu hỏi. → Chuẩn bị đầu vào","B":"Lưu đầu ra đã xác thực để hệ thống tiếp theo sử dụng và phục vụ kiểm toán. → Xây dựng prompt; Sắp xếp các phần prompt để nội dung có thể cache nằm trước nội dung riêng của yêu cầu. → Xử lý đầu ra; Tóm tắt hội thoại trước khi không còn cần toàn bộ lịch sử. → Chuẩn bị đầu vào; Xác thực đầu ra cấu trúc của model theo schema mong đợi. → Xử lý đầu ra; Đưa nội dung lặp ổn định vào prefix có thể cache ở đầu prompt. → Xây dựng prompt; Rút gọn các đoạn truy xuất còn những phần liên quan đến câu hỏi. → Chuẩn bị đầu vào","C":"Lưu đầu ra đã xác thực để hệ thống tiếp theo sử dụng và phục vụ kiểm toán. → Xử lý đầu ra; Sắp xếp các phần prompt để nội dung có thể cache nằm trước nội dung riêng của yêu cầu. → Chuẩn bị đầu vào; Tóm tắt hội thoại trước khi không còn cần toàn bộ lịch sử. → Chuẩn bị đầu vào; Xác thực đầu ra cấu trúc của model theo schema mong đợi. → Xử lý đầu ra; Đưa nội dung lặp ổn định vào prefix có thể cache ở đầu prompt. → Xây dựng prompt; Rút gọn các đoạn truy xuất còn những phần liên quan đến câu hỏi. → Xây dựng prompt","D":"Lưu đầu ra đã xác thực để hệ thống tiếp theo sử dụng và phục vụ kiểm toán. → Xử lý đầu ra; Sắp xếp các phần prompt để nội dung có thể cache nằm trước nội dung riêng của yêu cầu. → Xây dựng prompt; Tóm tắt hội thoại trước khi không còn cần toàn bộ lịch sử. → Chuẩn bị đầu vào; Xác thực đầu ra cấu trúc của model theo schema mong đợi. → Xử lý đầu ra; Đưa nội dung lặp ổn định vào prefix có thể cache ở đầu prompt. → Chuẩn bị đầu vào; Rút gọn các đoạn truy xuất còn những phần liên quan đến câu hỏi. → Xây dựng prompt"}},"49":{"q":"Bạn trình bày quyết định kiến trúc cho cả nhà tài trợ cấp điều hành và trưởng nhóm kỹ thuật thực thi. Chiến lược nào phục vụ tốt cả hai?","o":{"A":"Mở đầu bằng chi tiết triển khai kỹ thuật chuyên sâu cho nhóm kỹ thuật.","B":"Công bố quyết định rồi đi thẳng vào lập kế hoạch triển khai.","C":"Mở đầu bằng quyết định, kết quả kinh doanh và trade-off đã chấp nhận; sau đó trình bày cơ sở kỹ thuật, phương án thay thế và hệ quả triển khai.","D":"Dùng một mạch trình bày không phân biệt, cân bằng kỹ thuật và kinh doanh ở mọi phần với cùng mức độ chi tiết."}},"50":{"q":"Assistant nghiên cứu Claude bắt đầu tự tin đưa câu trả lời trái với tài liệu nguồn đã retrieval, dù pipeline retrieval không đổi. Hai kiểm tra chẩn đoán nào giúp xác định nguyên nhân gốc trực tiếp nhất? (Chọn hai.)","o":{"A":"Đổi index retrieval sang model embedding đặc hơn để tăng điểm liên quan chunk.","B":"Thử tái hiện lỗi trên phiên bản model cũ để kiểm tra bất tương thích model.","C":"Tăng context window để lấy thêm chunk trong mỗi câu hỏi.","D":"Kiểm tra chỉ dẫn grounding trong system prompt xem ràng buộc citation còn nguyên không.","E":"Giảm temperature để giảm biến thiên trên mọi kiểu câu hỏi."}},"51":{"q":"Bạn chọn bộ tài liệu cần bàn giao cùng hệ thống Claude. Bộ nào đầy đủ nhất?","o":{"A":"Biên bản hồi cứu dự án, tổng kết bài học và danh sách người đóng góp.","B":"Tổng quan kiến trúc, ADR, sơ đồ từng thành phần, runbook vận hành thường gặp, playbook trực sự cố và danh sách hạn chế đã biết.","C":"Đề xuất thiết kế gốc, bình luận review, ghi chú họp thiết kế và tài liệu yêu cầu đã duyệt.","D":"Release note cho người dùng, trang giới thiệu marketing và FAQ khách hàng."}},"52":{"q":"Một stakeholder muốn mở rộng đáng kể phạm vi dự án đang triển khai. Cách trả lời nào cân bằng kỳ vọng và nhu cầu thực sự của họ?","o":{"A":"Ghi nhận yêu cầu, nói rõ tác động lên phạm vi và tiến độ, đề xuất các lựa chọn để stakeholder quyết định.","B":"Ghi nhận nhưng cho biết bản phát hành đã khóa, đề nghị xét lại sau phát hành.","C":"Ghi nhận vào backlog kèm nguồn yêu cầu, xác nhận sẽ xét trong kỳ lập kế hoạch tiếp theo.","D":"Tự chấp nhận bổ sung vào bản hiện tại, kéo dài tiến độ và báo nhóm liên quan ngày mới."}},"53":{"q":"Bạn xác định tối ưu có tác động lớn nhất cho hệ thống có chi phí token chủ yếu từ system prompt dài lặp lại và lượng context retrieval lớn mỗi lượt. Tối ưu nào nhắm đúng nguồn chi phí chính?","o":{"A":"Batch nhiều câu hỏi vào một lượt gọi để chỉ truyền system prompt một lần.","B":"Định tuyến yêu cầu đơn giản sang model nhỏ và dành model lớn cho trường hợp phức tạp.","C":"Viết lại system prompt ngắn hơn, bỏ ví dụ trùng nhau.","D":"Đưa system prompt lặp lại vào prefix có thể cache và rút gọn context truy xuất theo phần liên quan từng câu hỏi."}},"54":{"q":"Bạn xác định vị trí cần duy trì human review trong pipeline tự động. Đặt bước duyệt ở đâu là hợp lý?","o":{"A":"Giữa mỗi yêu cầu đầu vào và model, để kiểm tra trước khi sinh kết quả.","B":"Giữa đầu ra model và mọi hành động, bất kể tác động hay khả năng hoàn tác.","C":"Giữa đầu ra và hành động có điểm confidence đánh giá chưa chắc chắn.","D":"Giữa đầu ra model và mọi hành động có tác động lớn, không thể đảo ngược."}},"55":{"q":"Bạn chuẩn bị triển khai đủ điều kiện HIPAA cho khách hàng y tế. Cấu hình nào hỗ trợ tuân thủ HIPAA với công cụ do Anthropic cung cấp?","o":{"A":"Claude Team có BAA đã ký nhưng Zero Data Retention tắt và chưa cấu hình audit logging.","B":"Claude Pro không có BAA, vì mặc định gói cá nhân trả phí đã đáp ứng HIPAA.","C":"Tài khoản Claude cá nhân tùy ý do bác sĩ dùng cho PHI, không có BAA, Zero Data Retention hay audit logging.","D":"Claude Enterprise có BAA đã ký, bật Zero Data Retention và cấu hình audit logging để theo dõi tuân thủ."}},"56":{"q":"Một tổ chức y tế đánh giá hai kiến trúc assistant ghi chép lâm sàng Claude. X có chất lượng cao hơn nhưng chi phí 0,18 USD/phiên và phản hồi trung bình 4,2 giây. Y chất lượng thấp hơn chút ít, chi phí 0,09 USD/phiên, phản hồi 2,1 giây. SLA yêu cầu dưới 3 giây, dự kiến 2 triệu phiên/năm. Cách đánh giá nào đúng theo các trụ cột giá trị kinh doanh?","o":{"A":"Loại X vì vi phạm SLA; sau đó đánh giá Y theo hiệu quả và chi phí bằng cách tính chênh lệch năm và xem mức giảm chất lượng có ảnh hưởng đáng kể năng suất quy trình lâm sàng không.","B":"Chọn Y chỉ vì giảm 50% chi phí, do chi phí luôn quan trọng nhất trong y tế.","C":"Đề xuất hybrid dùng X cho ca phức tạp, Y cho ca thường mà không phân tích thêm.","D":"Chọn X vì chất lượng cao biện minh chi phí; tối ưu hạ tầng xử lý SLA sau triển khai."}},"57":{"q":"Bạn triển khai monitoring cho hệ thống Claude và phải hoàn tất các bước đặc tả trước khi instrument hệ thống phát metric và trace. Hai bước nào phải làm trước? (Chọn hai.)","o":{"A":"Soạn tài liệu dashboard, cảnh báo và runbook cho nhóm trực.","B":"Xác định metric và slice sẽ theo dõi trên lưu lượng bình thường lẫn đối kháng.","C":"Tinh chỉnh ngưỡng cảnh báo theo phân phối quan sát trạng thái bình thường để giảm báo động giả.","D":"Xác định SLO và error budget phải đáp ứng.","E":"Xây dashboard hiển thị metric theo slice với tần suất vận hành phù hợp."}},"58":{"q":"Kiểm toán an ninh phát hiện (1) mọi người dùng chung một API key và (2) lệnh gọi công cụ không ghi danh tính người khởi tạo. Hai biện pháp nào khắc phục trực tiếp? (Chọn hai.)","o":{"A":"Chuyển credential khỏi prompt context và lấy từ secret store phía server.","B":"Áp RBAC tại lớp retrieval trước khi đưa dữ liệu vào model context.","C":"Thay API key chung bằng OAuth token riêng từng người, với scope hạn chế.","D":"Thêm actor attribution vào log công cụ để ghi người khởi tạo mỗi lần gọi.","E":"Xác thực đầu ra có cấu trúc theo schema trước hành động."}},"59":{"q":"Nhóm tuân thủ soạn quy trình công bố thông tin theo quy định phải áp dụng giống hệt trong workflow chăm sóc khách hàng, bán hàng và onboarding. Quy trình được sửa 4–6 lần/năm theo cập nhật cơ quan quản lý. Nên đưa ra hai quyết định thiết kế nào? (Chọn hai.)","o":{"A":"Đóng gói quy trình thành Claude Skill do nhóm tuân thủ trực tiếp quản lý.","B":"Cho từng nhóm workflow viết lại quy trình riêng.","C":"Nhúng nguyên văn quy trình vào system prompt của từng workflow khi tích hợp.","D":"Để cả ba tích hợp workflow tham chiếu cùng một Claude Skill.","E":"Lưu quy trình trong kho retrieval dùng chung cho ba workflow."}},"60":{"q":"Bạn xem bản thảo system prompt của đồng nghiệp có chỉ dẫn mâu thuẫn: một đoạn cấm suy đoán ngoài nguồn được cung cấp, đoạn khác yêu cầu tự tin điền mọi chỗ thiếu. Phản hồi nào phù hợp nhất?","o":{"A":"Thêm thứ tự ưu tiên yêu cầu model tự chọn chỉ dẫn phù hợp ngữ cảnh mỗi lần.","B":"Giải quyết mâu thuẫn bằng cách xóa hoặc viết lại yêu cầu tự điền chỗ thiếu, bảo đảm prompt chỉ cho phép nội dung có nguồn hỗ trợ.","C":"Giữ cả hai chỉ dẫn và để model tự chọn cho từng yêu cầu dù hành vi có thể thiếu nhất quán.","D":"Giữ cả hai rồi thêm chỉ dẫn thứ ba yêu cầu model dùng phán đoán tốt nhất."}},"61":{"q":"Một kiến trúc sư Claude triển khai kiểm soát an toàn cho assistant tư vấn khách hàng, tuyệt đối không được đưa khuyến nghị đầu tư thuộc diện quản lý. Hai guardrail nào trực tiếp thực thi ràng buộc? (Chọn hai.)","o":{"A":"Tăng temperature để phản hồi biến thiên, giảm khả năng có khuyến nghị cụ thể.","B":"Ghi tất cả phản hồi vào SIEM và gửi bản ghi bị gắn cờ cho chuyên viên tuân thủ.","C":"Thêm bộ phân loại đầu ra phát hiện và chặn ngôn ngữ khuyến nghị đầu tư thuộc diện quản lý.","D":"Định nghĩa rõ danh mục ngoài phạm vi trong system prompt, với câu từ chối cố định cho yêu cầu tư vấn đầu tư.","E":"Giới hạn độ dài phiên để giảm số lượt hỏi mỗi người mỗi ngày."}},"62":{"q":"Bạn xem bản dự thảo ADR của đồng nghiệp. ADR đã có quyết định và chi tiết kỹ thuật nhưng thiếu phương án thay thế và trade-off đã chấp nhận. Phản hồi nào hợp lý nhất?","o":{"A":"Duyệt nguyên trạng vì quyết định đã được ghi nhận, các phần thiếu không cần thiết.","B":"Yêu cầu tác giả bổ sung các phương án từng cân nhắc và trade-off đã chấp nhận trước khi công bố.","C":"Yêu cầu liên kết chuỗi thảo luận thiết kế thay cho phần phương án thay thế bằng văn bản.","D":"Công bố hiện trạng rồi tạo tác vụ bổ sung trong phiên bản sau."}},"63":{"q":"Bạn chạy thí nghiệm có kiểm soát so sánh hai prompt với phân nhóm ngẫu nhiên. Hai bước thiết kế nào phải hoàn thành TRƯỚC khi chạy? (Chọn hai.)","o":{"A":"Quyết định đưa vào dùng, bác bỏ hay lặp lại ứng viên dựa trên phân tích.","B":"Xác định mức hiệu ứng tối thiểu có thể phát hiện và cỡ mẫu đủ statistical power.","C":"Xác định giả thuyết và metric thành công chính của phép so sánh.","D":"Theo dõi metric giữa kỳ hằng ngày và dừng ngay khi một prompt có vẻ dẫn đầu.","E":"Ghi khuyến nghị, trade-off được chấp nhận và các phương án khác."}},"64":{"q":"Một agent hỗ trợ khách hàng có thể đọc ticket, soạn trả lời, hoàn tiền và xóa tài khoản. Nhân viên hỗ trợ chỉ cần đọc và soạn trả lời. Theo least privilege, thay đổi nào giảm rủi ro tốt nhất?","o":{"A":"Thêm audit logging cho công cụ hoàn tiền và xóa để điều tra lạm dụng.","B":"Loại bỏ hoàn toàn công cụ hoàn tiền và xóa khỏi cấu hình agent.","C":"Giữ mọi công cụ nhưng hỏi xác nhận trước khi hoàn tiền hay xóa.","D":"Đổi sang model lớn hơn để tuân thủ hướng dẫn tốt hơn."}},"65":{"q":"Ứng dụng gửi cùng system prompt và tài liệu chính sách 8.000 token mỗi lượt, sau đó là tin nhắn người dùng ngắn thay đổi liên tục. Cả latency và chi phí đều quan trọng. Tối ưu nào giải quyết trực tiếp nhất?","o":{"A":"Cắt tài liệu chính sách chỉ còn 1.000 token đầu.","B":"Chọn model nhỏ nhất bất kể độ phù hợp.","C":"Đặt system prompt và chính sách tĩnh trước phần động, rồi bật prompt caching.","D":"Chuyển chính sách thành khối ví dụ few-shot."}},"66":{"q":"Hệ thống RAG đột nhiên trả lời tự tin nhưng sai ngay sau khi làm mới tài liệu. Latency và phiên bản model không thay đổi. Nên kiểm tra đâu đầu tiên?","o":{"A":"Trọng số model bị thay đổi ngầm.","B":"Bước retrieval và indexing trả về chunk cũ hoặc không liên quan.","C":"Temperature quá thấp.","D":"Context window đã nhỏ đi."}},"67":{"q":"Assistant rà soát hợp đồng thay thế lượt rà soát thủ công đầu tiên. Khách yêu cầu độ chính xác ít nhất 95% trên từng một trong năm loại hợp đồng trước go-live. Trên 1.000 hợp đồng đã được luật sư rà soát, độ chính xác chung là 96%. Nhóm cần làm gì tiếp?","o":{"A":"Go-live vì 96% tổng thể vượt 95%.","B":"Đo riêng từng loại hợp đồng và sửa mọi loại dưới 95% trước go-live.","C":"Đổi sang model mạnh nhất để tăng độ chính xác rồi go-live.","D":"Go-live và theo dõi khiếu nại luật sư để phát hiện loại hợp đồng yếu."}},"68":{"q":"Nhà bán lẻ dùng Claude xử lý báo giá vận chuyển. Mỗi báo giá cần trích chi phí và điều khoản dịch vụ, xác thực theo chính sách mua sắm, rồi mới đề xuất nhà vận chuyển. Quy trình phải dự đoán được và kiểm toán được. Kiến trúc nào phù hợp nhất?","o":{"A":"Workflow cố định gồm các lượt gọi LLM tuần tự cho trích xuất, kiểm tra chính sách, đề xuất, có chốt kiểm soát giữa bước.","B":"Một prompt tự diễn giải báo giá và tự quyết có cần xử lý thêm hay không.","C":"Agent tự chủ lập kế hoạch và chọn công cụ cho mọi lô báo giá.","D":"Các lượt gọi LLM song song để trích, kiểm và đề xuất đồng thời nhằm giảm latency."}},"69":{"q":"Tổ chức chuẩn hóa Claude Code trên nhiều nhóm cần ép thực thi bảo mật mà lập trình viên không thể ghi đè, đồng thời phân phối tập trung công cụ và workflow được duyệt. Hai hành động nào nên thực hiện? (Chọn hai.)","o":{"A":"Vận hành managed plugin marketplace phân phối skills, agents, hooks và MCP servers đã duyệt.","B":"Để lập trình viên tùy ý cài công cụ và kiểm toán cấu hình cục bộ mỗi quý.","C":"Ép kiểm soát toàn tổ chức bằng server-managed settings không thể bị các cấp thấp ghi đè.","D":"Đăng cấu hình khuyến nghị trên repository chung và yêu cầu từng nhóm tự áp dụng.","E":"Để công cụ đã duyệt trong cấu hình từng dự án để mỗi nhóm có thể sửa/tắt."}},"70":{"q":"Mạng lưới bệnh viện muốn assistant Claude tóm tắt ghi chú xuất viện cho điều phối viên theo dõi. Nhóm đổi mới đã có prototype hackathon và muốn chọn ngay model cùng agent framework. Trước khi chốt kiến trúc, hai thông tin nào tác động thiết kế lớn nhất? (Chọn hai.)","o":{"A":"Tầng model đã dùng trong prototype hackathon để kế thừa cấu hình chứng minh hoạt động.","B":"Có cần tóm tắt tương tác trong cuộc gọi hay chạy batch ban đêm, và lưu lượng ngày/giờ cao điểm dự kiến.","C":"Danh sách đầy đủ mọi tính năng tương lai stakeholder có thể muốn.","D":"Số kỹ thuật prompting định so sánh trong sprint đầu.","E":"Phân loại bảo mật của ghi chú xuất viện và yêu cầu truy vết từng bản tóm tắt để audit/tuân thủ."}},"71":{"q":"Công ty thanh toán chấm điểm giao dịch thẻ bằng ML streaming, cần quyết định trong 40 ms. Chuyên viên gian lận mất khoảng 25 phút mỗi ca bị gắn cờ để viết tường trình từ lịch sử giao dịch, thiết bị và ghi chú. Quản lý đề nghị chuyển chấm điểm sang Claude để mỗi quyết định có giải thích tự nhiên. Nên khuyến nghị gì?","o":{"A":"Chuyển sang Claude model nhẹ với phản hồi streaming để đạt 40 ms và tạo giải thích.","B":"Giữ ML chấm điểm thời gian thực, dùng Claude soạn tường trình ca bị gắn cờ để chuyên viên rà soát, hoàn thiện.","C":"Thay cả ML và chuyên viên bằng agent Claude chấm, điều tra và đóng hồ sơ end-to-end.","D":"Giữ ML nhưng để Claude chấm lại bất đồng bộ mọi giao dịch và dùng giải thích của nó ghi đè điểm sai."}},"72":{"q":"Công ty môi giới hải quan dùng Claude đọc hóa đơn thương mại và trả thuế nhập khẩu mỗi lô. System prompt chứa biểu thuế và yêu cầu model tính từng dòng. Audit thấy khoảng 3% số thuế sai dù phân loại hàng đúng. Thay đổi kiến trúc nào tốt nhất?","o":{"A":"Thêm ví dụ tính cho từng mức thuế trong system prompt, yêu cầu tính từng bước.","B":"Dùng model mạnh nhất cho bước tính, model nhẹ cho đọc/phân loại.","C":"Chạy prompt tính ba lần và chọn số được ít nhất hai lần đồng ý.","D":"Cho Claude trích và phân loại các dòng hàng, tính thuế bằng code từ bảng thuế, xác thực trước khi lưu."}},"73":{"q":"Dịch vụ xử lý chi phí gọi Claude đồng bộ từ upload API để trích xuất và phân loại biên lai. Ba ngày cuối tháng số lượt tải tăng gấp 10, gây rate-limit, timeout và mất ngầm một số biên lai. Đa số chỉ cần xử lý trước khóa sổ hai ngày sau. Hai thay đổi nào tốt nhất? (Chọn hai.)","o":{"A":"Đặt hàng đợi bất đồng bộ giữa upload API và model, có retry/backoff để xác nhận upload ngay.","B":"Đưa trích xuất sang model mạnh nhất để mỗi yêu cầu hoàn thành nhanh hơn.","C":"Tăng timeout của upload API để nhân viên chờ cho tới khi gọi model đồng bộ xong.","D":"Đưa biên lai cuối tháng không khẩn cấp vào batch hoàn thành trước khóa sổ thay vì gọi thời gian thực.","E":"Bỏ kiểm tra schema khi cao điểm và xác thực lại tuần sau."}},"74":{"q":"Hệ thống trích xuất hợp đồng chạy chín tháng. Người duyệt sửa các trường trên UI trước khi lưu nhưng chỉ giá trị cuối cùng được lưu. Độ chính xác giảm dần do mẫu nhà cung cấp mới, nhóm chỉ biết lỗi từ khiếu nại. Thay đổi nào khắc phục tốt nhất?","o":{"A":"Lưu mỗi chỉnh sửa cùng đầu ra gốc, đưa vào eval set và chạy đánh giá trước khi phát hành thay đổi prompt.","B":"Lên lịch viết lại prompt mỗi quý dựa trên lỗi lập trình viên còn nhớ.","C":"Yêu cầu model tự báo confidence từng trường, tự lưu trường vượt ngưỡng mà không cần người duyệt.","D":"Dùng model mạnh nhất mỗi khi gặp mẫu nhà cung cấp chưa từng thấy."}},"75":{"q":"Công ty viễn thông nhận 40.000 email hỗ trợ/ngày; 70% là hóa đơn/gói cước thường lệ, số còn lại sự cố kỹ thuật hoặc tranh chấp hợp đồng cần suy luận và nguồn khác nhau. Hiện một prompt lớn trên model mạnh nhất xử lý hết, vừa tốn kém vừa kém chất lượng ở email đơn giản. Pattern nào phù hợp nhất?","o":{"A":"Agent tự chủ với mọi nguồn/công cụ, tự quyết bước xử lý từng email.","B":"Parallel voting: ba lượt model trả lời mỗi email, gửi đáp án phổ biến nhất.","C":"Routing: bước đầu phân loại email và định tuyến đến prompt chuyên biệt và tầng model theo danh mục.","D":"Prompt chaining: mỗi email đi qua tuần tự prompt hóa đơn, kỹ thuật, tranh chấp trước khi soạn."}},"76":{"q":"Trước họp hội đồng kiến trúc, nhóm nền tảng đề xuất pattern cho năm workload Claude. Hai cặp workload–pattern nào hợp lý? (Chọn hai.)","o":{"A":"Báo cáo đêm luôn gồm bốn bước phụ thuộc cố định → agent tự chủ để linh hoạt mỗi tối.","B":"Pipeline trích xuất, rồi xác thực, rồi tóm tắt → các lượt song song vì ba công đoạn khác nhau.","C":"Rà soát hợp đồng nhà cung cấp theo pháp lý, tài chính, an ninh → các lượt song song độc lập và gộp phát hiện.","D":"Viết marketing chưa có tiêu chí chất lượng thống nhất → vòng evaluator-optimizer đến khi người đánh giá hài lòng.","E":"Nâng cấp thư viện với tập file bị ảnh hưởng chỉ rõ sau phân tích → orchestrator-workers lập tác vụ con lúc chạy."}},"77":{"q":"Assistant hồ sơ vay dùng một prompt dài để đọc sao kê, tính tỷ lệ nợ/thu nhập, kiểm ngưỡng chính sách, phát hiện tài liệu thiếu và soạn bản ghi nhớ thẩm định. Khoảng 8% bản ghi nhớ sai, kỹ sư không biết bước lỗi và không thể retry riêng. Nên phân tách thế nào?","o":{"A":"Giữ một prompt, thêm ví dụ few-shot cho lỗi và chạy lại toàn bộ khi sai.","B":"Chuyển phân tích dữ liệu, tỷ lệ và ngưỡng sang code; tách phát hiện thiếu và soạn memo thành lượt gọi riêng có test.","C":"Đổi prompt thành agent tự chủ sắp xếp thứ tự đọc, tính và soạn cho mỗi hồ sơ.","D":"Chạy prompt ba lần và lấy bản ghi nhớ xuất hiện nhiều nhất."}},"78":{"q":"Công ty thiết kế assistant dịch vụ nhân viên về lương, nghỉ phép và quyền IT với khoảng 25 công cụ. Số ngày phép và phê duyệt quyền dựa trên quy tắc cố định. Bản đầu đặt tất cả sau một agent và system prompt dài. Hai lựa chọn phân tách nào nên làm trước? (Chọn hai.)","o":{"A":"Giữ một agent 25 công cụ, viết mô tả dài hơn để phân biệt.","B":"Đặt router agent trước agent duy nhất, lọc công cụ nhưng không đổi prompt hay phạm vi.","C":"Mỗi agent miền đều có đủ 25 công cụ cho yêu cầu liên miền.","D":"Tính phép và kiểm quy tắc duyệt quyền bằng code, Claude chỉ trích thông tin yêu cầu và giải thích kết quả.","E":"Chia công cụ theo nghiệp vụ thành agent lương, nghỉ phép, quyền IT, mỗi agent chỉ giữ công cụ cần."}},"79":{"q":"Nhóm xây hệ thống năm agent trả lời câu hỏi nhân sự về một chính sách công tác 20 trang: lead agent giao cho subagent chuyến bay, khách sạn, bữa ăn, phụ cấp ngày và phê duyệt rồi tổng hợp. Câu hỏi ngắn, tài liệu vừa một context, phí token gấp năm lần prototype một lượt mà không tăng chất lượng đo được. Nên khuyến nghị gì?","o":{"A":"Giữ thiết kế nhưng chuyển năm subagent sang model nhẹ nhất để tiết kiệm.","B":"Thêm subagent thứ sáu kiểm tra câu trả lời gộp.","C":"Cho mọi subagent đọc hết lịch sử lead agent để giảm hỏi lại.","D":"Quay lại một lượt gọi tăng cường với chính sách trong prefix cache vì không cần song song thực sự hay cách ly context."}},"80":{"q":"Sáu tháng sau triển khai assistant Claude cho nhân viên tư vấn thuế và kỹ sư nội bộ, CFO yêu cầu báo cáo riêng về productivity, tách khỏi efficiency, transformation, cost và SLA. Hai phát biểu nào là bằng chứng productivity chính? (Chọn hai.)","o":{"A":"Nhân viên tư vấn thuế giờ có buổi chiều để tư vấn khách hàng, trước đây không có thời gian.","B":"Mỗi nhân viên nay hoàn thành nhiều hơn khoảng 35% tờ khai tiêu chuẩn mỗi tuần.","C":"Kỹ sư dành thời gian review cho rủi ro kiến trúc thay vì rà lỗi định dạng và đặt tên.","D":"Công ty đóng bộ phận chuẩn bị tờ khai thủ công và chuyển nhân viên sang dịch vụ tư vấn mới.","E":"Thời gian phản hồi mùa cao điểm luôn đạt cam kết bốn giây."}},"81":{"q":"Assistant tiếp nhận yêu cầu bồi thường viết phản hồi văn bản tự do, dịch vụ phía sau dùng regex để quyết định mở hồ sơ. Sau cập nhật prompt, tích hợp lỗi khi model đổi cách diễn đạt; hai quyết định sai định dạng đã được thực hiện trước khi phát hiện. Thay đổi nào giải quyết trực tiếp nguyên nhân?","o":{"A":"Giảm temperature để model luôn diễn đạt giống nhau.","B":"Thêm mẫu regex cho mọi cách diễn đạt mới trong log.","C":"Yêu cầu model luôn dùng chính xác “OPEN CASE” hoặc “NO CASE”.","D":"Yêu cầu đầu ra theo JSON schema xác định và kiểm tra bằng code trước khi dịch vụ thực hiện quyết định."}},"82":{"q":"System prompt của assistant hỗ trợ thẻ ngân hàng chỉ nói “hãy cẩn trọng với chủ đề nhạy cảm”. Đánh giá cho thấy đôi lúc tư vấn đầu tư hoặc nói về tài khoản khách khác; red-team test còn khiến nó nghe theo chỉ dẫn ẩn trong email khách dán vào. Văn bản chính sách retrieval và tin nhắn khách được ghép với chỉ dẫn như văn bản thuần. Hai thay đổi thiết kế prompt nào cần làm? (Chọn hai.)","o":{"A":"Liệt kê rõ chủ đề ngoài phạm vi như tư vấn đầu tư và tài khoản người khác, với câu chuyển giao cố định.","B":"Giảm temperature để câu trả lời chủ đề nhạy cảm thận trọng, lặp lại được.","C":"Ghi log phản hồi nhắc đến chủ đề nhạy cảm để nhóm tuân thủ rà soát mỗi tuần.","D":"Yêu cầu model tự phán đoán chủ đề nào quá nhạy cảm.","E":"Bọc chính sách và tin nhắn khách trong các thẻ XML riêng, yêu cầu model coi chúng là dữ liệu."}},"83":{"q":"Nhóm mua sắm dùng zero-shot prompt trích loại điều khoản từ hợp đồng nhà cung cấp vào JSON cố định. Đánh giá 400 hợp đồng đã gán nhãn cho độ chính xác tổng thể cao, nhưng điều khoản bồi thường nhiều bên và điều khoản được phụ lục sửa thường có cấu trúc trường sai. Mô tả và định nghĩa danh mục đã đầy đủ. Nên thay đổi gì tiếp?","o":{"A":"Thêm chỉ dẫn suy luận từng bước cho tất cả yêu cầu.","B":"Thêm một số ví dụ đa dạng, có thẻ, minh họa đầu ra đúng cho bồi thường nhiều bên và điều khoản sửa đổi.","C":"Chuyển sang model mạnh nhất để xử lý ca biên không sửa prompt.","D":"Thêm 40 ví dụ loại điều khoản phổ biến nhất để củng cố JSON."}},"84":{"q":"Agent vận hành nội bộ kết nối 70 công cụ HR, tài chính, cơ sở vật chất và IT. Mọi công cụ đều dùng ở ít nhất một loại yêu cầu, nhưng thông thường chỉ cần 2–3. Định nghĩa công cụ chiếm phần lớn input token, thời gian đến token đầu tăng và agent nhầm công cụ tên giống nhau. Thay đổi nào giảm token mà vẫn giữ mọi năng lực?","o":{"A":"Chỉ nạp nhóm công cụ lõi và cho agent khám phá định nghĩa còn lại khi cần qua tool search.","B":"Dùng model có context window lớn hơn để đủ chỗ 70 công cụ.","C":"Rút mọi mô tả công cụ thành một dòng.","D":"Chép định nghĩa công cụ thành văn bản thuần vào system prompt để cache cùng chính sách."}},"85":{"q":"Assistant IT helpdesk thường có phiên trên 60 lượt. Mỗi yêu cầu gửi lại toàn bộ transcript và mười bài KB truy xuất nguyên văn. Chi phí/latency tăng dần; cuối phiên hay nhắc giải pháp của vấn đề cũ không liên quan. Cần giảm token mà không giảm chất lượng tập đánh giá. Hai thay đổi nào phù hợp? (Chọn hai.)","o":{"A":"Tăng retrieval thành 20 bài để có nhiều khả năng chứa đáp án.","B":"Tóm tắt lượt cũ, giữ nguyên lượt gần đây và các mã định danh, quyết định, ràng buộc quan trọng.","C":"Bỏ phần ngoài phạm vi và định dạng đầu ra khỏi system prompt.","D":"Rút bài truy xuất chỉ còn đoạn liên quan đến câu hiện tại, bỏ chunk trùng hoặc chồng lấn.","E":"Dùng context window lớn hơn để chứa toàn bộ transcript."}},"86":{"q":"Assistant hỗ trợ gửi system prompt 6.000 token gồm giọng điệu và chính sách hoàn trả, rồi đến hội thoại. Bật prompt caching từ tháng trước nhưng gần như không cache hit, thời gian đến token đầu không cải thiện. Kiểm tra thấy timestamp hiện tại và tên khách được chèn vào dòng đầu system prompt. Nên làm gì?","o":{"A":"Rút system prompt xuống dưới ngưỡng áp dụng caching.","B":"Gửi chính sách như tài liệu retrieval sau tin nhắn người dùng để system prompt nhỏ.","C":"Chuyển timestamp và tên khách xuống cuối yêu cầu để prompt tĩnh tạo prefix giống hệt.","D":"Gửi yêu cầu warm-up định kỳ để cache không hết hạn."}},"87":{"q":"Assistant nghiên cứu orchestrator và năm subagent có hóa đơn model tăng gấp đôi trong hai tháng. Dashboard chỉ thấy tổng token input/output tăng, không xác định bước hay subagent nào. Trước khi sửa cấu hình, cần thêm instrument gì để tìm nguyên nhân?","o":{"A":"Đổi mọi subagent sang model rẻ nhất rồi so hóa đơn tháng tới.","B":"Thêm cảnh báo ngân sách khi tổng token vượt ngưỡng tài chính.","C":"Phát tracing span cho từng bước agent, gồm token, latency và correlation ID được truyền xuyên suốt.","D":"Ghi toàn bộ prompt/phản hồi thô để kỹ sư tự xem hội thoại dài."}},"88":{"q":"Rà soát sự cố agent xếp lịch bệnh nhân tìm hai lỗi: kỹ sư không dựng lại được đầu vào/đầu ra lời gọi đổi lịch bị lỗi hay yêu cầu người dùng khởi phát; một số log chứa số điện thoại bệnh nhân sao từ tham số công cụ. Hai thay đổi nào tốt nhất? (Chọn hai.)","o":{"A":"Ghi đầu vào, đầu ra và trạng thái lời gọi công cụ, che các trường nhạy cảm đã biết trước khi vào kho log.","B":"Ngừng log payload công cụ, chỉ ghi mã thành công/lỗi.","C":"Sao chép toàn bộ prompt và payload không che vào bucket riêng hạn chế truy cập nhưng lưu lâu hơn.","D":"Chạy batch đêm tìm và xóa log khớp mẫu số điện thoại.","E":"Truyền request-scoped correlation ID qua agent, mọi tool call và dịch vụ sau."}},"89":{"q":"Assistant tri thức trên 40.000 tài liệu kỹ thuật hoạt động tốt đến tuần trước, khi nhóm thay embedding model mã hóa truy vấn. Từ đó relevance giảm mạnh mọi loại tài liệu, còn generation model, prompt, latency không đổi. Sửa gì phù hợp nhất?","o":{"A":"Tăng retrieval top-k từ 5 lên 20.","B":"Chuyển generation sang model mạnh nhất để suy luận trên đoạn ít liên quan.","C":"Thêm chỉ dẫn trong system prompt để Claude trả lời không biết khi nguồn không phù hợp.","D":"Re-embed toàn bộ corpus bằng embedding model mới, rồi chạy bộ kiểm thử hồi quy retrieval trước release."}},"90":{"q":"Hãng luật xây RAG trên hợp đồng và hồ sơ vụ việc. Luật sư yêu cầu mỗi đáp án truy vết chính xác điều khoản nguồn và chỉ xem hồ sơ được phân công. Hai thiết kế nào đáp ứng tốt nhất? (Chọn hai.)","o":{"A":"Embed mỗi hợp đồng thành một vector toàn tài liệu để citation trỏ đến file đầy đủ.","B":"Ghép context có chunk source ID ổn định, bắt buộc citation theo điều khoản và xác minh ID dẫn nguồn đã được truy xuất.","C":"Cho retrieval tìm mọi vụ việc rồi ẩn đoạn không có quyền sau khi model sinh câu trả lời.","D":"Lưu danh sách quyền truy cập hồ sơ làm metadata chunk khi ingest và lọc trong retrieval trước khi ghép context.","E":"Tăng top-k để rút nhiều hợp đồng hơn."}},"91":{"q":"Chuyên viên tài chính hỏi assistant tổng hoàn tiền vượt ngưỡng theo vùng trong quý trước. Bản ghi nằm trong data warehouse quan hệ có schema/index tốt. Thiết kế hiện embed từng dòng vào vector index và để Claude cộng các dòng retrieval, tổng thường sai. Nên thiết kế lại thế nào?","o":{"A":"Cho Claude công cụ truy vấn hạn chế chạy SQL chỉ đọc trên warehouse và giải thích kết quả.","B":"Tăng đáng kể top-k để lấy thêm dòng rồi cộng.","C":"Đổi vector index sang hybrid dense và keyword retrieval.","D":"Định tuyến sang model mạnh nhất để cộng nhiều dòng chính xác hơn."}},"92":{"q":"Nhà cung cấp SaaS chạy assistant chung cho nhiều tenant trên index tài liệu dùng chung. Truy vấn gồm triệu chứng diễn đạt lại như “thiết bị không thức dậy” và mã lỗi chính xác “E-4471”; dense-only retrieval hay bỏ sót bài về mã lỗi. Audit cũng thấy runbook riêng tenant này bị dẫn trong đáp án tenant khác. Hai thay đổi nào tốt nhất? (Chọn hai.)","o":{"A":"Kết hợp dense và sparse keyword retrieval, hợp nhất thứ hạng rồi rerank ứng viên trước ghép context.","B":"Giữ dense-only nhưng thay embedding model lớn hơn.","C":"Áp lọc metadata tenant ngay trong retrieval để dữ liệu tenant khác không vào top-k.","D":"Quét đáp án và xóa câu nhắc tên tenant khác trước khi hiển thị.","E":"Tăng top-k cho truy vấn có mã lỗi."}},"93":{"q":"Assistant vận hành có 45 công cụ hóa đơn, giao hàng, hoàn trả. Audit xác nhận mỗi công cụ phục vụ nhiệm vụ xác định nhưng định nghĩa chiếm phần lớn yêu cầu, thời gian token đầu cao, Claude đôi lúc chọn nhầm tên giống nhau. Trưởng nhóm định xóa 20 công cụ ít dùng nhất. Nên khuyến nghị gì?","o":{"A":"Đồng ý xóa 20 công cụ để giảm token và lỗi chọn.","B":"Giữ công cụ cốt lõi thường dùng được nạp, hoãn phần còn lại qua tool search với mô tả rõ tiền tố miền nghiệp vụ.","C":"Gộp công cụ giống nhau thành vài công cụ đa năng với tham số mode chọn hành động.","D":"Chuyển model context window lớn hơn để đủ chỗ 45 công cụ."}},"94":{"q":"System prompt của assistant nội bộ phình to gồm quy trình tuân thủ 30 trang, brand guide 20 trang và nhiều manual sản phẩm, dù mỗi nguồn chỉ liên quan ít yêu cầu. Chi phí/latency tăng và Claude đôi khi áp quy trình tuân thủ vào câu hỏi không liên quan. Hai thay đổi nào giải quyết cả hai vấn đề? (Chọn hai.)","o":{"A":"Tóm tắt tất cả thành hai trang, luôn đặt trong system prompt.","B":"Đóng gói quy trình tuân thủ và style guide thành Skills, chỉ tải đầy đủ khi tác vụ khớp.","C":"Giữ hết trong system prompt nhưng bật caching prefix.","D":"Dùng model context window lớn hơn để không lấn hội thoại.","E":"Thay manual sản phẩm dán vào prompt bằng công cụ retrieval chỉ lấy đoạn cần thiết."}},"95":{"q":"Nhóm sales dùng Claude soạn đề xuất từ khối chỉ dẫn/template cố định 6.000 token và ghi chú deal retrieval mỗi lượt. Lãnh đạo ưu tiên chất lượng theo rubric không được giảm và người dùng thấy đầu ra sớm hơn. Kiến trúc sư nên làm gì trước?","o":{"A":"Dùng model nhẹ hơn cho mọi bản nháp vì phần lớn thường lệ.","B":"Giảm nửa chiều dài đầu ra tối đa để sinh xong nhanh gấp đôi.","C":"Cache prefix chỉ dẫn/template cố định trước ghi chú deal và stream bản nháp khi sinh.","D":"Giảm ghi chú deal từ tám đoạn xuống hai."}},"96":{"q":"Nhóm mua sắm dùng Claude sàng lọc điều khoản bồi thường không giới hạn trong hợp đồng nhà cung cấp trước ký. Bỏ sót trước đây khiến trách nhiệm pháp lý hàng triệu USD, còn mỗi cảnh báo sai chỉ tốn luật sư khoảng hai phút. Metric nào nên là điều kiện go-live chính?","o":{"A":"Độ chính xác tổng thể trên mọi điều khoản vì gộp hai loại lỗi.","B":"Recall của điều khoản bồi thường không giới hạn, theo dõi precision thứ cấp để quản lý khối lượng rà soát.","C":"Precision của điều khoản được gắn cờ vì cảnh báo sai tốn thời gian.","D":"Thời gian trung bình sàng lọc hợp đồng vì chu kỳ ký phải ngắn."}},"97":{"q":"Agent IT service desk xử lý ticket qua nhiều lần gọi Claude, tra cứu tool và đôi khi retry. SLA yêu cầu 95% phản hồi chat trong sáu giây; tài chính muốn so cấu hình hiện tại với model rẻ hơn nhưng có thể retry nhiều hơn. Hai metric nào cần báo cáo? (Chọn hai.)","o":{"A":"p95 latency mỗi phản hồi chat so với mục tiêu SLA sáu giây.","B":"Latency trung bình tất cả phản hồi theo xu hướng tuần.","C":"Chi phí theo giá niêm yết mỗi lượt API của từng model.","D":"Tổng token tháng của mọi ticket khi so hai tầng.","E":"Chi phí mỗi ticket giải quyết xong gồm retry và các lượt gọi công cụ của mỗi tầng."}},"98":{"q":"Mỗi đêm nền tảng hỗ trợ phân loại lại khoảng 200.000 ticket đã đóng cho báo cáo xu hướng tuần mà lãnh đạo đọc thứ Hai. Prompt/model đã xác thực quý trước, độ chính xác không được đổi. Job đêm hiện còn đắt hơn assistant chat trực tiếp và không cần kết quả trước sáng. Thay đổi nào nên làm đầu tiên?","o":{"A":"Ghép hai mươi ticket vào một yêu cầu để chỉ gửi prompt dài một lần.","B":"Đổi job sang model nhỏ nhất vì phân loại ticket đóng ít rủi ro.","C":"Cắt mỗi ticket còn vài trăm token đầu.","D":"Gửi các yêu cầu không đổi qua Message Batches API để chạy bất đồng bộ với giá batch thấp."}},"99":{"q":"Nhóm A/B test prompt sửa cho assistant tiếp nhận yêu cầu bồi thường, phân nhóm ngẫu nhiên theo người dùng và dự kiến đạt cỡ mẫu ngày 14. Ngày 3, biến thể dẫn metric chính sáu điểm với p-value dưới 0,05, guardrail trong giới hạn. Quản lý muốn dừng và đưa vào dùng ngay. Nên khuyên gì?","o":{"A":"Tiếp tục đến cỡ mẫu dự kiến rồi quyết định; chỉ dừng sớm nếu guardrail bị vi phạm.","B":"Dừng, phát hành ngay vì đã có ý nghĩa thống kê.","C":"Dừng rồi mở test mới ba biến thể để tìm prompt tốt hơn.","D":"Phát hành ngay ở nhóm người dùng biến thể dẫn nhiều nhất, tiếp tục test nhóm khác."}},"100":{"q":"A/B test assistant hỗ trợ đa ngôn ngữ: biến thể B đồng thời viết lại system prompt và tăng retrieval top-k. Khi đủ mẫu, B cải thiện tỷ lệ giải quyết tổng thể vượt hiệu ứng tối thiểu phát hiện, nhưng người dùng tiếng Tây Ban Nha giảm năm điểm. Hai hành động nào hợp lý nhất? (Chọn hai.)","o":{"A":"Phát hành B cho tất cả vì metric chung vượt hiệu ứng tối thiểu.","B":"Chạy test tiếp theo, mỗi biến thể chỉ khác một thay đổi để quy được nguyên nhân.","C":"Bỏ slice tiếng Tây Ban Nha vì chiếm ít lưu lượng.","D":"Ghi quyết định cần lặp cải tiến với suy giảm ở slice đó, thêm ca Tây Ban Nha lỗi vào tập tham chiếu.","E":"Gộp kết quả với thử nghiệm quý trước để tăng statistical power."}},"101":{"q":"Sáu tuần sau ra mắt, assistant hỏi đáp chính sách không tăng lỗi và p95 latency đạt SLO, nhưng trưởng phòng thấy câu trả lời kém chính xác dần từ khi sổ tay HR được sắp xếp lại. Monitoring chỉ theo dõi HTTP status, latency và phí token. Thay đổi monitoring nào trực tiếp phát hiện loại vấn đề này về sau?","o":{"A":"Hạ ngưỡng cảnh báo HTTP 5xx để báo kỹ sư trực sớm hơn.","B":"Lưu vô hạn toàn bộ prompt và phản hồi để điều tra khiếu nại.","C":"Chấm định kỳ mẫu đầu ra production bằng kiểm tra và rubric đánh giá offline, phân slice theo phiên bản index.","D":"Thêm nút không thích và cảnh báo khi phản hồi tiêu cực một ngày vượt số cố định."}},"102":{"q":"Qua đêm, chi phí mỗi tác vụ phân tích tài liệu tăng 40% và thời gian đến token đầu gần gấp đôi. Kỹ sư nói không deploy code, nhưng trace chỉ lưu request ID, tổng token, tổng latency nên không biết gì thay đổi. Hai thông tin nào cần thêm vào trace từng yêu cầu để chẩn đoán trực tiếp? (Chọn hai.)","o":{"A":"Toàn văn prompt thô gồm nội dung khách, lưu không giới hạn.","B":"Tổng chi phí ngày từ hóa đơn nhà cung cấp gắn vào từng bản ghi yêu cầu.","C":"Mã định danh model, phiên bản prompt và phiên bản retrieval index phục vụ từng yêu cầu.","D":"Cảnh báo tĩnh trên mọi metric, đặt ngưỡng trước ra mắt.","E":"Tách input token thành số cached và uncached, ghi cùng thời gian đến token đầu."}},"103":{"q":"Agent phân loại email đọc thư khách và có công cụ cập nhật CRM, soạn trả lời, chuyển tiếp tới địa chỉ ngoài bất kỳ. Red-team gửi email có chữ ẩn bảo agent chuyển bản export tài khoản gần nhất ra ngoài, khiến agent thử làm. Biện pháp nào xử lý tốt nhất?","o":{"A":"Thêm quy tắc system prompt yêu cầu bỏ qua chỉ dẫn trong email khách.","B":"Log mọi chuyển tiếp vào SIEM để bảo mật xem hàng tuần.","C":"Chỉ nghe theo chỉ dẫn nhúng khi domain người gửi nằm trong danh sách duyệt.","D":"Loại công cụ chuyển tiếp ra ngoài và sàng lọc nội dung email như dữ liệu không đáng tin trước hành động."}},"104":{"q":"Assistant bảo hiểm soạn tóm tắt dàn xếp để giám định viên phê duyệt trước chi trả. Bốn tháng sau, 97% bản nháp được chấp nhận nguyên, lãnh đạo đề nghị bỏ audit cấp hai để tiết kiệm. Chưa ai so bản được chấp nhận với kết quả hồ sơ xác minh. Mối lo nào cần nêu đầu tiên?","o":{"A":"Tỷ lệ chấp nhận quá cao nên không đáng tin, cần model mạnh hơn.","B":"Tỷ lệ chấp nhận chỉ đo thứ người duyệt giữ lại, không đo đúng sai; hệ thống thường đúng dễ khiến người dùng quá tin.","C":"Có thể bỏ audit an toàn vì giám định viên vẫn chịu trách nhiệm.","D":"Giảm temperature trước để bản nháp đồng nhất."}},"105":{"q":"Nhóm tài chính dùng Claude trích dòng hàng hóa đơn và tính tổng VAT ghi sổ. Kiểm toán thấy cùng một hóa đơn đôi khi lệch vài xu qua các lượt dù đầu vào giống nhau. Kế toán trưởng đòi tổng chính xác và tái lập được. Nên đổi thiết kế thế nào?","o":{"A":"Đặt temperature bằng 0 để luôn có tổng giống nhau.","B":"Chạy mỗi hóa đơn ba lần rồi lấy tổng xuất hiện nhiều nhất.","C":"Dùng model trích các dòng vào schema đã xác thực và tính tổng bằng code tất định.","D":"Chuyển sang model mạnh nhất để loại lỗi số học."}},"106":{"q":"Agent mua sắm chuyển yêu cầu mua đã duyệt thành JSON gửi trực tiếp ERP tạo đơn. Gần đây có đơn số lượng âm và nhà cung cấp không trong danh sách duyệt. Chính sách còn yêu cầu quản lý ký đơn trên một ngưỡng tiền. Hai kiểm soát nào trực tiếp bảo đảm các quy tắc? (Chọn hai.)","o":{"A":"Thêm chỉ dẫn trong system prompt yêu cầu model kiểm lại lượng và nhà cung cấp.","B":"Xác thực payload JSON bằng code với schema nghiêm về kiểu, phạm vi và giá trị nhà cung cấp được phép.","C":"Khi ERP từ chối thì retry temperature cao để tạo đầu ra khác.","D":"Log mọi đơn hàng và kiểm toán mẫu cuối tháng.","E":"Áp ngưỡng tiền bằng quy tắc code, chuyển đơn vượt ngưỡng cho quản lý duyệt."}},"107":{"q":"Cơ quan liên bang Mỹ muốn assistant Claude tóm tắt hồ sơ vụ việc. Prototype dùng API thương mại chọn theo giá, embeddings lưu trong SaaS vector database, logs gửi công cụ giám sát bên thứ ba. Người phê duyệt yêu cầu FedRAMP Moderate. Điều gì phải quyết định kiến trúc production?","o":{"A":"Mọi thành phần trên đường dữ liệu gồm truy cập model, vector store, logging phải chạy trong môi trường được ủy quyền ở mức yêu cầu.","B":"Chỉ điểm truy cập model cần môi trường được ủy quyền, vector store và logging giữ dịch vụ cũ.","C":"Chọn model mạnh nhất vì chủ yếu cần tóm tắt chất lượng.","D":"Ký BAA với nhà cung cấp và thêm system prompt cấm lưu hồ sơ."}},"108":{"q":"Agent IT helpdesk trả lời nhân viên và đặt lại mật khẩu của chính người yêu cầu. Để nhanh, nhóm cấp service account admin dùng chung còn có thể xóa tài khoản và đổi nhóm quyền toàn directory. Bảo mật hỏi cách giảm tác hại của hallucination hoặc prompt injection. Hai thay đổi nào? (Chọn hai.)","o":{"A":"Bỏ công cụ xóa tài khoản và đổi quyền nhóm không cần cho helpdesk.","B":"Bắt agent hỏi xác nhận trong chat trước khi xóa tài khoản.","C":"Thay admin account dùng chung bằng credential có phạm vi tài khoản của người yêu cầu.","D":"Gửi mọi hành động admin vào SIEM để bảo mật kiểm tra.","E":"Dùng model mạnh hơn để ít hiểu sai."}},"109":{"q":"Nhóm pháp chế muốn agent quản lý toàn bộ gia hạn hợp đồng nhà cung cấp, kể cả gửi thông báo chấm dứt khi không gia hạn. Thông báo đã gửi không thể thu hồi. Để tiết kiệm thời gian, nhóm muốn tự gửi nếu confidence vượt 0,9. Nên thiết kế thế nào?","o":{"A":"Tự gửi trên ngưỡng, chỉ chuyển luật sư khi confidence thấp.","B":"Yêu cầu luật sư duyệt mọi bước, cả retrieval, kiểm ngày và nhắc gia hạn.","C":"Tự gửi cho hợp đồng dưới ngưỡng giá trị năm; hợp đồng lớn cần duyệt.","D":"Cho agent soạn vào hàng đợi duyệt, không có công cụ gửi; luật sư được chỉ định phải duyệt từng thông báo."}},"110":{"q":"Nhà cung cấp SaaS thêm assistant tài liệu Claude cho khách doanh nghiệp EU. Hợp đồng yêu cầu dữ liệu ở trong EU và không lộ tài liệu khách này trong đáp án khách khác. Prototype hiện dùng vector index chung và triển khai tại Mỹ. Hai thay đổi nào đáp ứng? (Chọn hai.)","o":{"A":"Giữ index chung, chỉ dẫn trong system prompt chỉ dùng tài liệu khách hiện tại.","B":"Giả danh hóa tên khách vì dữ liệu giả danh không còn chịu GDPR.","C":"Giữ prompt và tài liệu retrieval đầy đủ trong log dài hạn để điều tra lộ dữ liệu.","D":"Tách index theo khách hoặc ép tenant filter trong retrieval trước khi tài liệu vào context.","E":"Chọn vùng triển khai và đường truy cập giữ prompt, index và log trong EU theo hợp đồng."}},"111":{"q":"Ba tháng sau bàn giao assistant rà soát tài liệu cho vận hành, xảy ra hai sự cố: khi báo chất lượng giảm, kỹ sư trực không biết có thể rollback prompt mới hay cách làm; bộ đánh giá release đã ngừng chạy âm thầm vì không ai biết mình phụ trách. Hai bổ sung tài liệu bàn giao nào trực tiếp giải quyết? (Chọn hai.)","o":{"A":"Bản retrospective nêu bài học và quyết định ở giai đoạn thiết kế.","B":"FAQ khách hàng giải thích assistant và loại tài liệu hỗ trợ.","C":"Runbook và on-call playbook hướng dẫn phân loại cảnh báo, phát hành và rollback prompt qua version pin.","D":"Biên bản họp thiết kế và comment review để hiểu lý do gốc.","E":"Chỉ định nhóm sở hữu bộ eval, cách chạy và ngưỡng chặn từng release."}},"112":{"q":"Đánh giá trước bàn giao assistant xử lý yêu cầu phúc lợi cho thấy độ chính xác thấp hơn ngưỡng release trên biểu mẫu quét viết tay và hồ sơ tiếng Bồ Đào Nha, dù chiếm ít lưu lượng. Quản lý muốn bỏ kết quả khỏi tài liệu bàn giao để nhóm hỗ trợ và kiểm toán không mất niềm tin. Nên xử lý thế nào?","o":{"A":"Bỏ khỏi bàn giao, âm thầm sửa trong kỳ release tới.","B":"Chỉ ghi trong retrospective dự án để lần sau xem.","C":"Ghi là hạn chế đã biết, nêu dạng đầu vào bị ảnh hưởng, rủi ro còn lại và cách chuyển sang người xử lý.","D":"Nhắc trong FAQ khách hàng bằng lời tích cực khuyến khích gửi biểu mẫu tiếng Anh đánh máy."}},"113":{"q":"Dịch vụ tóm tắt hợp đồng dùng một phiên bản model tám tháng, giữ tập tham chiếu có version và ngưỡng release. Model mới vừa ra, sponsor muốn chuyển production ngay tuần này vì thông báo nói suy luận tốt hơn. Nên làm gì?","o":{"A":"Chạy lại tập tham chiếu và ngưỡng trên model mới cho từng slice, kiểm SLA/chi phí rồi triển khai sau version pin.","B":"Đổi production ngay vì bản mới ít nhất phải tốt bằng bản cũ.","C":"Giữ bản cũ đến khi nhà cung cấp ngừng hỗ trợ vì đã đạt ngưỡng.","D":"Xây tập đánh giá mới theo điểm mạnh quảng bá của bản mới rồi quyết định."}},"114":{"q":"ADR-007 đã duyệt một năm trước quy định mọi lượt phân loại hồ sơ yêu cầu dùng model mạnh nhất. Chạy lại tập tham chiếu hiện cho thấy model nhẹ hơn đạt chuẩn chất lượng tổng thể với phí thấp hơn nhiều. Trưởng nhóm nói quyết định đã duyệt cần bất biến. Hai hành động nào nên làm? (Chọn hai.)","o":{"A":"Viết ADR mới ghi bằng chứng, thay thế ADR-007 nhưng giữ bản gốc để xem lịch sử.","B":"Sửa trực tiếp ADR-007 thành model nhẹ để chỉ còn một bản ghi hiện hành.","C":"Kiểm tầng nhẹ theo từng slice với ngưỡng release trước khi định tuyến production.","D":"Giữ nguyên ADR-007 vì xét lại quyết định làm giảm niềm tin stakeholder.","E":"Đưa mọi traffic sang model nhẹ ngay vì aggregate đã đạt."}},"115":{"q":"Monitoring production của assistant xử lý hóa đơn phát hiện trích xuất kém trên hóa đơn từ công ty con mới mua, có layout khác. Phát hiện đã ghi trong retrospective giai đoạn monitoring; tuần tới lập kế hoạch vòng sau. Làm gì để bài học thật sự thay đổi vòng sau?","o":{"A":"Lưu retrospective dài hạn trong kho dự án.","B":"Gửi retrospective cho toàn bộ stakeholder khi chuyển giai đoạn.","C":"Đặt lịch xem lại cuối vòng sau khi thu thêm dữ liệu.","D":"Chuyển thành đầu vào: thêm hóa đơn công ty con vào tập tham chiếu, câu hỏi discovery và phương án thiết kế để thử."}},"116":{"q":"Sáu tuần sau ra mắt assistant soạn đề xuất, trưởng nhóm sales một khu vực than “quá chậm để dùng khi gọi khách”. SLA chốt ở discovery quy định p95 latency, dashboard toàn tổ chức đạt thoải mái. Giám đốc vùng yêu cầu xử lý. Đầu tiên nên làm gì?","o":{"A":"Chuyển mọi lưu lượng soạn đề xuất sang model nhẹ ngay để vùng nào cũng nhanh.","B":"Đối chiếu khiếu nại với SLA latency và đo p95 riêng khu vực trước khi chọn sửa hay thương lượng lại.","C":"Đóng khiếu nại vì p95 toàn tổ chức đạt SLA.","D":"Thêm thanh tiến trình để cảm giác chờ ngắn hơn."}},"117":{"q":"Bạn chốt cam kết dịch vụ cho assistant Claude thẩm định với sponsor và vận hành nền tảng. Sponsor cần cam kết chất lượng/latency rõ để báo cáo; vận hành muốn cảnh báo trước khi vi phạm. Hai thiết lập nào nên áp dụng? (Chọn hai.)","o":{"A":"Đặt mục tiêu nội bộ đúng bằng cam kết stakeholder để theo dõi một số duy nhất.","B":"Báo cáo stakeholder theo SLA đã thống nhất tại discovery, có ngưỡng chất lượng và latency đo được.","C":"Báo mục tiêu nội bộ chặt hơn như cam kết với stakeholder.","D":"Chỉ phát cảnh báo khi SLA đã bị phá để tránh mệt mỏi cảnh báo.","E":"Vận hành theo SLO nội bộ nghiêm hơn cùng error budget để cảnh báo trước khi SLA gặp rủi ro."}},"118":{"q":"Nhóm SRE muốn cấp cluster-admin production Kubernetes cho assistant trực sự cố Claude để chẩn đoán và sửa nhanh. Assistant đọc log và ticket có thể chứa văn bản khách hàng. Nên thiết kế quyền truy cập nào?","o":{"A":"Cấp cluster-admin nhưng log mọi lệnh để truy vết và đảo ngược hành động xấu.","B":"Chỉ cấp cluster-admin khi khai báo sự cố, thêm chỉ dẫn CLAUDE.md tránh lệnh phá hủy.","C":"Mặc định chỉ cấp công cụ đọc log, trace, metric; công cụ khắc phục phạm vi hẹp chỉ chạy sau khi kỹ sư trực duyệt.","D":"Chặn toàn bộ truy cập production, kỹ sư phải sao log thủ công mỗi sự cố."}},"119":{"q":"20 phút sau deploy, checkout-api bắt đầu trả lỗi 502 ngắt quãng. Kỹ sư mở Claude Code bảo “tìm bug và push fix” vào nhánh main. Có log lỗi, distributed traces với correlation ID và lịch sử deploy qua công cụ chỉ đọc. Hai bước nào cần làm trước khi merge fix? (Chọn hai.)","o":{"A":"Cho Claude áp ngay sửa lỗi khả dĩ vào production rồi xác nhận bằng tỷ lệ lỗi.","B":"Theo dõi request lỗi xuyên dịch vụ bằng correlation ID, đối chiếu thời điểm lỗi đầu với lịch sử deploy/cấu hình.","C":"Chuyển sang model mạnh nhất để đoán nguyên nhân gốc chuẩn ngay lần đầu.","D":"Restart mọi pod checkout-api rồi đóng sự cố nếu lỗi xuống dưới ngưỡng.","E":"Tái hiện lỗi ngoài production, tốt nhất thành test đang thất bại mà fix phải làm pass."}},"120":{"q":"CLAUDE.md của nhóm nền tảng yêu cầu Claude Code chạy formatter và linter sau mỗi lần sửa file và không bao giờ sửa file trong db/migrations. Reviewer vẫn thấy PR AI chưa định dạng, tuần trước phiên đã sửa migration áp dụng rồi. Nhóm muốn hai hành vi được ép thực hiện mọi lần trên mọi repository. Nên đề xuất gì?","o":{"A":"Thêm hooks format sau sửa và chặn đường dẫn được bảo vệ, phân phối tập trung qua managed plugin marketplace.","B":"Viết lại chỉ dẫn chữ in hoa đầu CLAUDE.md và lặp trong CLAUDE.local.md cá nhân.","C":"Yêu cầu reviewer từ chối mọi PR AI lỗi format/migration đến khi developer chỉnh prompt.","D":"Chuyển chỉ dẫn vào README từng repository để Claude đọc với tài liệu build/test."}}};
const DOM={1:'D1 Design & Architecture',2:'D2 Models & Prompting',3:'D3 Integration',4:'D4 Evaluation & Testing',5:'D5 Governance & Safety',6:'D6 Communication',7:'D7 Developer Productivity'};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mark=(t,k,tag,cls)=>{const i=t.toLowerCase().indexOf(k.toLowerCase());if(i<0)return esc(t);return esc(t.slice(0,i))+`<${tag}${cls?` class="${cls}"`:''}>`+esc(t.slice(i,i+k.length))+`</${tag}>`+esc(t.slice(i+k.length))};
const st={mode:'study',view:'one',pos:0,sel:{},checked:{},rule:'',trap:true,res:{},wrongIds:[],vi:false,hl:false,viC:{},hlC:{}};
try{const s=JSON.parse(localStorage.getItem('ccarp-kw')||'{}');Object.assign(st,{mode:s.mode||'study',view:s.view||'one',pos:s.pos||0,trap:s.trap!==false,res:s.res||{},vi:!!s.vi,hl:!!s.hl})}catch(e){}
const save=()=>{try{localStorage.setItem('ccarp-kw',JSON.stringify({mode:st.mode,view:st.view,pos:st.pos,trap:st.trap,res:st.res,vi:st.vi,hl:st.hl}))}catch(e){}};
$('d').insertAdjacentHTML('beforeend',Object.entries(DOM).map(([k,v])=>`<option value="${k}">${v}</option>`).join(''));
const idx=D.map(q=>(q.id+' '+q.question+' '+Object.values(q.options).join(' ')).toLowerCase());
let list=D;
const filter=()=>{const t=$('s').value.toLowerCase().trim().split(/\s+/).filter(Boolean),dm=+$('d').value;list=D.filter((q,i)=>(!dm||q.domain===dm)&&(!st.rule||(st.rule==='WRONG'?st.wrongIds.includes(q.id):st.rule[0]==='R'?q.rules.includes(st.rule):Object.values(q.traps).some(a=>a.includes(st.rule))))&&t.every(w=>idx[i].includes(w)));if(st.pos>=list.length)st.pos=0};
const revealed=q=>st.mode==='study'||st.checked[q.id];
const card=(q,n,total)=>{
 const show=revealed(q),sel=st.sel[q.id]||[];
 const hl=q.id in st.hlC?st.hlC[q.id]:st.hl, vi=q.id in st.viC?st.viC[q.id]:st.vi, V=VI[q.id];
 const multi=q.correct.length>1;
 const rule=!hl?'':show?`<div class="rule"><span class="see">${esc(q.qk)}</span><span class="arw">→</span>${q.correct.map(L=>`<span class="pick">${L}: ${esc(q.ak[L])}</span>`).join(' ')}${q.tip?`<span class="tip">${esc(q.tip)}</span>`:''}</div>`:`<div class="rule"><span class="see">${esc(q.qk)}</span><span class="arw">→ ?</span></div>`;
 const opts=Object.entries(q.options).map(([L,t])=>{
  const ok=q.correct.includes(L);let cls='opt';
  if(show&&ok)cls+=' ok';else if(show&&sel.includes(L))cls+=' no';else if(sel.includes(L))cls+=' sel';
  const tr=st.trap&&q.traps[L];if(tr)cls+=' trap';
  const body=(show&&ok&&hl?mark(t,q.ak[L],'u','k'):esc(t))+(vi&&V?`<span class="vio">${esc(V.o[L]||'')}</span>`:'')+(tr?tr.map(id=>`<span class="tg">Bẫy: ${esc(META.traps[id].name)}</span>`).join(''):'');
  return `<button class="${cls}" data-q="${q.id}" data-l="${L}"><span class="L">${L}</span><span>${body}</span></button>`}).join('');
 let foot='';
 if(st.mode==='prac'){
  if(st.checked[q.id]){const right=sel.slice().sort().join('')===q.correct.join('');foot=`<div class="res ${right?'g':'b'}">${right?'Đúng':'Sai'}: đáp án ${q.correct.join(', ')}</div>${!right?`<div class="nav" style="margin-top:8px"><button data-again="${q.id}">Làm lại câu này</button></div>`:''}`}
  else foot=`<p class="hint">${multi?'Chọn '+q.correct.length+' đáp án rồi bấm Kiểm tra.':'Chọn một đáp án rồi bấm Kiểm tra.'}</p><div class="nav" style="margin-top:8px"><button data-check="${q.id}" ${sel.length?'':'disabled'}>Kiểm tra</button></div>`;
 }
 return `<section class="card">${n?`<div class="top"><span>Câu ${n} / ${total}</span><span>${Math.round(n/total*100)}%</span></div><div class="prog"><i style="width:${n/total*100}%"></i></div>`:''}
 <div class="ct"><div class="chips"><span class="chip q">QUESTION ${q.id}</span><span class="chip">${DOM[q.domain]}</span>${multi?`<span class="chip">Chọn ${q.correct.length}</span>`:''}</div>
 <div class="cbtn"><button data-vi="${q.id}" aria-pressed="${vi}" title="Dịch sang tiếng Việt"><span class="vi-ic">VI</span>${vi?'Ẩn dịch':'Dịch'}</button><button data-hl="${q.id}" aria-pressed="${hl}" title="Bật/tắt highlight từ khóa"><span class="hl-ic"></span>Highlight</button></div></div>
 ${rule}${show&&hl&&q.rules.length?`<div class="rb">${q.rules.map(id=>`<div class="rbi"><b>${id} · ${esc(META.rules[id].name)}</b><p>${esc(META.rules[id].vi)}</p></div>`).join('')}</div>`:''}<p class="qt">${hl?mark(q.question,q.qk,'mark'):esc(q.question)}</p>${vi&&V?`<div class="viq"><b>Bản dịch tiếng Việt</b>${esc(V.q)}</div>`:''}<div class="opts">${opts}</div>${foot}</section>`;
};
const render=()=>{
 stats();const M=$('M');
 if(st.view==='rules'){M.innerHTML=rulesView();return}
 const ban=st.rule?`<div class="banner"><span>${st.rule==='WRONG'?'Thi lại câu sai':'Đang luyện '+st.rule+' · '+esc((META.rules[st.rule]||META.traps[st.rule]).name)} (${list.length} câu${st.rule==='WRONG'?' · còn sai '+list.filter(q=>st.res[q.id]===false).length:''})</span><button id="clr">Bỏ lọc</button></div>`:'';
 if(!list.length){M.innerHTML='<p class="empty">Không có câu nào khớp. Thử từ khác hoặc bỏ lọc domain.</p>';return}
 if(st.view==='all'){M.innerHTML=ban+'<div class="list">'+list.map(q=>card(q)).join('')+'</div>';return}
 const q=list[st.pos];
 M.innerHTML=ban+card(q,st.pos+1,list.length)+`<div class="nav"><button id="prev" ${st.pos?'':'disabled'}>← Câu trước</button><button id="next" ${st.pos<list.length-1?'':'disabled'}>Câu sau →</button></div>
 <div class="grid">${list.map((x,i)=>`<button data-go="${i}" class="${i===st.pos?'cur ':''}${rc(x.id)}" aria-label="Câu ${x.id}">${x.id}</button>`).join('')}</div>`;
};
const rc=id=>st.res[id]===true?'r-ok':st.res[id]===false?'r-bad':'';
const stats=()=>{const v=Object.values(st.res),g=v.filter(x=>x).length,b=v.length-g;
 $('ST').innerHTML=`<span class="g">Đúng ${g}</span><span class="b">Sai ${b}</span><span class="m">Chưa làm ${D.length-v.length}</span><span class="sp"></span>${b?`<button id="retry">Thi lại ${b} câu sai</button>`:''}${v.length?`<button id="reset">Xóa kết quả</button>`:''}`};
$('ST').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='retry'){st.wrongIds=Object.keys(st.res).filter(k=>st.res[k]===false).map(Number);st.wrongIds.forEach(id=>{delete st.sel[id];delete st.checked[id]});st.rule='WRONG';$('s').value='';$('d').value='0';st.mode='prac';$('mStudy').setAttribute('aria-pressed',false);$('mPrac').setAttribute('aria-pressed',true);filter();st.pos=0;setView('one')}
 if(b.id==='reset'){st.res={};st.sel={};st.checked={};if(st.rule==='WRONG')st.rule='';filter();save();render()}});
const rulesView=()=>{
 const qOf=id=>D.filter(q=>id[0]==='R'?q.rules.includes(id):Object.values(q.traps).some(a=>a.includes(id)));
 const qb=id=>qOf(id).map(q=>`<button data-jump="${id}:${q.id}" class="${rc(q.id)}">${q.id}</button>`).join('');
 const traps=Object.entries(META.traps).map(([id,t])=>{const n=qOf(id).length;return `<div class="rc"><h3><span class="id">${id}</span>Thấy là loại<span class="cnt">${n} câu · 0 lần là đáp án đúng</span></h3>
  <div class="row"><span class="lab">Option</span><span class="kt">${esc(t.name)}</span></div><p class="vi">${esc(t.vi)}</p>
  <div class="qs"><button class="go" data-drill="${id}">Luyện ${n} câu</button>${qb(id)}</div></div>`}).join('');
 const rules=Object.entries(META.rules).map(([id,r])=>{const n=qOf(id).length;return `<div class="rc"><h3><span class="id">${id}</span>${esc(r.name)}<span class="cnt">${n} câu</span></h3>
  <div class="row"><span class="lab">Đề có</span>${r.see.map(k=>`<span class="kq">${esc(k)}</span>`).join('')}</div>
  <div class="row"><span class="lab">→ Chọn</span>${r.pick.map(k=>`<span class="ka">${esc(k)}</span>`).join('')}</div>
  <p class="vi">${esc(r.vi)}</p><div class="qs"><button class="go" data-drill="${id}">Luyện ${n} câu</button>${qb(id)}</div></div>`}).join('');
 return `<h2>Bẫy: thấy cụm này trong phương án là loại</h2><p class="lead">Trong cả 120 câu, các cụm dưới đây chưa lần nào nằm trong đáp án đúng. Gạch chúng trước, thường chỉ còn 1–2 phương án.</p><div class="rgrid">${traps}</div>
 <h2>Quy luật: thấy từ khóa trong đề → chọn đáp án</h2><p class="lead">Mỗi quy luật kèm danh sách câu áp dụng. Bấm "Luyện" để làm riêng các câu đó, hoặc bấm số câu để mở thẳng câu đó.</p><div class="rgrid">${rules}</div>`;
};
const go=i=>{st.pos=Math.max(0,Math.min(list.length-1,i));save();render();window.scrollTo({top:0})};
$('M').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.vi){const id=+b.dataset.vi,cur=id in st.viC?st.viC[id]:st.vi;st.viC[id]=!cur;return render()}
 if(b.dataset.hl){const id=+b.dataset.hl,cur=id in st.hlC?st.hlC[id]:st.hl;st.hlC[id]=!cur;return render()}
 if(b.id==='clr'){st.rule='';filter();return render()}
 if(b.dataset.drill||b.dataset.jump){const [id,qid]=(b.dataset.drill||b.dataset.jump).split(':');st.rule=id;$('s').value='';$('d').value='0';filter();st.pos=qid?Math.max(0,list.findIndex(x=>x.id===+qid)):0;return setView('one')}
 if(b.id==='prev')return go(st.pos-1);
 if(b.id==='next')return go(st.pos+1);
 if(b.dataset.go)return go(+b.dataset.go);
 if(b.dataset.again){const id=+b.dataset.again;delete st.sel[id];delete st.checked[id];return render()}
 if(b.dataset.check){const id=+b.dataset.check,q=D.find(x=>x.id===id);st.checked[id]=true;st.res[id]=(st.sel[id]||[]).slice().sort().join('')===q.correct.join('');save();return render()}
 if(b.dataset.l&&st.mode==='prac'){const id=+b.dataset.q,q=D.find(x=>x.id===id);if(st.checked[id])return;let s=st.sel[id]||[];const L=b.dataset.l;
  if(q.correct.length>1)s=s.includes(L)?s.filter(x=>x!==L):[...s,L];else s=[L];st.sel[id]=s;render()}
});
const setMode=m=>{st.mode=m;$('mStudy').setAttribute('aria-pressed',m==='study');$('mPrac').setAttribute('aria-pressed',m==='prac');save();render()};
const setView=v=>{st.view=v;$('vOne').setAttribute('aria-pressed',v==='one');$('vAll').setAttribute('aria-pressed',v==='all');$('vRules').setAttribute('aria-pressed',v==='rules');save();render();window.scrollTo({top:0})};
$('mStudy').onclick=()=>setMode('study');$('mPrac').onclick=()=>{st.sel={};st.checked={};setMode('prac')};
$('vOne').onclick=()=>setView('one');$('vAll').onclick=()=>setView('all');$('vRules').onclick=()=>setView('rules');
$('trap').onclick=()=>{st.trap=!st.trap;$('trap').setAttribute('aria-pressed',st.trap);save();render()};$('trap').setAttribute('aria-pressed',st.trap);
const gsync=()=>{$('gVI').setAttribute('aria-pressed',st.vi);$('gHL').setAttribute('aria-pressed',st.hl)};
$('gVI').onclick=()=>{st.vi=!st.vi;st.viC={};gsync();save();render()};
$('gHL').onclick=()=>{st.hl=!st.hl;st.hlC={};gsync();save();render()};gsync();
$('s').addEventListener('input',()=>{st.pos=0;filter();render()});
$('d').addEventListener('change',()=>{st.pos=0;filter();render()});
document.addEventListener('keydown',e=>{if(st.view!=='one'||e.target.matches('input,select'))return;if(e.key==='ArrowRight')go(st.pos+1);if(e.key==='ArrowLeft')go(st.pos-1)});
filter();setMode(st.mode);setView(st.view);
}
</script>
</body>
</html>
