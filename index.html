<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCAR-P 120 từ khóa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: the user's own trainer, same dark study screen, plus a highlighter
   IDEA: an exam question card with the decisive words marked
   PICTURE: the full question card with A–E options, keyword pair on top
   COLOUR and TYPE: deep navy, indigo accent, yellow for question keyword, green for answer keyword; Manrope
   LAYOUT: one centred card, nav below, jump grid at the bottom */
:root{color-scheme:light dark;--bg:light-dark(#f4f5fb,#0f1222);--card:light-dark(#fff,#181c30);--card2:light-dark(#f7f8fc,#1f2440);--ink:light-dark(#141729,#eef0fa);--mut:light-dark(#5d6380,#9aa0c0);--line:light-dark(#dfe2ef,#2b3154);--acc:light-dark(#4f46e5,#8b85ff);--hl:light-dark(#ffe873,#ffe27a);--hlink:#1b1600;--ok:light-dark(#0f8a46,#3ddc84);--okbg:light-dark(#e8f8ef,#12301f);--bad:light-dark(#c62828,#ff6b6b);--badbg:light-dark(#fdecec,#3a1a1f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:900px;margin:0 auto;padding:clamp(20px,4vw,40px) max(4vw,14px) 48px}
header{text-align:center;margin-bottom:18px}
.eyebrow{color:var(--acc);font-weight:700;font-size:13px}
h1{font-size:clamp(26px,4.4vw,38px);line-height:1.08;margin:4px 0 6px;font-weight:800;text-wrap:balance}
.sub{color:var(--mut);margin:0;font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 12px}
input[type=search],select{font:inherit;font-size:16px;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type=search]{flex:1 1 220px}
select{flex:0 1 230px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0}
button{font:inherit;font-size:14px;font-weight:700;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,3vw,26px)}
.top{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:6px}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:16px}.prog i{display:block;height:100%;background:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:7px;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.chip.q{background:var(--acc);color:#fff;border-color:var(--acc)}
.rule{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:15px;font-weight:700}
.rule .see{background:var(--hl);color:var(--hlink);padding:1px 7px;border-radius:5px}
.rule .arw{color:var(--mut)}
.rule .pick{color:var(--ok);text-decoration:underline 2px;text-underline-offset:3px}
.rule .tip{flex-basis:100%;font-weight:600;font-size:13px;color:var(--mut)}
.qt{font-size:clamp(17px,2.2vw,19px);font-weight:700;line-height:1.5;margin:0 0 18px;white-space:pre-line}
mark{background:var(--hl);color:var(--hlink);padding:0 3px;border-radius:4px;text-decoration:underline 2px #d97706;text-underline-offset:3px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:start;width:100%;min-height:52px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:500;font-size:15px;line-height:1.5}
.opt .L{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--line);color:var(--ink)}
.opt.sel{border-color:var(--acc)}
.opt.sel .L{background:var(--acc);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .L{background:var(--ok);color:#fff}
.opt.no{border-color:var(--bad);background:var(--badbg)}
u.k{text-decoration:underline 3px var(--ok);text-underline-offset:3px;font-weight:800;color:var(--ok)}
.hint{font-size:13px;color:var(--mut);margin:12px 0 0}
.res{margin-top:12px;font-weight:800}
.res.g{color:var(--ok)}.res.b{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:22px}
.grid button{min-height:40px;padding:0;font-size:13px}
.grid button.cur{background:var(--acc);color:#fff;border-color:var(--acc)}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.list .card{margin-bottom:16px}
@media(max-width:600px){.opt{font-size:14px}.rule{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="eyebrow">Claude Certified Architect</div>
<h1>CCAR-P 120 · Từ khóa quyết định</h1>
<p class="sub">Đủ 120 câu, nguyên văn câu hỏi và các phương án. Vàng = từ khóa trong đề · Xanh gạch chân = từ khóa trong đáp án đúng.</p>
</header>
<div class="tools">
<input id="s" type="search" placeholder="Tìm từ trong đề, vd: tool search, HIPAA…" aria-label="Tìm theo từ khóa">
<select id="d" aria-label="Lọc theo domain"><option value="0">Tất cả domain</option></select>
<div class="seg" role="group" aria-label="Chế độ">
<button id="mStudy" aria-pressed="true">Học (hiện đáp án)</button>
<button id="mPrac" aria-pressed="false">Luyện tập</button>
</div>
<div class="seg" role="group" aria-label="Kiểu xem">
<button id="vOne" aria-pressed="true">Từng câu</button>
<button id="vAll" aria-pressed="false">Tất cả</button>
</div>
</div>
<main id="M"></main>
</div>
<script>
{
const D=[{"id":1,"question":"You are comparing patterns for a batch document-classification job that follows fixed steps: extract metadata, classify, summarize, and persist. Which pattern is the best fit and why?","options":{"A":"A workflow pattern, because the steps are well-defined and predictable per-request token cost is preferred over flexibility.","B":"An agentic pattern, because agents tend to be more accurate than workflows, so this is a reasonable default choice for most classification tasks.","C":"An agentic pattern, because the open-ended planning capability of agents produces more consistent structured outputs than a fixed workflow graph on classification tasks.","D":"A workflow pattern, because agentic patterns generally cost more per request than a workflow graph, regardless of the task's structure."},"domain":1,"correct":["A"],"qk":"fixed steps","ak":{"A":"workflow pattern"}},{"id":2,"question":"An architect at an organization is reviewing two draft communication packages for the same architectural decision. Package 1 contains a threat model, residual-risk register, and control-mapping table. Package 2 contains a list of capabilities delivered and feature-level roadmap dependencies. Which two audiences are correctly matched to these packages? (Select two.)","options":{"A":"Package 2 → executive sponsor","B":"Package 2 → product manager owning the roadmap","C":"Package 1 → security and compliance reviewer","D":"Package 1 → engineering implementation team","E":"Package 2 → security and compliance reviewer"},"domain":6,"correct":["B","C"],"qk":"threat model","ak":{"B":"product manager","C":"security and compliance reviewer"}},{"id":3,"question":"You are reviewing instrumentation in a multi-agent system. Which two findings constitute valid observability gaps in the instrumentation? (Select two.) Each correct answer presents a complete solution.","options":{"A":"Tool-call payloads and outcomes are recorded with redaction applied to known sensitive fields.","B":"Request-scoped correlation identifiers do not propagate across agent and tool calls.","C":"Latency and token usage on every span are emitted to the central metrics pipeline.","D":"Model identity and version on each turn are not recorded with the turn artifacts.","E":"Trace spans for each agent step are exported to the shared distributed-tracing backend."},"domain":3,"correct":["B","D"],"qk":"observability gaps","ak":{"B":"correlation identifiers","D":"Model identity and version"}},{"id":4,"question":"You are defining transparency practices for a customer-facing assistant whose responses are materially shaped by AI. Which transparency practice most directly supports responsible deployment?","options":{"A":"Disclose AI involvement to end users in line with the organization's transparency policy and provide a documented path to reach a human when needed.","B":"Disclose AI involvement only to internal staff and operators while withholding that information from the end users whose interactions are materially shaped by the AI system.","C":"Disclose AI involvement in the terms of service at signup and rely on that single notice to cover all subsequent interactions.","D":"Refuse to answer any user question about how the responses were produced or whether AI was involved, treating the AI's role as confidential operational information."},"domain":5,"correct":["A"],"qk":"transparency practices","ak":{"A":"Disclose AI involvement"}},{"id":5,"question":"You are integrating AI-assisted tooling into the team's documentation workflow. The team wants generated documentation that stays grounded in code. Which integration approach best fits this requirement?","options":{"A":"Configure subagents that read the relevant code files and draft documentation, then have a single reviewer skim only the summary section before publication.","B":"Configure subagents that read the relevant code files and generate documentation, then publish it directly to the team's shared documentation site.","C":"Configure subagents that read the relevant code files via filesystem and code-search tools, generate the documentation, and emit changes through the team's normal review workflow.","D":"Configure subagents that read a small sample of the repository's files and generate documentation for the whole codebase from the sample, then route it through review."},"domain":7,"correct":["C"],"qk":"grounded in code","ak":{"C":"subagents that read the relevant code files"}},{"id":6,"question":"A solutions architect is analyzing stakeholder feedback collected after the first quarter of a Claude-powered procurement automation deployment. The feedback includes four statements: (1) 'Our procurement team is processing 3x more purchase orders per analyst per day.' (2) 'We have eliminated manual data entry role entirely and redeployed those staff to vendor relationship management.' (3) 'The API integration costs are running 40% over projected per-transaction budget.' (4) 'Response latency during end-of-month batch runs is averaging 11 seconds, against our committed 5-second response SLA.' Which of the following correctly identifies the primary business value pillar each stakeholder statement represents?","options":{"A":"Statement 1: Efficiency; Statement 2: Transformation; Statement 3: Solution Cost; Statement 4: Performance SLA","B":"Statement 1: Productivity; Statement 2: Efficiency; Statement 3: Solution Cost; Statement 4: Performance SLA","C":"Statement 1: Efficiency; Statement 2: Productivity; Statement 3: Performance SLA; Statement 4: Solution Cost","D":"Statement 1: Transformation; Statement 2: Productivity; Statement 3: Solution Cost; Statement 4: Efficiency"},"domain":1,"correct":["A"],"qk":"business value pillar","ak":{"A":"Statement 2: Transformation"}},{"id":7,"question":"You are selecting a model for a new production workload and must complete the upstream steps before testing candidate models. Which two steps must be completed BEFORE running a representative sample on a candidate model? (Select two.) Each correct answer presents part of the solution.","options":{"A":"Select the lightest model that consistently meets the quality bar across the sample.","B":"Choose a candidate model based on the requirements profile and known capabilities.","C":"Define the quality bar, latency tolerance, and expected volume for the workload.","D":"Sign off the production rollout plan with the platform and security teams.","E":"Retest the model choice when a new model version becomes available."},"domain":2,"correct":["B","C"],"qk":"BEFORE running a representative sample","ak":{"B":"Choose a candidate model","C":"Define the quality bar"}},{"id":8,"question":"A research summarization assistant has been deployed for six months. A user has flagged that a generated summary contained a fabricated citation. The product team has asked whether the incident requires architectural action or whether it is an isolated case. Which two Diligence-competency actions should you take? (Select two.) Each correct answer presents part of the solution.","options":{"A":"Lower the model's sampling temperature across the pipeline in response to the incident.","B":"Sample recent summaries to estimate the fabrication frequency across the population.","C":"Review whether citation grounding controls exist anywhere in the current generation pipeline.","D":"Communicate to users that the assistant does not fabricate output as a matter of design.","E":"Disable the assistant immediately for all current users without any prior diagnostic analysis."},"domain":4,"correct":["B","C"],"qk":"fabricated citation","ak":{"B":"Sample recent summaries","C":"citation grounding controls"}},{"id":9,"question":"A customer support team has proposed delegating customer refund decisions to a Claude-driven workflow with no human review for less expensive refunds. The team's reasoning is that small refunds are low-risk and human review would erase the efficiency gain. Which Delegation-competency principle should guide your response?","options":{"A":"A delegation scope should include human review on every decision the workflow produces, regardless of transaction size.","B":"A delegation scope should be set primarily by maximizing efficiency gains across the workflow.","C":"Delegation should be avoided in most cases wherever financial transactions occur in the workflow.","D":"Delegation should generally include human review on decisions the workflow produces, independent of how small the transaction is."},"domain":5,"correct":["A"],"qk":"no human review for less expensive refunds","ak":{"A":"human review on every decision"}},{"id":10,"question":"A document analysis service processes legal filings averaging 80,000 tokens each. Each filing is queried by attorneys an average of 14 times during the life of a case. The current architecture sends the full filing on every query. The CFO has asked you to reduce per-query costs while preserving response quality. The security officer requires that filing contents not be stored outside the organization's tenancy. Which optimization approach should you recommend?","options":{"A":"Move the workload to a smaller Claude model to reduce the per-token cost paid.","B":"Cache the filing as the prompt prefix for reuse across the 14 queries per case.","C":"Summarize each filing once at intake and run all subsequent queries against the summary.","D":"Index filings in a vector store and retrieve only the relevant passages per query."},"domain":2,"correct":["B"],"qk":"14 times","ak":{"B":"Cache the filing as the prompt prefix"}},{"id":11,"question":"You are running a discovery session with a business sponsor who asks for \"an AI system to fix our customer escalations.\" Which approach best yields actionable requirements?","options":{"A":"Defer the discovery session on the grounds that the sponsor must fully specify the system before the architect can ask clarifying or scoping questions.","B":"Accept the sponsor's original phrasing as a complete and final requirement and proceed directly to design.","C":"Assume the requirement matches the architect's previous engagement in a different industry and proceed with that context.","D":"Decompose the request by asking targeted questions about who escalates, what triggers escalation, what good resolution looks like, and which constraints (latency, cost, audit, data sensitivity) apply."},"domain":6,"correct":["D"],"qk":"fix our customer escalations","ak":{"D":"Decompose the request"}},{"id":12,"question":"You are selecting a protocol for a single low-latency stateless tool call from a Claude-based assistant to an internal pricing service that already exposes a stable HTTP API. Which integration mechanism is the most appropriate?","options":{"A":"a direct API call to the existing endpoint with the appropriate scoped credentials","B":"a bespoke streaming protocol layered over an unrelated asynchronous message bus","C":"an agent-to-agent handoff that introduces another Claude-based agent in front of the pricing service","D":"a long-lived stateful session protocol maintained between the assistant and the pricing service"},"domain":3,"correct":["A"],"qk":"stable HTTP API","ak":{"A":"direct API call"}},{"id":13,"question":"An engineering organization is adopting Claude Code across 200 developers. A team lead has proposed that AI-generated pull requests bypass the standard code review process for changes under 50 lines, on the grounds that small changes are low-risk and review capacity is constrained. Which two Diligence-competency objections should you raise? (Select two.) Each correct answer presents part of the solution.","options":{"A":"AI-generated pull requests should be rejected as a default policy across the engineering organization.","B":"Code review capacity should be expanded to handle every code change submitted across the team.","C":"Line count is a poor proxy for the actual risk a code change introduces into the system.","D":"The 50-line threshold should be raised to 200 lines instead to capture more changes overall.","E":"Removing review removes the verification mechanism that AI-generated output requires across the workflow."},"domain":7,"correct":["C","E"],"qk":"under 50 lines","ak":{"C":"Line count is a poor proxy","E":"Removing review removes the verification mechanism"}},{"id":14,"question":"You are operating an interactive assistant whose dominant performance constraint is per-turn latency. Quality on routine turns is already acceptable. Which configuration adjustment most directly improves latency without disproportionately damaging quality?","options":{"A":"Precompute and cache retrieval embeddings offline, keeping retrieval depth and model tier unchanged.","B":"Cache the full corpus in memory ahead of each request.","C":"Switch to a smaller model for every turn in place of prompt caching.","D":"Reduce retrieval depth to the top-k passages that historically cover the answer, and cache stable system-prompt content."},"domain":3,"correct":["D"],"qk":"per-turn latency","ak":{"D":"Reduce retrieval depth to the top-k"}},{"id":15,"question":"You are supporting a team whose Claude Code sessions consistently load 60 or more MCP tools from many servers, exhausting context budget before the session begins. Which adjustment most directly addresses this issue without removing capability?","options":{"A":"Split the workflow across more sessions, each connecting to a smaller subset of servers, so no single session loads every tool definition.","B":"Automate the review of the server list before each session and disable servers the engineer thinks are unneeded for that day's task.","C":"Raise the session's context window to a larger model tier so all tool definitions fit within the available budget.","D":"Enable Tool Search so tool definitions are deferred and discovered on demand rather than loaded into context upfront."},"domain":7,"correct":["D"],"qk":"60 or more MCP tools","ak":{"D":"Enable Tool Search"}},{"id":16,"question":"You are distinguishing functional from non-functional requirements during discovery. Which item is a non-functional requirement?","options":{"A":"The system must respond at p95 latency under 800 milliseconds at the expected request volume.","B":"The system must produce a draft response that a human reviewer can edit before sending.","C":"The system must extract a defined set of specific fields from invoice attachments and populate a downstream data record.","D":"The system must classify inbound tickets into a defined set of categories and route each to the owning team."},"domain":6,"correct":["A"],"qk":"non-functional requirement","ak":{"A":"p95 latency under 800 milliseconds"}},{"id":17,"question":"You are evaluating model-selection claims used by a peer team. For each statement, select yes if the statement is generally true. Otherwise, select no. Select every statement whose answer is \"Yes\".","options":{"A":"Heavier-reasoning models typically consume more of the rate limit and run more slowly than lighter models on the same input.","B":"A representative-sample evaluation on the target workload is the right basis for confirming a model selection.","C":"The most capable model is always the right choice regardless of the workload profile.","D":"Tiered routing can serve routine traffic with a lighter model while reserving a heavier model for traffic that needs its capability.","E":"Selecting a model based on which version was most recently announced is the right basis for production decisions."},"domain":2,"correct":["A","B","D"],"qk":"model-selection claims","ak":{"A":"Heavier-reasoning models","B":"representative-sample evaluation","D":"Tiered routing"}},{"id":18,"question":"You are evaluating retrieval-strategy claims used by a peer team. For each claim, select yes if the statement is generally accurate. Otherwise, select no. Select every statement whose answer is \"Yes\".","options":{"A":"Dense vector retrieval is well suited to recovering paraphrased intent against unstructured text.","B":"Sparse term-matching retrieval recovers exact terms (such as identifiers and rare tokens) more reliably than dense alone.","C":"Structured query retrieval is the right fit for filter-and-aggregate workloads against a relational store with schema and indexes.","D":"Hybrid retrieval is identical to dense-only retrieval and shares the same recall characteristics.","E":"Random sampling of a data store is a sound retrieval strategy for production Q&A."},"domain":3,"correct":["A","B","C"],"qk":"retrieval-strategy claims","ak":{"A":"Dense vector","B":"Sparse term-matching","C":"Structured query"}},{"id":19,"question":"A loan pre-qualification assistant shows 94 percent approval recommendations that match the human underwriter decision. The fairness team reviewed approval rate parity across protected groups and reported no significant difference. A board member has asked whether this evidence is sufficient to declare the assistant fair. Which two Discernment-competency findings should you report? (Select two.) Each correct answer presents part of the solution.","options":{"A":"Match with human underwriters does not establish freedom from underwriter-introduced bias.","B":"A larger sample is needed before any meaningful fairness claim can be made about the model.","C":"Approval rate parity does not by itself assess error rate parity across protected groups.","D":"The fairness team's review process likely missed at least some of the protected groups studied.","E":"The 94 percent match rate is sufficient evidence of fairness for the assistant's decisions."},"domain":5,"correct":["A","C"],"qk":"94 percent","ak":{"A":"freedom from underwriter-introduced bias","C":"error rate parity"}},{"id":20,"question":"You are designing a retrieval-augmented generation (RAG) pipeline over long technical policy manuals in which answers frequently depend on a section heading and the clauses beneath it. Users report that retrieved passages are often fragments that omit the governing section context. Which chunking strategy most directly addresses this issue?","options":{"A":"Split documents into fixed 256-token chunks with no overlap to maximize the number of indexed passages.","B":"Chunk along the document's structural boundaries (sections and clauses) and prepend the section heading path to each chunk before embedding.","C":"Embed each entire manual as a single vector so that no section context is ever lost at retrieval time.","D":"Increase top-k retrieval from 5 to 50 so that neighboring fragments are more likely to be returned together."},"domain":3,"correct":["B"],"qk":"section heading","ak":{"B":"prepend the section heading path"}},{"id":21,"question":"A company is building a research workflow in which a lead agent breaks a market-analysis request into independent sub-questions, assigns them to specialized subagents, and synthesizes the results. Early tests show subagents duplicating each other's work and the lead agent's context filling up with raw search output. Which two design changes should you recommend? (Select two.) Each correct answer presents part of the solution.","options":{"A":"Have the lead agent give each subagent an explicit objective, output format, and boundary of what is out of scope for its sub-question.","B":"Have subagents return condensed findings to the lead agent rather than passing their full raw tool output into its context.","C":"Replace the subagents with a single agent that runs every sub-question sequentially in one shared context.","D":"Allow every subagent to spawn further subagents without limit so that coverage of each sub-question increases.","E":"Give every subagent the full tool set and the complete conversation history of the lead agent by default."},"domain":1,"correct":["A","B"],"qk":"duplicating each other's work","ak":{"A":"explicit objective, output format, and boundary","B":"return condensed findings"}},{"id":22,"question":"A European retailer plans to use Claude to analyze customer support transcripts that contain the names, email addresses, and order histories of EU residents. The data protection officer asks what must be in place before processing begins. Which approach best aligns with GDPR obligations?","options":{"A":"Proceed with processing because the transcripts were collected through the retailer's own support channel.","B":"Establish a lawful basis and documented purpose, minimize and pseudonymize personal data before it reaches the model, and confirm the data processing agreement and retention settings with the provider.","C":"Remove only the email addresses and send the remaining transcript content unchanged to the model.","D":"Instruct the model in the system prompt not to remember any personal data contained in the transcripts."},"domain":5,"correct":["B"],"qk":"GDPR","ak":{"B":"lawful basis and documented purpose"}},{"id":23,"question":"A contract-analysis assistant sends a 120,000-token agreement and a short user question on each request. The current prompt places the question first, followed by the full agreement as unstructured text, and answers about clauses deep in the document are frequently incomplete. Which prompt-structure change is most appropriate as the first adjustment?","options":{"A":"Place the agreement at the top of the prompt wrapped in descriptive XML tags, put the question at the end, and ask the model to quote the relevant clauses before answering.","B":"Repeat the user question three times throughout the prompt so that it stays close to every part of the agreement.","C":"Split the agreement into separate requests per page and concatenate the individual answers without a synthesis step.","D":"Move the agreement into the system prompt as plain text and raise the sampling temperature to encourage broader coverage."},"domain":2,"correct":["A"],"qk":"120,000-token agreement","ak":{"A":"agreement at the top"}},{"id":24,"question":"You are building an ethics review checklist for deployments supported by artificial intelligence (AI). Which two checks belong on the list? (Select two.) Each correct answer presents a complete solution.","options":{"A":"Restrict the ethics review to outputs that exceed a defined model-confidence threshold.","B":"Confirm that vendor licensing terms permit the planned production use of the model.","C":"Verify that outputs do not rely on generalizations about people that the underlying data does not support.","D":"Confirm that high-impact decisions retain human accountability rather than being attributed to the model.","E":"Confirm that latency and throughput remain consistent across regions and user populations."},"domain":5,"correct":["C","D"],"qk":"ethics review checklist","ak":{"C":"generalizations about people","D":"high-impact decisions retain human accountability"}},{"id":25,"question":"You are reviewing a customer-support agent's configuration. Each candidate tool falls into one of four categories: (1) frequently used and reduces hand-offs, (2) occasionally used to complete a defined task, (3) speculative future utility, (4) never used for any of the agent's defined tasks. Which categories should typically remain in the agent configuration?","options":{"A":"Category 1 only, because least privilege means the minimal set that completes defined tasks.","B":"All 4 categories, because broader tool access tends to help agent performance, whether or not a tool maps to a defined task.","C":"Categories 1 and 2 only, because they map to defined tasks and the agent's regular hand-offs.","D":"Categories 1, 2, and 3, because retaining occasionally useful tools avoids reconfiguring the agent when new requests arrive."},"domain":3,"correct":["C"],"qk":"speculative future utility","ak":{"C":"Categories 1 and 2 only"}},{"id":26,"question":"A revenue projection assistant has missed its monthly cost target by 38 percent. Profiling shows three contributors: a 6,000-token policy preamble repeated on every call (45 percent of cost), retrieval of historical sales chunks averaging 3,000 tokens per call (30 percent), and inference on a flagship tier model (25 percent). Stakeholders require that projection accuracy remain unchanged. Which two optimizations should you sequence first to reduce cost without affecting accuracy? (Select two.)","options":{"A":"Truncate the policy preamble to remove non-essential clauses from the prompt.","B":"Cache common retrieved sales chunks accessed across many of the daily queries.","C":"Reduce the number of historical sales chunks retrieved across each query run.","D":"Enable prompt caching on the static policy preamble across the recurring calls.","E":"Switch the workload to a smaller, faster Claude model tier across all queries."},"domain":4,"correct":["B","D"],"qk":"6,000-token policy preamble repeated","ak":{"B":"Cache common retrieved sales chunks","D":"prompt caching on the static policy preamble"}},{"id":27,"question":"You are designing the prompt for a ticket-triage classifier with thirty well-defined categories and clear category descriptions in the prompt. Which technique is most appropriate as the starting point?","options":{"A":"a zero-shot prompt that specifies the categories with their descriptions and the required output format","B":"a chain-of-thought prompt for a routing decision that does not require multi-step reasoning","C":"a prompt with no category descriptions, expecting the model to infer the category set","D":"a prompt-chaining setup that routes each ticket through a coarse grouping step before selecting the final category"},"domain":2,"correct":["A"],"qk":"thirty well-defined categories","ak":{"A":"zero-shot prompt"}},{"id":28,"question":"A Claude architect observes that after a recent model-version upgrade, grounded responses began including claims not supported by the retrieved source documents. Which mitigation is most directly targeted at this failure mode?","options":{"A":"scoring each new model version against a stable adversarial evaluation set before promoting it to production","B":"treating retrieved passages as untrusted input and screening them with classifiers before they enter the prompt context","C":"tightening the retrieval configuration so fewer, higher-relevance passages are returned for each incoming user query","D":"constraining responses to source-supported content combined with required citations and a verification step"},"domain":4,"correct":["D"],"qk":"claims not supported by the retrieved source documents","ak":{"D":"constraining responses to source-supported content"}},{"id":29,"question":"A managed agent deployment for claims triage has grown from 6 tools to 34 tools over 18 months as product teams added capabilities. Triage accuracy has declined from 91 percent to 78 percent, and average tool selection latency has increased by 2.3 seconds. A junior engineer has proposed adding a tool router agent in front of the current agent to filter the tool list per request. Which two findings should you present to justify capability decomposition before adding the router? (Select two.)","options":{"A":"Tool descriptions overlap across multiple claim categories within the agent's tool set.","B":"The 34 tools serve four distinct claim workflow domains within the triage scope.","C":"The proposed router introduces an additional model call on every incoming request.","D":"Several tools have not been invoked across the most recent 90 days of traffic.","E":"The router pattern is well-documented across publicly available agent literature."},"domain":1,"correct":["A","B"],"qk":"capability decomposition","ak":{"A":"Tool descriptions overlap","B":"four distinct claim workflow domains"}},{"id":30,"question":"You are building an evaluation pipeline for a Claude-based deployment and must complete the specification steps before running the deployment against the dataset. Which two steps must be completed BEFORE running the deployment against the evaluation dataset? (Select two.) Each correct answer presents part of the solution.","options":{"A":"Review failure cases with subject matter experts to refine the scoring rubric.","B":"Define the metrics and slices the framework will report across representative, edge, and adversarial cases.","C":"Score the deployment outputs against the reference labels and aggregate the metrics.","D":"Curate and label the evaluation dataset to match the defined slices.","E":"Publish the aggregated metrics to a dashboard and gate releases on threshold checks."},"domain":4,"correct":["B","D"],"qk":"BEFORE running the deployment against the evaluation dataset","ak":{"B":"Define the metrics and slices","D":"Curate and label the evaluation dataset"}},{"id":31,"question":"You are designing a test strategy for a Claude-based pipeline that handles sensitive financial data. Which two test types should be prioritized to cover both safety-under-attack and cross-component correctness? (Select two.)","options":{"A":"regression tests against a stable reference set of previously known good outputs","B":"adversarial tests using prompt-injection and malformed-input cases","C":"integration tests that verify end-to-end pipeline behavior across all components","D":"unit tests targeting individual prompt-template rendering logic only","E":"smoke tests to verify core paths after each deployment"},"domain":4,"correct":["B","C"],"qk":"safety-under-attack","ak":{"B":"adversarial tests","C":"integration tests"}},{"id":32,"question":"You are compiling continuity practices that span the deployment lifecycle. Which two practices belong on the list? (Select two.) Each correct answer presents a complete solution.","options":{"A":"Maintain a stakeholder register and notify the listed parties at every phase transition event.","B":"Carry the evaluation framework and reference set forward across iterations rather than rebuilding each time.","C":"Capture lessons learned at the end of each phase and surface them as inputs to the next phase.","D":"Archive every phase deliverable in long-term storage to preserve a record of what was produced.","E":"Lock decisions made in early phases to prevent revisiting them as later phases begin."},"domain":6,"correct":["B","C"],"qk":"continuity practices","ak":{"B":"Carry the evaluation framework and reference set forward","C":"Capture lessons learned"}},{"id":33,"question":"You are sequencing decomposed components in an invoice-processing pipeline. For each of the decomposed components, select the execution layer it belongs to: 'Pre-Processing', 'Model Stage', or 'Post-Processing'. Which option assigns every item correctly?","options":{"A":"Claude-based classification of invoice type → Post-Processing; persistence of validated records to the system of record → Model Stage; schema validation of the extracted fields → Post-Processing; Claude-based extraction of structured invoice fields → Model Stage; PII redaction on extracted text prior to model invocation → Pre-Processing; optical character recognition on scanned invoice images → Pre-Processing","B":"Claude-based classification of invoice type → Model Stage; persistence of validated records to the system of record → Post-Processing; schema validation of the extracted fields → Post-Processing; Claude-based extraction of structured invoice fields → Model Stage; PII redaction on extracted text prior to model invocation → Pre-Processing; optical character recognition on scanned invoice images → Pre-Processing","C":"Claude-based classification of invoice type → Model Stage; persistence of validated records to the system of record → Pre-Processing; schema validation of the extracted fields → Post-Processing; Claude-based extraction of structured invoice fields → Model Stage; PII redaction on extracted text prior to model invocation → Pre-Processing; optical character recognition on scanned invoice images → Post-Processing","D":"Claude-based classification of invoice type → Model Stage; persistence of validated records to the system of record → Post-Processing; schema validation of the extracted fields → Post-Processing; Claude-based extraction of structured invoice fields → Pre-Processing; PII redaction on extracted text prior to model invocation → Pre-Processing; optical character recognition on scanned invoice images → Model Stage"},"domain":1,"correct":["B"],"qk":"Invoice-processing pipeline","ak":{"B":"PII redaction on extracted text prior to model invocation → Pre-Processing"},"tip":"Claude-based = Model Stage · OCR, PII redaction = Pre-Processing · schema validation, persistence = Post-Processing"},{"id":34,"question":"You are reviewing a peer's end-to-end design for a Claude-based platform expected to scale to thousands of concurrent users. For each statement, indicate yes if the statement reflects a sound architectural practice. Otherwise, select no. Select every statement whose answer is \"Yes\".","options":{"A":"Authentication and authorization run before retrieval so retrieval can filter by identity.","B":"An asynchronous queue absorbs bursty traffic between intake and the model invocation layer.","C":"Tax computation is encoded directly in the system prompt rather than in code.","D":"Conversation logs include unredacted government identifiers to maximize signal for tuning."},"domain":1,"correct":["A","B"],"qk":"thousands of concurrent users","ak":{"A":"Authentication and authorization run before retrieval","B":"asynchronous queue absorbs bursty traffic"}},{"id":35,"question":"You are designing a content moderation classifier that processes high volumes of user-generated comments under a tight per-message latency budget using well-defined classification labels. Which model selection best aligns with the workload?","options":{"A":"Fable","B":"Sonnet","C":"Haiku","D":"Opus"},"domain":2,"correct":["C"],"qk":"tight per-message latency budget","ak":{"C":"Haiku"}},{"id":36,"question":"A pilot AI assistant for procurement specialists shows 89 percent first-response acceptance, but follow-up surveys reveal that specialists frequently override the assistant's vendor recommendations after consulting unrelated criteria the assistant did not consider. The pilot owner wants to ship the assistant as is, given the strong acceptance rate. Which two discernment-competency observations should you raise BEFORE approving the launch? (Select two.) Each correct answer presents part of the solution.","options":{"A":"The pilot duration was likely too short to establish reliability across the full year.","B":"The unconsidered criteria represent a scope gap in the assistant's input space directly.","C":"The survey response rate may not be statistically representative of all the specialists.","D":"Acceptance does not measure whether recommendations are right after specialist review.","E":"The acceptance rate, combined with the pilot's sample size, is enough evidence to proceed without further review."},"domain":6,"correct":["B","D"],"qk":"89 percent first-response acceptance","ak":{"B":"scope gap","D":"Acceptance does not measure whether recommendations are right"}},{"id":37,"question":"You are comparing two configurations for an internal compliance Q&A assistant. Configuration X reduces top-k retrieval and serves with a lighter model, lowering p95 latency by 38 percent at a measured 2 percent drop on the accuracy benchmark. Configuration Y keeps top-k and the heavier model, with p95 latency unchanged and no measurable accuracy change. The deployment's stated priorities are accuracy first and latency second. Which configuration is the better recommendation?","options":{"A":"Configuration X, because lower latency generally matters more than accuracy, independent of this deployment's stated priorities.","B":"Configuration X, because a 38 percent latency improvement outweighs a 2 percent accuracy reduction as a general rule across compliance deployments.","C":"Configuration Y, because the deployment's stated priority is accuracy first, and Configuration X reduces measured accuracy.","D":"Configuration X, because the 2 percent accuracy reduction falls within normal benchmark variance and is not a meaningful regression here."},"domain":3,"correct":["C"],"qk":"accuracy first","ak":{"C":"Configuration Y"}},{"id":38,"question":"You are reviewing a peer's Claude Code permission rules for an enterprise rollout. The rules grant unrestricted Bash access to all projects across all developers. Which response is most appropriate?","options":{"A":"Allow-list Bash to the specific commands the workflows require, relying on the allow-list's implicit default-deny.","B":"Replace unrestricted Bash with narrowly-scoped tool patterns that allow only the specific commands the workflows require, and add explicit deny rules for sensitive operations.","C":"Replace unrestricted Bash access with narrowly-scoped tool patterns, but apply the same scoped patterns identically across every project regardless of each project's actual workflow needs.","D":"Approve the rules as written, treating Bash scoping as a matter for each project team to tighten later."},"domain":7,"correct":["B"],"qk":"unrestricted Bash access","ak":{"B":"narrowly-scoped tool patterns"}},{"id":39,"question":"You are reviewing an integration specification for security gaps. Which two findings constitute valid security gaps in the specification? (Select two.) Each correct answer presents a complete solution.","options":{"A":"Tool inputs and outputs are encrypted in transit using transport layer security between services.","B":"Service credentials are placed in the prompt context where they can leak into logs and traces.","C":"Tool calls execute server-side under a least-privilege service principal scoped to the requested action.","D":"Role-based access control (RBAC) is enforced only at the response-rendering layer after the model accesses restricted data.","E":"Per-user OAuth tokens are exchanged with scope-restricted permissions and refreshed within the active session."},"domain":3,"correct":["B","D"],"qk":"security gaps","ak":{"B":"Service credentials are placed in the prompt context","D":"enforced only at the response-rendering layer"}},{"id":40,"question":"A Claude architect is leading the discovery phase for a new AI-powered customer service solution. Which two activities are characteristic of structured discovery and requirement gathering for a Claude-based deployment? (Select two.) Each correct answer presents a complete solution.","options":{"A":"facilitating stakeholder workshops to surface latency, accuracy, and compliance constraints before scoping begins","B":"deferring constraint documentation until the integration design phase to avoid scope creep","C":"generating an initial prototype and iterating based on user reaction","D":"documenting explicit success criteria and failure thresholds that will gate production deployment","E":"selecting the Claude model tier based on the architect's prior project experience before stakeholder input is collected"},"domain":6,"correct":["A","D"],"qk":"structured discovery and requirement gathering","ak":{"A":"stakeholder workshops","D":"success criteria and failure thresholds"}},{"id":41,"question":"You are a solution architect evaluating candidate use cases for a Claude-based program. For each scenario, select yes if Claude is appropriate as the primary solution at the architectural level. Otherwise, select no. Select every statement whose answer is \"Yes\".","options":{"A":"drafting first-pass investigative reports from semi-structured incident logs for analyst review","B":"computing real-time fraud scores at sub-50-millisecond latency on a streaming pipeline","C":"long-context contract review with structured clause extraction and deviation flagging","D":"replacing a vector index for semantic retrieval over a multi-million-document corpus","E":"routing inbound support tickets into 30 categories with reasoning for the chosen routing"},"domain":1,"correct":["A","C","E"],"qk":"Claude is appropriate as the primary solution","ak":{"A":"drafting first-pass investigative reports","C":"long-context contract review","E":"routing inbound support tickets"}},{"id":42,"question":"You are compiling guardrail tactics for a customer-facing assistant. Which two tactics belong on the guardrail list? Each correct answer presents a complete solution. (Select two.)","options":{"A":"Embed approved override phrases that let trusted users relax guardrails on demand.","B":"Validate the model output against a structured schema before downstream actions are taken.","C":"Lower sampling temperature globally to reduce the chance of off-policy completions.","D":"Layer prompt-level guardrails with runtime content checks rather than relying on either alone.","E":"Rely on a single hardened system prompt that enumerates every disallowed behavior."},"domain":5,"correct":["B","D"],"qk":"guardrail tactics","ak":{"B":"Validate the model output against a structured schema","D":"Layer prompt-level guardrails with runtime content checks"}},{"id":43,"question":"You are evaluating an evaluation set used to score a Claude-based hiring-support tool. The set is drawn from one geographic region and one tenure band, while the tool will serve candidates across many regions and tenure bands. Which response is most appropriate?","options":{"A":"Continue using the narrow evaluation set drawn from one region and one tenure band because the existing benchmark scores are already high on that subset.","B":"Expand the evaluation set to cover the geographic regions and tenure bands the tool will serve, and rescore the system on the expanded set before broader release.","C":"Replace quantitative evaluation with qualitative impressions from a small pilot group.","D":"Narrow the evaluation set to a single demographic subgroup to simplify score interpretation."},"domain":4,"correct":["B"],"qk":"one geographic region and one tenure band","ak":{"B":"Expand the evaluation set"}},{"id":44,"question":"You are compiling factors that should drive the choice between Model Context Protocol (MCP), direct API integration, and agent-to-agent handoff. Which two factors belong on the list? (Select two.) Each correct answer presents a complete solution.","options":{"A":"whether the integration must be portable across multiple AI clients in the ecosystem","B":"whether the interaction is stateless and latency-sensitive or stateful and longer-running","C":"whether the underlying transport supports encryption in transit between the integrated services","D":"whether the organization has a documented naming convention for internal API endpoints","E":"whether the team has prior implementation experience with any of the candidate protocols"},"domain":3,"correct":["A","B"],"qk":"agent-to-agent handoff","ak":{"A":"portable across multiple AI clients","B":"stateless and latency-sensitive or stateful"}},{"id":45,"question":"A platform team operates a self-hosted multi-agent system on Kubernetes that orchestrates seven specialized agents for invoice processing over an internal message bus. Leadership is evaluating a migration to managed agents, and the security team requires that invoice data never leave the organization's network boundary. Which factor should most heavily influence your recommendation?","options":{"A":"whether managed agents reduce per-invoice token costs across the existing processing volume","B":"whether managed agents support the current bus topology used by the platform team","C":"whether the current seven agents map cleanly to the patterns supported by managed agents","D":"whether managed agent data handling satisfies the network boundary required by security"},"domain":3,"correct":["D"],"qk":"network boundary","ak":{"D":"managed agent data handling satisfies the network boundary"}},{"id":46,"question":"You are auditing a procurement-assistant agent whose defined responsibility is to draft purchase requests for review. For each tool currently configured on the agent, select yes if the tool should remain after a least-privilege audit. Otherwise, select no if it should be removed. Select every statement whose answer is \"Yes\".","options":{"A":"a read-only catalog lookup tool that returns vendor and SKU information","B":"an inbox-send tool that emails purchase requests to vendors directly","C":"a draft-write tool that creates purchase-request drafts in the review queue","D":"a production-database admin tool unrelated to procurement","E":"a read-only policy-document tool that returns the relevant procurement policies"},"domain":3,"correct":["A","C","E"],"qk":"Least-privilege audit","ak":{"A":"read-only catalog lookup","C":"draft-write tool","E":"read-only policy-document"}},{"id":47,"question":"You are a solution architect designing a Claude-based assistant with access to 60 internal tools across multiple business domains. Loading every tool definition on every request increases token usage and time to first response. Which design pattern best addresses this issue without sacrificing capability breadth?","options":{"A":"Use a separate model call to condense all 60 tool definitions into a compact index that is prepended to each user turn for tool selection.","B":"Increase the maximum context length so all 60 tool definitions fit within a single request without exceeding the limit.","C":"Apply progressive tool discovery so a curated initial subset is exposed and additional tools are loaded on demand based on the task.","D":"Group the 60 tools into five fixed categories and load one category per request based on a static mapping of task type to category."},"domain":3,"correct":["C"],"qk":"60 internal tools","ak":{"C":"progressive tool discovery"}},{"id":48,"question":"You are classifying token-management tactics by where in the request lifecycle each tactic applies: 'Input Preparation', 'Prompt Construction', or 'Output Handling'. Which option assigns every item correctly?","options":{"A":"Persist the validated output for downstream consumption and audit. → Output Handling; Order the prompt sections so cacheable content sits before per-request content. → Prompt Construction; Summarize prior conversation history when full history is no longer needed. → Input Preparation; Validate the model's structured output against the expected schema. → Output Handling; Move stable repeated content into a cacheable prefix at the head of the prompt. → Prompt Construction; Trim retrieved passages to spans relevant to the user's question. → Input Preparation","B":"Persist the validated output for downstream consumption and audit. → Prompt Construction; Order the prompt sections so cacheable content sits before per-request content. → Output Handling; Summarize prior conversation history when full history is no longer needed. → Input Preparation; Validate the model's structured output against the expected schema. → Output Handling; Move stable repeated content into a cacheable prefix at the head of the prompt. → Prompt Construction; Trim retrieved passages to spans relevant to the user's question. → Input Preparation","C":"Persist the validated output for downstream consumption and audit. → Output Handling; Order the prompt sections so cacheable content sits before per-request content. → Input Preparation; Summarize prior conversation history when full history is no longer needed. → Input Preparation; Validate the model's structured output against the expected schema. → Output Handling; Move stable repeated content into a cacheable prefix at the head of the prompt. → Prompt Construction; Trim retrieved passages to spans relevant to the user's question. → Prompt Construction","D":"Persist the validated output for downstream consumption and audit. → Output Handling; Order the prompt sections so cacheable content sits before per-request content. → Prompt Construction; Summarize prior conversation history when full history is no longer needed. → Input Preparation; Validate the model's structured output against the expected schema. → Output Handling; Move stable repeated content into a cacheable prefix at the head of the prompt. → Input Preparation; Trim retrieved passages to spans relevant to the user's question. → Prompt Construction"},"domain":2,"correct":["A"],"qk":"Input Preparation","ak":{"A":"Persist the validated output for downstream consumption and audit. → Output Handling"},"tip":"Persist, Validate = Output Handling · Order sections, cacheable prefix = Prompt Construction · Summarize history, Trim passages = Input Preparation"},{"id":49,"question":"You are presenting an architectural decision to a mixed audience that includes an executive sponsor and the engineering leads who will implement the decision. Which presentation strategy best serves both audiences?","options":{"A":"Open with a deep technical dive into implementation details for the engineering leads.","B":"Announce the chosen decision and move directly to implementation planning.","C":"Lead with the decision, the business outcomes it serves, and the trade-offs accepted; follow with the technical rationale, alternatives, and implementation implications for the engineering audience.","D":"Present a single undifferentiated narrative that addresses technical and business concerns with equal weight throughout, treating both audiences as requiring the same depth on every section."},"domain":6,"correct":["C"],"qk":"mixed audience","ak":{"C":"Lead with the decision"}},{"id":50,"question":"A Claude-based research assistant begins producing responses that confidently contradict its retrieved source documents despite no change to the retrieval pipeline. Which two diagnostic actions most directly identify the root cause of this behavior? (Select two.)","options":{"A":"Switch the retrieval index to a denser embedding model to improve chunk relevance scores.","B":"Isolate whether the failure reproduces on the previous model version to test for model mismatch.","C":"Increase the context window size to allow more retrieved chunks per query.","D":"Inspect system-prompt grounding instructions to determine whether citation constraints remain intact.","E":"Reduce the temperature setting to lower response variance across all query types."},"domain":4,"correct":["B","D"],"qk":"confidently contradict its retrieved source documents","ak":{"B":"previous model version","D":"system-prompt grounding instructions"}},{"id":51,"question":"You are selecting the documentation set that should accompany a Claude-based deployment at handoff. Which set is most complete?","options":{"A":"a project retrospective document, a lessons-learned summary, and a list of contributors","B":"architecture overview, ADRs, component-level diagrams, runbooks for common operations, on-call playbook, and a list of known limitations","C":"the original design proposal, its review comments, meeting notes from design sessions, and the approved requirements document","D":"user-facing release notes, a marketing one-pager describing the deployment, and a customer FAQ"},"domain":6,"correct":["B"],"qk":"at handoff","ak":{"B":"known limitations"}},{"id":52,"question":"You are responding to a stakeholder request that adds significant scope to a deployment already in flight. Which response best aligns expectations while respecting the stakeholder's underlying need?","options":{"A":"Acknowledge the request, name the scope and timeline implications transparently, and propose options for the stakeholder to choose.","B":"Acknowledge the request, explain that the current release is locked, and offer to revisit it once the deployment has shipped.","C":"Acknowledge the request, add it to the backlog with a note on its origin, and confirm that it will be considered in the next planning cycle.","D":"Accept the additional scope into the current release, extend the timeline to absorb it, and notify the affected teams of the new date."},"domain":6,"correct":["A"],"qk":"adds significant scope","ak":{"A":"propose options"}},{"id":53,"question":"You are identifying the highest-impact optimization for a deployment whose token cost is dominated by a long, repeated system prompt and a large retrieved context per request. Which optimization most directly targets the dominant cost driver?","options":{"A":"Batch requests so that several queries share a single call and the system prompt is transmitted once for the whole group.","B":"Route simpler requests to a smaller model and reserve the larger model for cases that a lightweight classifier flags as complex.","C":"Compress the system prompt by rewriting its instructions more concisely and removing examples that overlap with one another.","D":"Move the long, repeated system prompt into a cacheable prefix and trim retrieved context to the spans relevant to each query."},"domain":4,"correct":["D"],"qk":"long, repeated system prompt","ak":{"D":"cacheable prefix"}},{"id":54,"question":"You are defining where human review must remain in a planned automated pipeline. Which placement reflects sound human-in-the-loop design?","options":{"A":"Place a human reviewer between each incoming request and the model so inputs are checked before generation.","B":"Place a human reviewer between the model's output and every action, regardless of impact or reversibility.","C":"Place a human reviewer between the model's output and any action a confidence score marks as uncertain.","D":"Place a human reviewer between the model's output and any high-impact, irreversible action."},"domain":5,"correct":["D"],"qk":"human-in-the-loop","ak":{"D":"high-impact, irreversible action"}},{"id":55,"question":"You are preparing a HIPAA-eligible deployment for a healthcare customer. Which configuration supports HIPAA compliance using Anthropic-offered tools?","options":{"A":"Claude Team with a signed Business Associate Agreement but Zero Data Retention left disabled and audit logging not yet configured for the deployment.","B":"Claude Pro with no signed Business Associate Agreement, since a paid consumer subscription is assumed to meet HIPAA requirements out of the box.","C":"an ad-hoc personal Claude account used by individual clinicians for PHI-related tasks, with no Business Associate Agreement, no Zero Data Retention, and no audit logging configured","D":"Claude Enterprise with a signed Business Associate Agreement, Zero Data Retention enabled, and audit logging configured for compliance tracking"},"domain":5,"correct":["D"],"qk":"HIPAA","ak":{"D":"Business Associate Agreement"}},{"id":56,"question":"A healthcare organization is evaluating two Claude-powered AI architectures for a clinical documentation assistant. Architecture X produces higher output quality scores but costs $0.18 per documentation session and averages 4.2 seconds per response. Architecture Y scores slightly lower on quality metric but costs $0.09 per session and averages 2.1 seconds per response. The stated SLA requires responses under 3 seconds, and the annual volume is projected at 2 million documentation sessions. Which evaluation approach correctly applies business value pillar analysis to this decision?","options":{"A":"Eliminate Architecture X on SLA grounds, then evaluate Architecture Y against the efficiency and solution cost pillars by calculating annual cost difference and assessing whether the quality delta materially impacts clinical workflow productivity.","B":"Select Architecture Y based solely on the 50% cost reduction, since solution cost is the most important value pillar in healthcare budget-constrained environments.","C":"Recommend a hybrid approach using Architecture X for complex cases and Architecture Y for routine cases, without additional analysis, since this preserves quality where it matters most.","D":"Select Architecture X because the higher quality scores justify the cost premium, and any SLA gap can be addressed through infrastructure optimization after deployment."},"domain":1,"correct":["A"],"qk":"SLA requires responses under 3 seconds","ak":{"A":"Eliminate Architecture X on SLA grounds"}},{"id":57,"question":"You are rolling out monitoring for a Claude-based deployment and must complete the specification steps before instrumenting the deployment to emit metrics and traces. Which two steps must be completed BEFORE instrumenting the deployment? (Select two.) Each correct answer presents part of the solution.","options":{"A":"Document the dashboards, alerts, and runbooks for the on-call rotation that will respond.","B":"Define the metrics and slices the deployment will monitor across normal and adversarial traffic.","C":"Tune the alert thresholds based on observed normal-state distributions to reduce false positives.","D":"Define the service-level objectives (SLOs) and the error budgets the deployment will be held to.","E":"Build the dashboards that surface metrics across slices at the cadence the team operates on."},"domain":4,"correct":["B","D"],"qk":"BEFORE instrumenting the deployment","ak":{"B":"Define the metrics and slices","D":"service-level objectives (SLOs) and the error budgets"}},{"id":58,"question":"A security audit uncovers two issues: (1) all end users share a single API key, and (2) tool calls are executed without logging the initiating user identity. Which two mitigations directly address these specific findings? (Select two.)","options":{"A":"Move credentials out of the prompt context and resolve them from a server-side secret store.","B":"Enforce RBAC at the retrieval layer before content enters the model context.","C":"Replace the shared API key with per-user OAuth tokens carrying scope-restricted permissions.","D":"Add actor attribution to tool-call logs so each call records the initiating user identity.","E":"Validate structured outputs against a schema before downstream actions are executed."},"domain":3,"correct":["C","D"],"qk":"share a single API key","ak":{"C":"per-user OAuth tokens","D":"actor attribution to tool-call logs"}},{"id":59,"question":"The compliance team has authored a regulatory disclosure procedure that must be applied identically across customer service, sales, and onboarding workflows. The procedure changes when regulators issue updates, currently four to six times per year. You are designing how the procedure will be packaged for use by Claude across all three workflows. Which two design decisions should you include? (Select two.) Each correct answer presents part of the solution.","options":{"A":"Package the procedure as a Claude Skill owned by the compliance team directly.","B":"Have each workflow team rewrite the procedure for that team's specific context.","C":"Embed the procedure text into each workflow's system prompt at integration time.","D":"Reference the same Claude Skill from all three of the workflow integrations directly.","E":"Store the procedure in a shared retrieval corpus accessed by all three workflows."},"domain":2,"correct":["A","D"],"qk":"regulatory disclosure procedure","ak":{"A":"Claude Skill owned by the compliance team","D":"Reference the same Claude Skill from all three"}},{"id":60,"question":"You are reviewing a peer's draft system prompt that contains contradictory instructions: one section says to never speculate beyond the supplied source text and another says to confidently fill in any gaps. Which response is most appropriate?","options":{"A":"Add a priority-ordering instruction that tells the model to evaluate all available instructions and apply the most contextually appropriate one on each request.","B":"Resolve the contradiction by removing or rewording the gap-filling instruction so the prompt consistently constrains the model to source-supported content.","C":"Keep both contradictory instructions in place and rely on the model to select which one to follow on each individual request, accepting inconsistent behavior as a result.","D":"Keep both contradictory instructions in place and add a third instruction telling the model to use its best judgment based on the query's context."},"domain":2,"correct":["B"],"qk":"contradictory instructions","ak":{"B":"Resolve the contradiction"}},{"id":61,"question":"A Claude architect is implementing safety controls for a customer-facing advice assistant that must never provide regulated investment recommendations. Which two guardrail implementations most directly enforce this constraint? (Select two.)","options":{"A":"Increase response temperature to introduce variability that reduces the likelihood of specific recommendations.","B":"Log all model responses to a SIEM and route flagged records to a compliance reviewer.","C":"Add an output classifier that detects and blocks responses containing regulated investment-recommendation language.","D":"Define explicit out-of-scope categories in the system prompt with fixed refusal phrasing for investment advice requests.","E":"Limit session length to reduce the volume of queries processed per user per day."},"domain":5,"correct":["C","D"],"qk":"regulated investment recommendations","ak":{"C":"output classifier that detects and blocks","D":"explicit out-of-scope categories"}},{"id":62,"question":"You are reviewing a peer's draft ADR. The ADR states the decision and the technical detail but does not state the alternatives considered or the trade-offs accepted. Which response is most appropriate?","options":{"A":"Approve the ADR as written since the decision is documented, treating the missing alternatives and trade-offs as unnecessary detail.","B":"Ask the author to add the alternatives considered and the trade-offs accepted before publishing the ADR.","C":"Ask the author to link the design-discussion thread in place of a written alternatives section.","D":"Publish the ADR as written and open a follow-up task to add alternatives in a later revision."},"domain":6,"correct":["B"],"qk":"does not state the alternatives considered or the trade-offs accepted","ak":{"B":"add the alternatives considered and the trade-offs accepted"}},{"id":63,"question":"You are running a controlled experiment to compare two prompts and must complete the design steps before executing the experiment with random assignment. Which two steps must be completed BEFORE executing the experiment? (Select two.) Each correct answer presents part of the solution.","options":{"A":"Decide whether to promote, reject, or iterate the candidate based on the analysis.","B":"Determine the minimum detectable effect size and the sample size needed for power.","C":"Define the hypothesis and the primary success metric for the comparison.","D":"Monitor interim metrics daily during the experiment and stop as soon as one prompt appears ahead.","E":"Document the recommendation, the trade-offs accepted, and the alternatives considered."},"domain":4,"correct":["B","C"],"qk":"Controlled experiment","ak":{"B":"minimum detectable effect size","C":"hypothesis and the primary success metric"}},{"id":64,"question":"A team exposes a customer-support agent that can read tickets, draft replies, issue refunds and delete user accounts. Support staff only ever need to read tickets and draft replies. Applying least-privilege principles, which change best reduces risk?","options":{"A":"Add audit logging to the refund and delete tools so misuse can be investigated later.","B":"Remove the refund and delete tools from the agent configuration entirely.","C":"Keep every tool but require a confirmation prompt before refunds and deletions.","D":"Move the agent to a larger model that follows instructions more reliably."},"domain":3,"correct":["B"],"qk":"issue refunds and delete user accounts","ak":{"B":"Remove the refund and delete tools"}},{"id":65,"question":"An application sends the same 8,000-token system prompt and policy document on every request, followed by a short user message that changes each time. Latency and cost both matter. Which optimization addresses both most directly?","options":{"A":"Truncate the policy document to its first 1,000 tokens.","B":"Switch to the smallest available model regardless of task fit.","C":"Put the static system prompt and policy before the dynamic content and enable prompt caching.","D":"Move the policy document into a block of few-shot examples."},"domain":2,"correct":["C"],"qk":"8,000-token system prompt","ak":{"C":"enable prompt caching"}},{"id":66,"question":"A RAG system suddenly returns confident but incorrect answers right after a document refresh. Latency and the model version are unchanged. Where should you investigate first?","options":{"A":"A silent change to the model weights.","B":"The retrieval and indexing step returning stale or irrelevant chunks.","C":"A sampling temperature that is set too low.","D":"A context window that has become smaller."},"domain":4,"correct":["B"],"qk":"right after a document refresh","ak":{"B":"retrieval and indexing step"}},{"id":67,"question":"A contract-review assistant will replace a manual first review. The client requires at least 95% accuracy on each of its five contract types, measured before go-live. On 1,000 contracts already reviewed by lawyers, overall accuracy is 96%. What should the team do next?","options":{"A":"Go live, because 96% overall accuracy exceeds the 95% requirement.","B":"Measure accuracy separately for each contract type and fix any type below 95% before go-live.","C":"Switch to the most capable model to raise accuracy further, then go live.","D":"Go live and track complaints from the client's lawyers to find weak contract types."},"domain":4,"correct":["B"],"qk":"each of its five contract types","ak":{"B":"Measure accuracy separately for each contract type"}},{"id":68,"question":"A retailer uses Claude to process inbound freight quotes. Each quote must first have its costs and service terms extracted, then be validated against procurement policy, and only then turned into a carrier recommendation. The process must be predictable and auditable. Which architecture fits best?","options":{"A":"A fixed workflow of sequenced LLM calls for extraction, policy validation and recommendation, with checks between steps.","B":"A single prompt that interprets each quote and decides on its own whether further processing is needed.","C":"An autonomous agent that plans its own steps and chooses tools for every batch of quotes.","D":"Parallel LLM calls that extract, validate and recommend at the same time to reduce latency."},"domain":1,"correct":["A"],"qk":"predictable and auditable","ak":{"A":"fixed workflow of sequenced LLM calls"}},{"id":69,"question":"An organization standardizing Claude Code across many teams must enforce security settings that developers cannot override and distribute approved tools and workflows centrally. Which two actions should it take? (Select two.)","options":{"A":"Run a managed plugin marketplace that distributes approved skills, agents, hooks and MCP servers.","B":"Let developers install tools freely and audit local configurations every quarter.","C":"Enforce organization-wide controls with server-managed settings that lower levels cannot override.","D":"Publish recommended settings in a shared repository and ask each team to apply them.","E":"Keep approved tools in project-level configuration so each team can change or disable them."},"domain":7,"correct":["A","C"],"qk":"cannot override","ak":{"A":"managed plugin marketplace","C":"server-managed settings"}},{"id":70,"question":"A hospital network asks your team to build a Claude assistant that summarizes discharge notes for follow-up care coordinators. The innovation group already has a hackathon prototype and wants to move straight to choosing a model and an agent framework. Before committing to an architecture, which two pieces of information should you capture because they most change the design? (Select two.)","options":{"A":"The model tier used in the hackathon prototype, so the production design starts from a configuration already shown to work.","B":"Whether summaries are needed interactively during calls or can be produced overnight in batch, and the expected daily and peak volume.","C":"A complete list of features stakeholders may want in later phases, so the first release can be designed to support all of them.","D":"The number of prompting techniques the team intends to compare during the first sprint of prototype refinement.","E":"The data classification of the discharge notes and whether each summary must be traceable for audit and compliance review."},"domain":1,"correct":["B","E"],"qk":"most change the design","ak":{"B":"interactively during calls or can be produced overnight in batch","E":"data classification"}},{"id":71,"question":"A payments company scores card transactions with a streaming ML model that must decide within 40 milliseconds. Fraud analysts then spend about 25 minutes per flagged case writing an investigation narrative from transaction history, device data and prior notes. A product manager proposes moving fraud scoring to Claude so every decision comes with a natural-language explanation. What should you recommend?","options":{"A":"Move scoring to Claude on a lighter model tier with streaming responses, so the 40-millisecond budget is met while explanations are generated.","B":"Keep the ML model for real-time scoring and use Claude to draft investigation narratives for flagged cases, which analysts review and finalize.","C":"Replace both the ML model and the analysts' narratives with a Claude agent that scores, investigates and closes cases from end to end.","D":"Keep the ML model but have Claude re-score every transaction asynchronously, so its explanations can override scores the model gets wrong."},"domain":1,"correct":["B"],"qk":"within 40 milliseconds","ak":{"B":"Keep the ML model for real-time scoring"}},{"id":72,"question":"A customs brokerage uses Claude to read commercial invoices and return the import duty owed for each shipment. The system prompt contains the tariff schedule and instructs the model to calculate duty per line item. Audits find that about 3% of duty amounts are wrong, even when the goods were classified correctly. What is the best architectural change?","options":{"A":"Add worked calculation examples for each tariff band to the system prompt and ask the model to show its arithmetic step by step.","B":"Move to the most capable model tier for the calculation step and keep the lighter tier for reading and classifying invoices.","C":"Run the calculation prompt three times per invoice and accept the duty amount that at least two of the three runs agree on.","D":"Have Claude extract and classify line items, compute duty in code from the tariff table, and validate results before persisting."},"domain":1,"correct":["D"],"qk":"import duty","ak":{"D":"compute duty in code"}},{"id":73,"question":"An expense-processing service calls Claude synchronously from its upload API to extract and categorize receipts. During the last three days of each month, uploads rise about tenfold; the service hits rate-limit errors, uploads time out for employees, and some receipts are silently lost. Most month-end receipts only need to be processed before the finance close two days later. Which two changes best address the problem? (Select two.)","options":{"A":"Place an asynchronous queue between the upload API and the model layer, with retries and backoff, so uploads are acknowledged immediately.","B":"Move the extraction step to the most capable model tier so each request completes faster and fewer retries are needed at peak.","C":"Raise the client timeout on the upload API so employees wait until the synchronous model call completes during peak periods.","D":"Route non-urgent month-end receipts to batch processing that completes before the finance close, instead of real-time calls.","E":"Skip schema validation of extracted fields during month-end peaks and re-validate the affected records the following week."},"domain":1,"correct":["A","D"],"qk":"uploads rise about tenfold","ak":{"A":"asynchronous queue","D":"batch processing"}},{"id":74,"question":"A contract-extraction system has run for nine months. Reviewers corre
